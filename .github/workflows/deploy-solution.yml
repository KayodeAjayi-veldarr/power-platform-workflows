name: Reusable - Deploy Power Platform Solution from Git

on:
  workflow_call:
    inputs:
      project_key:
        description: Short project identifier
        required: true
        type: string

      source_ref:
        description: Branch, tag or commit containing the solution source
        required: true
        type: string

      solution_name:
        description: Power Platform solution unique name
        required: true
        type: string

      solution_source_folder:
        description: Folder containing the unpacked solution source
        required: true
        type: string

      solution_package_type:
        description: Unmanaged or Managed
        required: false
        default: Unmanaged
        type: string

      target_environment:
        description: Target environment name, URL or ID
        required: true
        type: string

      deployment_settings_file:
        description: Optional deployment settings JSON path
        required: false
        default: ""
        type: string

      force_overwrite:
        description: Force overwrite unmanaged customisations
        required: false
        default: true
        type: boolean

      publish_changes:
        description: Publish after successful import
        required: false
        default: true
        type: boolean

      asynchronous_import:
        description: Import the solution asynchronously
        required: false
        default: false
        type: boolean

      max_async_wait_minutes:
        description: Maximum PAC wait time in minutes
        required: false
        default: 60
        type: number

      upload_solution_artifact:
        description: Upload the exact deployed ZIP and logs
        required: false
        default: true
        type: boolean

      artifact_retention_days:
        description: Number of days to retain deployment artifacts
        required: false
        default: 14
        type: number

      commit_solution_zip:
        description: Commit the exact packed ZIP to the project repository
        required: false
        default: true
        type: boolean

      solution_zip_repository_folder:
        description: Repository folder where the generated ZIP is stored
        required: false
        default: power-platform-packages
        type: string

    secrets:
      pp_tenant_id:
        required: true

      pp_app_id:
        required: true

      pp_client_secret:
        required: true

    outputs:
      deployment_status:
        value: ${{ jobs.deploy.outputs.deployment_status }}

      target_environment_id:
        value: ${{ jobs.deploy.outputs.target_environment_id }}

      target_environment_name:
        value: ${{ jobs.deploy.outputs.target_environment_name }}

      target_environment_url:
        value: ${{ jobs.deploy.outputs.target_environment_url }}

      maker_environment_url:
        value: ${{ jobs.deploy.outputs.maker_environment_url }}

      solutions_url:
        value: ${{ jobs.deploy.outputs.solutions_url }}

      solution_url:
        value: ${{ jobs.deploy.outputs.solution_url }}

      solution_version:
        value: ${{ jobs.deploy.outputs.solution_version }}

      solution_artifact_name:
        value: ${{ jobs.deploy.outputs.solution_artifact_name }}

      solution_repository_path:
        value: ${{ jobs.deploy.outputs.solution_repository_path }}

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy Power Platform solution
    runs-on: windows-latest
    timeout-minutes: 150

    concurrency:
      group: >-
        power-platform-deploy-${{ github.repository }}-${{
        inputs.target_environment }}-${{ inputs.solution_name }}
      cancel-in-progress: false

    outputs:
      deployment_status: ${{ steps.import_solution.outputs.deployment_status }}
      target_environment_id: ${{ steps.environment.outputs.environment_id }}
      target_environment_name: ${{ steps.environment.outputs.environment_name }}
      target_environment_url: ${{ steps.environment.outputs.environment_url }}
      maker_environment_url: ${{ steps.links.outputs.maker_environment_url }}
      solutions_url: ${{ steps.links.outputs.solutions_url }}
      solution_url: ${{ steps.links.outputs.solution_url }}
      solution_version: ${{ steps.solution_details.outputs.solution_version }}
      solution_artifact_name: ${{ steps.package.outputs.artifact_name }}
      solution_repository_path: ${{ steps.commit_package.outputs.repository_path }}

    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: "true"

      - name: Validate deployment inputs
        shell: pwsh
        env:
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          PACKAGE_TYPE: ${{ inputs.solution_package_type }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          $ErrorActionPreference = "Stop"

          if (
            -not (
              Test-Path `
                -LiteralPath $env:SOLUTION_SOURCE_FOLDER `
                -PathType Container
            )
          ) {
            throw "solution_source_folder was not found: $env:SOLUTION_SOURCE_FOLDER"
          }

          if (@("Unmanaged", "Managed") -notcontains $env:PACKAGE_TYPE) {
            throw "solution_package_type must be Unmanaged or Managed."
          }

          if ([string]::IsNullOrWhiteSpace($env:TARGET_ENVIRONMENT)) {
            throw "target_environment is required."
          }

      - name: Pack deployment solution
        id: package
        shell: pwsh
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          PACKAGE_TYPE: ${{ inputs.solution_package_type }}
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path `
            $env:RUNNER_TEMP `
            "power-platform-deployment"

          New-Item `
            -ItemType Directory `
            -Path $artifactRoot `
            -Force |
            Out-Null

          $packageFileName = if (
            $env:PACKAGE_TYPE -eq "Managed"
          ) {
            "$($env:SOLUTION_NAME)_managed.zip"
          }
          else {
            "$($env:SOLUTION_NAME).zip"
          }

          $solutionZip = Join-Path `
            $artifactRoot `
            $packageFileName

          if (Test-Path -LiteralPath $solutionZip) {
            Remove-Item -LiteralPath $solutionZip -Force
          }

          $packLog = Join-Path `
            $artifactRoot `
            "solution-pack.log"

          & pac solution pack `
            --zipfile "$solutionZip" `
            --folder "$env:SOLUTION_SOURCE_FOLDER" `
            --packagetype "$env:PACKAGE_TYPE" `
            --errorlevel Verbose `
            --log "$packLog"

          if ($LASTEXITCODE -ne 0) {
            throw "The deployment solution could not be packed."
          }

          $artifactName = (
            "$($env:SOLUTION_NAME)-deployment-" +
            "${{ github.run_number }}-${{ github.run_attempt }}"
          )

          "artifact_root=$artifactRoot" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "solution_zip=$solutionZip" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "artifact_name=$artifactName" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "package_file_name=$packageFileName" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Commit exact packed solution ZIP
        id: commit_package
        if: inputs.commit_solution_zip
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          PACKAGE_FILE_NAME: ${{ steps.package.outputs.package_file_name }}
          ZIP_REPOSITORY_FOLDER: ${{ inputs.solution_zip_repository_folder }}
        run: |
          $ErrorActionPreference = "Stop"

          $branchName = $env:SOURCE_REF

          if ($branchName.StartsWith("refs/heads/")) {
            $branchName = $branchName.Substring(
              "refs/heads/".Length
            )
          }

          if (
            [string]::IsNullOrWhiteSpace($branchName) -or
            $branchName -match '^[0-9a-f]{40}$' -or
            $branchName.StartsWith("refs/tags/")
          ) {
            throw @"
          source_ref must be a branch when commit_solution_zip is enabled.

          Current value: $($env:SOURCE_REF)
          "@
          }

          $repositoryFolder = Join-Path `
            $env:GITHUB_WORKSPACE `
            $env:ZIP_REPOSITORY_FOLDER

          $solutionFolder = Join-Path `
            $repositoryFolder `
            $env:SOLUTION_NAME

          New-Item `
            -ItemType Directory `
            -Path $solutionFolder `
            -Force |
            Out-Null

          $repositoryZip = Join-Path `
            $solutionFolder `
            $env:PACKAGE_FILE_NAME

          Copy-Item `
            -LiteralPath "${{ steps.package.outputs.solution_zip }}" `
            -Destination $repositoryZip `
            -Force

          $relativePath = [System.IO.Path]::GetRelativePath(
            $env:GITHUB_WORKSPACE,
            $repositoryZip
          ).Replace('\', '/')

          git config user.name "github-actions[bot]"
          git config user.email `
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- $relativePath
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit `
              -m "chore: update packed $($env:SOLUTION_NAME) solution [skip ci]"

            git pull --rebase origin $branchName
            git push origin "HEAD:$branchName"
          }
          else {
            Write-Host "The packed solution ZIP has not changed."
          }

          "repository_path=$relativePath" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate for target environment lookup
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-deploy-admin" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Target environment lookup authentication failed."
          }

      - name: Resolve target environment exactly
        id: environment
        shell: pwsh
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-PropertyValue {
            param(
              [AllowNull()]
              [object]$Object,

              [Parameter(Mandatory)]
              [string[]]$Names
            )

            if ($null -eq $Object) {
              return ""
            }

            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties[$name]

              if (
                $null -ne $property -and
                -not [string]::IsNullOrWhiteSpace(
                  [string]$property.Value
                )
              ) {
                return [string]$property.Value
              }
            }

            return ""
          }

          function Normalize-Url {
            param(
              [AllowNull()]
              [string]$Value
            )

            if ([string]::IsNullOrWhiteSpace($Value)) {
              return ""
            }

            return $Value.Trim().TrimEnd('/').ToLowerInvariant()
          }

          $raw = & pac admin list `
            --environment "$env:REQUESTED_ENVIRONMENT" `
            --json

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list Power Platform environments."
          }

          $jsonText = $raw -join "`n"

          if ([string]::IsNullOrWhiteSpace($jsonText)) {
            throw "The target environment was not found."
          }

          $parsed = $jsonText | ConvertFrom-Json

          $items = if (
            $null -ne $parsed.PSObject.Properties["value"]
          ) {
            @($parsed.value)
          }
          else {
            @($parsed)
          }

          $match = $null

          foreach (
            $item in @(
              $items |
                Where-Object { $null -ne $_ }
            )
          ) {
            $name = Get-PropertyValue `
              -Object $item `
              -Names @(
                "Environment",
                "DisplayName",
                "EnvironmentName",
                "FriendlyName",
                "Name"
              )

            $id = Get-PropertyValue `
              -Object $item `
              -Names @(
                "Environment Id",
                "EnvironmentId",
                "Id"
              )

            $url = Get-PropertyValue `
              -Object $item `
              -Names @(
                "Environment Url",
                "EnvironmentUrl",
                "Url"
              )

            if (
              $name -ceq $env:REQUESTED_ENVIRONMENT -or
              $id -ceq $env:REQUESTED_ENVIRONMENT -or
              (
                -not [string]::IsNullOrWhiteSpace($url) -and
                (Normalize-Url -Value $url) -eq
                (Normalize-Url -Value $env:REQUESTED_ENVIRONMENT)
              )
            ) {
              $match = $item
              break
            }
          }

          if ($null -eq $match) {
            throw "The target environment could not be resolved exactly."
          }

          $environmentId = Get-PropertyValue `
            -Object $match `
            -Names @(
              "Environment Id",
              "EnvironmentId",
              "Id"
            )

          $environmentName = Get-PropertyValue `
            -Object $match `
            -Names @(
              "Environment",
              "DisplayName",
              "EnvironmentName",
              "FriendlyName",
              "Name"
            )

          $environmentUrl = Get-PropertyValue `
            -Object $match `
            -Names @(
              "Environment Url",
              "EnvironmentUrl",
              "Url"
            )

          if (
            [string]::IsNullOrWhiteSpace($environmentId) -or
            [string]::IsNullOrWhiteSpace($environmentUrl)
          ) {
            throw "The target environment ID or URL could not be resolved."
          }

          "environment_id=$environmentId" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "environment_name=$environmentName" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "environment_url=$environmentUrl" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate to target environment
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
          ENVIRONMENT_URL: ${{ steps.environment.outputs.environment_url }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-deploy-target" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID" `
            --environment "$env:ENVIRONMENT_URL"

          if ($LASTEXITCODE -ne 0) {
            throw "Authentication to the deployment target failed."
          }

      - name: Import solution into target environment
        id: import_solution
        shell: pwsh
        env:
          SOLUTION_ZIP: ${{ steps.package.outputs.solution_zip }}
          ENVIRONMENT_URL: ${{ steps.environment.outputs.environment_url }}
          SETTINGS_FILE: ${{ inputs.deployment_settings_file }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite }}
          PUBLISH_CHANGES: ${{ inputs.publish_changes }}
          ASYNC_IMPORT: ${{ inputs.asynchronous_import }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
          ARTIFACT_ROOT: ${{ steps.package.outputs.artifact_root }}
        run: |
          $ErrorActionPreference = "Stop"

          $importLog = Join-Path `
            $env:ARTIFACT_ROOT `
            "solution-import.log"

          $arguments = @(
            "solution",
            "import",
            "--path",
            $env:SOLUTION_ZIP,
            "--environment",
            $env:ENVIRONMENT_URL,
            "--max-async-wait-time",
            $env:MAX_WAIT
          )

          if ($env:FORCE_OVERWRITE -eq "true") {
            $arguments += "--force-overwrite"
          }

          if ($env:PUBLISH_CHANGES -eq "true") {
            $arguments += "--publish-changes"
          }

          if ($env:ASYNC_IMPORT -eq "true") {
            $arguments += "--async"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:SETTINGS_FILE)) {
            if (
              -not (
                Test-Path `
                  -LiteralPath $env:SETTINGS_FILE `
                  -PathType Leaf
              )
            ) {
              throw "deployment_settings_file was not found: $env:SETTINGS_FILE"
            }

            $arguments += @(
              "--settings-file",
              $env:SETTINGS_FILE
            )
          }

          $output = & pac @arguments 2>&1
          $exitCode = $LASTEXITCODE

          $output |
            Tee-Object `
              -FilePath $importLog |
            Write-Host

          if ($exitCode -ne 0) {
            "deployment_status=Failed" |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

            throw "The solution could not be imported into the target environment."
          }

          "deployment_status=Succeeded" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Retrieve deployed solution details
        id: solution_details
        shell: pwsh
        env:
          ENVIRONMENT_URL: ${{ steps.environment.outputs.environment_url }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-PropertyValue {
            param(
              [AllowNull()]
              [object]$Object,

              [Parameter(Mandatory)]
              [string[]]$Names
            )

            if ($null -eq $Object) {
              return ""
            }

            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties[$name]

              if (
                $null -ne $property -and
                -not [string]::IsNullOrWhiteSpace(
                  [string]$property.Value
                )
              ) {
                return [string]$property.Value
              }
            }

            return ""
          }

          $raw = & pac solution list `
            --environment "$env:ENVIRONMENT_URL" `
            --json

          if ($LASTEXITCODE -ne 0) {
            "solution_id=" |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

            "solution_version=" |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

            exit 0
          }

          $jsonText = $raw -join "`n"

          if ([string]::IsNullOrWhiteSpace($jsonText)) {
            "solution_id=" |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

            "solution_version=" |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

            exit 0
          }

          $parsed = $jsonText | ConvertFrom-Json

          $items = if ($parsed -is [System.Array]) {
            @($parsed)
          }
          elseif (
            $null -ne $parsed.PSObject.Properties["value"]
          ) {
            @($parsed.value)
          }
          else {
            @($parsed)
          }

          $match = $null

          foreach (
            $item in @(
              $items |
                Where-Object { $null -ne $_ }
            )
          ) {
            $uniqueName = Get-PropertyValue `
              -Object $item `
              -Names @(
                "SolutionUniqueName",
                "UniqueName",
                "Unique Name",
                "Name"
              )

            if ($uniqueName -ieq $env:SOLUTION_NAME) {
              $match = $item
              break
            }
          }

          $solutionId = Get-PropertyValue `
            -Object $match `
            -Names @(
              "Id",
              "SolutionId",
              "Solution Id"
            )

          $solutionVersion = Get-PropertyValue `
            -Object $match `
            -Names @(
              "Version",
              "SolutionVersion"
            )

          "solution_id=$solutionId" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "solution_version=$solutionVersion" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build deployment links
        id: links
        shell: pwsh
        env:
          ENVIRONMENT_ID: ${{ steps.environment.outputs.environment_id }}
          SOLUTION_ID: ${{ steps.solution_details.outputs.solution_id }}
        run: |
          $makerUrl = (
            "https://make.powerapps.com/environments/" +
            $env:ENVIRONMENT_ID
          )

          $solutionsUrl = "$makerUrl/solutions"

          $solutionUrl = if (
            [string]::IsNullOrWhiteSpace(
              $env:SOLUTION_ID
            )
          ) {
            $solutionsUrl
          }
          else {
            "$solutionsUrl/$env:SOLUTION_ID"
          }

          "maker_environment_url=$makerUrl" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "solutions_url=$solutionsUrl" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "solution_url=$solutionUrl" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload deployment artifact
        if: inputs.upload_solution_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_root }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Add deployment summary
        shell: pwsh
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TARGET_NAME: ${{ steps.environment.outputs.environment_name }}
          TARGET_URL: ${{ steps.environment.outputs.environment_url }}
          MAKER_URL: ${{ steps.links.outputs.maker_environment_url }}
          SOLUTIONS_URL: ${{ steps.links.outputs.solutions_url }}
          SOLUTION_URL: ${{ steps.links.outputs.solution_url }}
          SOLUTION_VERSION: ${{ steps.solution_details.outputs.solution_version }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          REPOSITORY_PATH: ${{ steps.commit_package.outputs.repository_path }}
        run: |
          @"
          # Power Platform deployment complete

          **Project:** $env:PROJECT_KEY

          **Source ref:** ``$env:SOURCE_REF``

          **Target environment:** [$env:TARGET_NAME]($env:TARGET_URL)

          **Power Apps:** [Open maker environment]($env:MAKER_URL)

          **Solutions:** [Open Solutions]($env:SOLUTIONS_URL)

          **Solution:** [Open deployed solution]($env:SOLUTION_URL)

          **Solution version:** ``$env:SOLUTION_VERSION``

          **Exact deployed package and logs:** ``$env:ARTIFACT_NAME``

          **Repository package:** ``$env:REPOSITORY_PATH``
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
