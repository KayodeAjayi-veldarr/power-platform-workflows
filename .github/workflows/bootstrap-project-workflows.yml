name: Reusable - Bootstrap Power Platform Project Workflows

on:
  workflow_call:
    inputs:
      project_key:
        description: Short project identifier
        required: true
        type: string
      solution_name:
        description: Power Platform solution unique name
        required: true
        type: string
      default_solution_folder:
        description: Repository folder used for the unpacked solution
        required: false
        default: power-platform-solution
        type: string
      default_developer_alias:
        description: Short developer identifier shown in manual workflow forms
        required: true
        type: string
      default_developer_upn:
        description: Developer Microsoft 365 user principal name
        required: true
        type: string
      base_branch:
        description: Repository base branch
        required: false
        default: main
        type: string
      target_region:
        description: Default Power Platform region for generated environments
        required: false
        default: europe
        type: string
      target_currency:
        description: Default currency code for generated environments
        required: false
        default: GBP
        type: string
      target_language:
        description: Default language for generated environments
        required: false
        default: English
        type: string
      checker_geo:
        description: Power Platform checker geography
        required: false
        default: UnitedKingdom
        type: string
      developer_environment_suffix:
        description: Suffix used for generated developer environments
        required: false
        default: DEV
        type: string
      checker_rule_set:
        description: Power Platform checker ruleset name
        required: false
        default: Solution Checker
        type: string
      default_build_environment:
        description: Optional clean build environment name, URL or ID
        required: false
        default: ""
        type: string
      reusable_workflow_repository:
        description: Repository containing the shared reusable workflows
        required: false
        default: KayodeAjayi-Veldarr/power-platform-workflows
        type: string
      reusable_workflow_ref:
        description: Branch, tag or SHA for the shared reusable workflows
        required: false
        default: main
        type: string
      replace_existing_workflows:
        description: Replace existing generated caller workflows
        required: false
        default: true
        type: boolean
      commit_message:
        description: Commit message for the generated workflows
        required: false
        default: Configure Power Platform project workflows
        type: string

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate project workflows
    runs-on: windows-latest

    steps:
      - name: Check out project repository
        uses: actions/checkout@v4
        with:
          path: project

      - name: Check out reusable workflow repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.reusable_workflow_repository }}
          ref: ${{ inputs.reusable_workflow_ref }}
          path: workflow-library

      - name: Write project details
        shell: pwsh
        env:
          PROJECT_PATH: ${{ github.workspace }}/project
          PROJECT_KEY: ${{ inputs.project_key }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          DEFAULT_SOLUTION_FOLDER: ${{ inputs.default_solution_folder }}
          DEFAULT_DEVELOPER_ALIAS: ${{ inputs.default_developer_alias }}
          DEFAULT_DEVELOPER_UPN: ${{ inputs.default_developer_upn }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          TARGET_REGION: ${{ inputs.target_region }}
          TARGET_CURRENCY: ${{ inputs.target_currency }}
          TARGET_LANGUAGE: ${{ inputs.target_language }}
          CHECKER_GEO: ${{ inputs.checker_geo }}
          DEVELOPER_ENVIRONMENT_SUFFIX: ${{ inputs.developer_environment_suffix }}
          CHECKER_RULE_SET: ${{ inputs.checker_rule_set }}
          DEFAULT_BUILD_ENVIRONMENT: ${{ inputs.default_build_environment }}
          REUSABLE_WORKFLOW_REPOSITORY: ${{ inputs.reusable_workflow_repository }}
          REUSABLE_WORKFLOW_REF: ${{ inputs.reusable_workflow_ref }}
        run: |
          $ErrorActionPreference = "Stop"

          $detailsPath = Join-Path $env:RUNNER_TEMP "PROJECT-DETAILS.generated.txt"

          $lines = @(
            "Destination repository: $env:PROJECT_PATH",
            "Project key: $env:PROJECT_KEY",
            "Solution: $env:SOLUTION_NAME",
            "Default solution folder: $env:DEFAULT_SOLUTION_FOLDER",
            "Default developer alias: $env:DEFAULT_DEVELOPER_ALIAS",
            "Default developer UPN: $env:DEFAULT_DEVELOPER_UPN",
            "",
            "Base branch: $env:BASE_BRANCH",
            "Target region: $env:TARGET_REGION",
            "Target currency: $env:TARGET_CURRENCY",
            "Target language: $env:TARGET_LANGUAGE",
            "Solution Checker geography: $env:CHECKER_GEO",
            "Developer environment suffix: $env:DEVELOPER_ENVIRONMENT_SUFFIX",
            "Solution Checker rule set: $env:CHECKER_RULE_SET",
            "",
            "Default build environment: $env:DEFAULT_BUILD_ENVIRONMENT",
            "Target environment templates:",
            "Target security group ID:",
            "Validation environment templates:",
            "Validation security group ID:",
            "Automation role: System Administrator",
            "Developer role: System Administrator",
            "",
            "Reusable workflow repository: $env:REUSABLE_WORKFLOW_REPOSITORY",
            "Reusable workflow ref: $env:REUSABLE_WORKFLOW_REF"
          )

          Set-Content -LiteralPath $detailsPath -Value $lines -Encoding UTF8
          "details_path=$detailsPath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
        id: details

      - name: Generate caller workflows
        shell: pwsh
        env:
          REPLACE_EXISTING: ${{ inputs.replace_existing_workflows }}
          DETAILS_PATH: ${{ steps.details.outputs.details_path }}
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:GITHUB_WORKSPACE "workflow-library\project-workflows-template\Install-ProjectWorkflows.ps1"

          if ($env:REPLACE_EXISTING -eq "true") {
            pwsh -NoProfile -ExecutionPolicy Bypass -File $installer -ConfigurationFile $env:DETAILS_PATH -Force
          }
          else {
            pwsh -NoProfile -ExecutionPolicy Bypass -File $installer -ConfigurationFile $env:DETAILS_PATH
          }

      - name: Commit generated workflows
        shell: pwsh
        working-directory: project
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows

          $changes = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "Project workflows are already up to date."
            return
          }

          git commit -m $env:COMMIT_MESSAGE
          git push

