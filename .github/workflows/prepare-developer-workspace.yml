# Reusable Power Platform workflow.
#
# A project repository calls this workflow and supplies the project-specific
# values. The shared workflow can prepare a solution from either:
#
# 1. Repository: pack the unpacked solution already stored in GitHub.
# 2. Environment: export a named solution from a source Dataverse environment.
#
# The target environment is created only when it does not exist. Existing
# environments are reused and receive the latest solution package.
#
# This workflow never deletes an environment.

name: Reusable - Prepare Power Platform Developer Workspace

on:
  workflow_call:
    inputs:
      # ============================================================
      # Project and developer
      # ============================================================

      project_key:
        description: Short project identifier, for example LUG-CHESS
        required: true
        type: string

      developer_alias:
        description: Short developer identifier used in generated names
        required: true
        type: string

      developer_upn:
        description: Developer Microsoft 365 UPN or Entra Object ID
        required: true
        type: string

      # ============================================================
      # Solution source
      # ============================================================

      solution_source_mode:
        description: Repository or Environment
        required: false
        default: Repository
        type: string

      solution_name:
        description: Canonical solution unique name and package name
        required: true
        type: string

      solution_source_folder:
        description: Unpacked solution folder used in Repository mode
        required: false
        default: ""
        type: string

      source_ref:
        description: Git branch or tag used in Repository mode
        required: false
        default: main
        type: string

      source_environment:
        description: Source Dataverse environment URL or ID used in Environment mode
        required: false
        default: ""
        type: string

      source_solution_name:
        description: Source solution unique name. Defaults to solution_name when blank.
        required: false
        default: ""
        type: string

      source_export_managed:
        description: Export a managed package in Environment mode
        required: false
        default: false
        type: boolean

      source_export_async:
        description: Export the source solution asynchronously
        required: false
        default: true
        type: boolean

      source_export_include:
        description: Optional comma-separated export settings such as general,autonumbering
        required: false
        default: ""
        type: string

      solution_package_type:
        description: Unmanaged or Managed when packing in Repository mode
        required: false
        default: Unmanaged
        type: string

      deployment_settings_file:
        description: Optional deployment settings JSON file in the project repository
        required: false
        default: ""
        type: string

      # ============================================================
      # Target environment
      # ============================================================

      environment_type:
        description: Developer, Sandbox, Production, Trial, Teams or SubscriptionBasedTrial
        required: false
        default: Developer
        type: string

      environment_name:
        description: Full target environment name. Generated when blank.
        required: false
        default: ""
        type: string

      environment_domain:
        description: Target Dataverse domain. Generated when blank.
        required: false
        default: ""
        type: string

      environment_suffix:
        description: Suffix used in generated environment names
        required: false
        default: DEV
        type: string

      environment_region:
        description: Target Power Platform region
        required: false
        default: europe
        type: string

      environment_currency:
        description: Target Dataverse currency code
        required: false
        default: GBP
        type: string

      environment_language:
        description: Target environment language
        required: false
        default: English
        type: string

      environment_templates:
        description: Optional comma-separated Dynamics 365 templates
        required: false
        default: ""
        type: string

      environment_security_group_id:
        description: Optional Entra security group ID
        required: false
        default: ""
        type: string

      # ============================================================
      # Access
      # ============================================================

      assign_automation_user:
        description: Add or confirm the automation application user
        required: false
        default: true
        type: boolean

      automation_role:
        description: Dataverse role assigned to the automation application
        required: false
        default: System Administrator
        type: string

      assign_developer:
        description: Add or confirm the human developer
        required: false
        default: true
        type: boolean

      developer_role:
        description: Dataverse role assigned to the developer
        required: false
        default: System Administrator
        type: string

      # ============================================================
      # Import behaviour
      # ============================================================

      force_overwrite:
        description: Overwrite unmanaged customisations
        required: false
        default: true
        type: boolean

      publish_changes:
        description: Publish after a successful import
        required: false
        default: true
        type: boolean

      asynchronous_import:
        description: Import the solution asynchronously
        required: false
        default: false
        type: boolean

      activate_plugins:
        description: Activate plug-ins and workflows during import
        required: false
        default: false
        type: boolean

      skip_dependency_check:
        description: Skip dependencies marked as product updates
        required: false
        default: false
        type: boolean

      skip_lower_version:
        description: Skip import when the same or a higher version exists
        required: false
        default: false
        type: boolean

      # ============================================================
      # Timing and diagnostics
      # ============================================================

      max_async_wait_minutes:
        description: PAC CLI wait time for long-running operations
        required: false
        default: 60
        type: number

      environment_lookup_attempts:
        description: Attempts used to retrieve the target environment
        required: false
        default: 20
        type: number

      environment_lookup_delay_seconds:
        description: Delay between environment lookup attempts
        required: false
        default: 30
        type: number

      upload_solution_artifact:
        description: Upload the generated solution package and diagnostic files
        required: false
        default: true
        type: boolean

      artifact_retention_days:
        description: Number of days to retain the artifact
        required: false
        default: 7
        type: number

      next_step_message:
        description: Project-specific instruction displayed in the run summary
        required: false
        default: Validate the solution before beginning development.
        type: string

    secrets:
      # Credentials used for target tenant administration and import.
      pp_tenant_id:
        required: true

      pp_app_id:
        required: true

      pp_client_secret:
        required: true

      # Optional credentials for a source environment in another tenant.
      # When omitted, the target credentials above are reused.
      source_pp_tenant_id:
        required: false

      source_pp_app_id:
        required: false

      source_pp_client_secret:
        required: false

    outputs:
      environment_id:
        description: Target environment ID
        value: ${{ jobs.prepare-workspace.outputs.environment_id }}

      environment_name:
        description: Target environment name
        value: ${{ jobs.prepare-workspace.outputs.environment_name }}

      environment_url:
        description: Target environment URL
        value: ${{ jobs.prepare-workspace.outputs.environment_url }}

      solution_artifact_name:
        description: Generated solution artifact name
        value: ${{ jobs.prepare-workspace.outputs.solution_artifact_name }}

permissions:
  contents: read

jobs:
  prepare-workspace:
    name: Prepare Power Platform developer workspace
    runs-on: windows-latest
    timeout-minutes: 120

    concurrency:
      group: >-
        power-platform-${{ github.repository }}-${{
        inputs.project_key }}-${{ inputs.developer_alias }}
      cancel-in-progress: false

    outputs:
      environment_id: ${{ steps.environment_details.outputs.environment_id }}
      environment_name: ${{ steps.workspace_names.outputs.environment_name }}
      environment_url: ${{ steps.environment_details.outputs.environment_url }}
      solution_artifact_name: ${{ steps.package_details.outputs.artifact_name }}

    steps:
      # The checkout action retrieves the project repository that called
      # this shared workflow, not the shared workflow repository.
      - name: Check out calling project
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_ref }}

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: "true"

      - name: Validate configuration
        shell: pwsh
        env:
          SOURCE_MODE: ${{ inputs.solution_source_mode }}
          SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
          SOLUTION_PACKAGE_TYPE: ${{ inputs.solution_package_type }}
          ENVIRONMENT_TYPE: ${{ inputs.environment_type }}
          SECURITY_GROUP_ID: ${{ inputs.environment_security_group_id }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
          LOOKUP_ATTEMPTS: ${{ inputs.environment_lookup_attempts }}
          LOOKUP_DELAY: ${{ inputs.environment_lookup_delay_seconds }}
          RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        run: |
          $ErrorActionPreference = "Stop"

          $allowedSourceModes = @("Repository", "Environment")
          if ($allowedSourceModes -notcontains $env:SOURCE_MODE) {
            throw "solution_source_mode must be Repository or Environment."
          }

          if ($env:SOURCE_MODE -eq "Repository") {
            if (
              [string]::IsNullOrWhiteSpace($env:SOURCE_FOLDER) -or
              -not (
                Test-Path `
                  -LiteralPath $env:SOURCE_FOLDER `
                  -PathType Container
              )
            ) {
              throw @"
          Repository mode requires a valid solution_source_folder.

          Supplied value:
          $env:SOURCE_FOLDER
          "@
            }

            if (@("Unmanaged", "Managed") -notcontains $env:SOLUTION_PACKAGE_TYPE) {
              throw "solution_package_type must be Unmanaged or Managed."
            }
          }

          if (
            $env:SOURCE_MODE -eq "Environment" -and
            [string]::IsNullOrWhiteSpace($env:SOURCE_ENVIRONMENT)
          ) {
            throw "Environment mode requires source_environment."
          }

          $allowedEnvironmentTypes = @(
            "Developer",
            "Sandbox",
            "Production",
            "Trial",
            "Teams",
            "SubscriptionBasedTrial"
          )

          if ($allowedEnvironmentTypes -notcontains $env:ENVIRONMENT_TYPE) {
            throw "Unsupported environment_type: $env:ENVIRONMENT_TYPE"
          }

          if (
            $env:ENVIRONMENT_TYPE -eq "Teams" -and
            [string]::IsNullOrWhiteSpace($env:SECURITY_GROUP_ID)
          ) {
            throw "A Teams environment requires environment_security_group_id."
          }

          foreach ($setting in @(
            @{ Name = "max_async_wait_minutes"; Value = $env:MAX_WAIT },
            @{ Name = "environment_lookup_attempts"; Value = $env:LOOKUP_ATTEMPTS },
            @{ Name = "environment_lookup_delay_seconds"; Value = $env:LOOKUP_DELAY },
            @{ Name = "artifact_retention_days"; Value = $env:RETENTION_DAYS }
          )) {
            $parsed = 0
            if (
              -not [int]::TryParse([string]$setting.Value, [ref]$parsed) -or
              $parsed -lt 1
            ) {
              throw "$($setting.Name) must be greater than zero."
            }
          }

          $pacCommand = Get-Command pac -ErrorAction SilentlyContinue
          if ($null -eq $pacCommand) {
            throw "PAC CLI was installed but pac is not available on PATH."
          }

          Write-Host "PAC CLI: $($pacCommand.Source)"
          Write-Host "Solution source mode: $env:SOURCE_MODE"
          Write-Host "Target environment type: $env:ENVIRONMENT_TYPE"

      - name: Generate target environment name and domain
        id: workspace_names
        shell: pwsh
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
          DEVELOPER_ALIAS: ${{ inputs.developer_alias }}
          REQUESTED_NAME: ${{ inputs.environment_name }}
          REQUESTED_DOMAIN: ${{ inputs.environment_domain }}
          ENVIRONMENT_SUFFIX: ${{ inputs.environment_suffix }}
        run: |
          $ErrorActionPreference = "Stop"

          function Convert-ToSafeName {
            param([Parameter(Mandatory)][string]$Value)

            $result = $Value.ToUpperInvariant()
            $result = $result -replace '[^A-Z0-9-]', '-'
            $result = $result -replace '-+', '-'
            return $result.Trim('-')
          }

          function Convert-ToSafeDomain {
            param([Parameter(Mandatory)][string]$Value)

            $result = $Value.ToLowerInvariant()
            $result = $result -replace '[^a-z0-9-]', '-'
            $result = $result -replace '-+', '-'
            return $result.Trim('-')
          }

          $projectKey = Convert-ToSafeName $env:PROJECT_KEY
          $developerAlias = Convert-ToSafeName $env:DEVELOPER_ALIAS
          $suffix = Convert-ToSafeName $env:ENVIRONMENT_SUFFIX

          if ([string]::IsNullOrWhiteSpace($env:REQUESTED_NAME)) {
            $environmentName = "$projectKey-$developerAlias-$suffix"
          }
          else {
            $environmentName = $env:REQUESTED_NAME.Trim()
          }

          if ([string]::IsNullOrWhiteSpace($env:REQUESTED_DOMAIN)) {
            $environmentDomain = Convert-ToSafeDomain `
              "$projectKey-$developerAlias-$suffix"
          }
          else {
            $environmentDomain = Convert-ToSafeDomain $env:REQUESTED_DOMAIN
          }

          if ([string]::IsNullOrWhiteSpace($environmentName)) {
            throw "A valid target environment name could not be generated."
          }

          if ([string]::IsNullOrWhiteSpace($environmentDomain)) {
            throw "A valid target environment domain could not be generated."
          }

          Write-Host "Target environment name: $environmentName"
          Write-Host "Target environment domain: $environmentDomain"

          "environment_name=$environmentName" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "environment_domain=$environmentDomain" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate for target tenant administration
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($name in @(
            "PP_TENANT_ID",
            "PP_APP_ID",
            "PP_CLIENT_SECRET"
          )) {
            $value = (Get-Item "Env:$name" -ErrorAction SilentlyContinue).Value

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Required secret $name is missing."
            }
          }

          pac auth create `
            --name "GitHub-PP-Admin" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Power Platform administration authentication failed."
          }

          pac auth who

      - name: Find existing target environment
        id: find_environment
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-PropertyValue {
            param([object]$Object, [string[]]$Names)

            if ($null -eq $Object) {
              return $null
            }

            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties[$name]

              if (
                $null -ne $property -and
                -not [string]::IsNullOrWhiteSpace([string]$property.Value)
              ) {
                return [string]$property.Value
              }
            }

            return $null
          }

          $raw = & pac admin list --name "$env:ENVIRONMENT_NAME" --json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to retrieve Power Platform environments."
          }

          $text = $raw -join "`n"
          if ([string]::IsNullOrWhiteSpace($text)) {
            "exists=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          try {
            $parsed = $text | ConvertFrom-Json
          }
          catch {
            Write-Host $text
            throw "The environment list response was not valid JSON."
          }

          if ($null -ne $parsed.value) {
            $environments = @($parsed.value)
          }
          else {
            $environments = @($parsed)
          }

          $match = $null

          foreach ($environment in $environments) {
            $name = Get-PropertyValue `
              $environment `
              @("Environment", "DisplayName", "EnvironmentName", "FriendlyName")

            if ($name -eq $env:ENVIRONMENT_NAME) {
              $match = $environment
              break
            }
          }

          if ($null -eq $match) {
            Write-Host "Target environment does not currently exist."
            "exists=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $id = Get-PropertyValue `
            $match `
            @("EnvironmentId", "Environment Id", "Id")

          $url = Get-PropertyValue `
            $match `
            @("EnvironmentUrl", "Environment Url", "Url")

          Write-Host "Existing target environment found."
          Write-Host "Environment ID: $id"
          Write-Host "Environment URL: $url"

          "exists=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_id=$id" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_url=$url" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create target environment when required
        if: steps.find_environment.outputs.exists == 'false'
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}
          ENVIRONMENT_DOMAIN: ${{ steps.workspace_names.outputs.environment_domain }}
          ENVIRONMENT_TYPE: ${{ inputs.environment_type }}
          ENVIRONMENT_REGION: ${{ inputs.environment_region }}
          ENVIRONMENT_CURRENCY: ${{ inputs.environment_currency }}
          ENVIRONMENT_LANGUAGE: ${{ inputs.environment_language }}
          ENVIRONMENT_TEMPLATES: ${{ inputs.environment_templates }}
          SECURITY_GROUP_ID: ${{ inputs.environment_security_group_id }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "--log-to-console",
            "admin",
            "create",
            "--name",
            $env:ENVIRONMENT_NAME,
            "--type",
            $env:ENVIRONMENT_TYPE,
            "--region",
            $env:ENVIRONMENT_REGION,
            "--currency",
            $env:ENVIRONMENT_CURRENCY,
            "--domain",
            $env:ENVIRONMENT_DOMAIN,
            "--language",
            $env:ENVIRONMENT_LANGUAGE,
            "--max-async-wait-time",
            $env:MAX_WAIT,
            "--json"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:ENVIRONMENT_TEMPLATES)) {
            $arguments += @("--templates", $env:ENVIRONMENT_TEMPLATES)
          }

          if (-not [string]::IsNullOrWhiteSpace($env:SECURITY_GROUP_ID)) {
            $arguments += @("--security-group-id", $env:SECURITY_GROUP_ID)
          }

          & pac @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "The target Power Platform environment could not be created."
          }

      - name: Retrieve target environment details
        id: environment_details
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}
          LOOKUP_ATTEMPTS: ${{ inputs.environment_lookup_attempts }}
          LOOKUP_DELAY: ${{ inputs.environment_lookup_delay_seconds }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-PropertyValue {
            param([object]$Object, [string[]]$Names)

            if ($null -eq $Object) {
              return $null
            }

            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties[$name]

              if (
                $null -ne $property -and
                -not [string]::IsNullOrWhiteSpace([string]$property.Value)
              ) {
                return [string]$property.Value
              }
            }

            return $null
          }

          $maximumAttempts = [int]$env:LOOKUP_ATTEMPTS
          $delaySeconds = [int]$env:LOOKUP_DELAY

          $environmentId = $null
          $environmentUrl = $null

          for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
            Write-Host "Target environment lookup $attempt of $maximumAttempts."

            $raw = & pac admin list --name "$env:ENVIRONMENT_NAME" --json
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to retrieve Power Platform environments."
            }

            $text = $raw -join "`n"

            if (-not [string]::IsNullOrWhiteSpace($text)) {
              try {
                $parsed = $text | ConvertFrom-Json
              }
              catch {
                Write-Host $text
                throw "The environment list response was not valid JSON."
              }

              if ($null -ne $parsed.value) {
                $environments = @($parsed.value)
              }
              else {
                $environments = @($parsed)
              }

              foreach ($environment in $environments) {
                $name = Get-PropertyValue `
                  $environment `
                  @("Environment", "DisplayName", "EnvironmentName", "FriendlyName")

                if ($name -ne $env:ENVIRONMENT_NAME) {
                  continue
                }

                $environmentId = Get-PropertyValue `
                  $environment `
                  @("EnvironmentId", "Environment Id", "Id")

                $environmentUrl = Get-PropertyValue `
                  $environment `
                  @("EnvironmentUrl", "Environment Url", "Url")

                break
              }
            }

            if (
              -not [string]::IsNullOrWhiteSpace($environmentId) -and
              -not [string]::IsNullOrWhiteSpace($environmentUrl)
            ) {
              break
            }

            if ($attempt -lt $maximumAttempts) {
              Start-Sleep -Seconds $delaySeconds
            }
          }

          if ([string]::IsNullOrWhiteSpace($environmentId)) {
            throw "The target environment ID could not be identified."
          }

          if ([string]::IsNullOrWhiteSpace($environmentUrl)) {
            throw "The target environment URL could not be identified."
          }

          Write-Host "Target environment ID: $environmentId"
          Write-Host "Target environment URL: $environmentUrl"

          "environment_id=$environmentId" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "environment_url=$environmentUrl" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Assign automation application user
        if: inputs.assign_automation_user
        shell: pwsh
        env:
          PP_APP_ID: ${{ secrets.pp_app_id }}
          AUTOMATION_ROLE: ${{ inputs.automation_role }}
          ENVIRONMENT_ID: ${{ steps.environment_details.outputs.environment_id }}
        run: |
          $ErrorActionPreference = "Stop"

          pac --log-to-console admin assign-user `
            --environment "$env:ENVIRONMENT_ID" `
            --user "$env:PP_APP_ID" `
            --role "$env:AUTOMATION_ROLE" `
            --application-user

          if ($LASTEXITCODE -ne 0) {
            throw "The automation application user could not be assigned."
          }

      - name: Assign developer
        if: inputs.assign_developer
        shell: pwsh
        env:
          DEVELOPER_UPN: ${{ inputs.developer_upn }}
          DEVELOPER_ROLE: ${{ inputs.developer_role }}
          ENVIRONMENT_ID: ${{ steps.environment_details.outputs.environment_id }}
        run: |
          $ErrorActionPreference = "Stop"

          pac --log-to-console admin assign-user `
            --environment "$env:ENVIRONMENT_ID" `
            --user "$env:DEVELOPER_UPN" `
            --role "$env:DEVELOPER_ROLE"

          if ($LASTEXITCODE -ne 0) {
            throw "The developer could not be assigned."
          }

      - name: Create package output folder
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "power-platform-solutions"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null

          "PACKAGE_OUTPUT_FOLDER=$folder" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pack solution from repository
        if: inputs.solution_source_mode == 'Repository'
        shell: pwsh
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          PACKAGE_TYPE: ${{ inputs.solution_package_type }}
        run: |
          $ErrorActionPreference = "Stop"

          $solutionZip = Join-Path `
            $env:PACKAGE_OUTPUT_FOLDER `
            "$($env:SOLUTION_NAME).zip"

          $diagnosticLog = Join-Path `
            $env:PACKAGE_OUTPUT_FOLDER `
            "$($env:SOLUTION_NAME)-pack.log"

          pac --log-to-console solution pack `
            --zipfile "$solutionZip" `
            --folder "$env:SOURCE_FOLDER" `
            --packagetype "$env:PACKAGE_TYPE" `
            --errorlevel Verbose `
            --log "$diagnosticLog"

          if ($LASTEXITCODE -ne 0) {
            throw "The repository solution could not be packed."
          }

          "SOLUTION_ZIP=$solutionZip" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "DIAGNOSTIC_LOG=$diagnosticLog" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "EFFECTIVE_PACKAGE_TYPE=$env:PACKAGE_TYPE" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Authenticate to source environment
        if: inputs.solution_source_mode == 'Environment'
        shell: pwsh
        env:
          TARGET_TENANT_ID: ${{ secrets.pp_tenant_id }}
          TARGET_APP_ID: ${{ secrets.pp_app_id }}
          TARGET_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
          SOURCE_TENANT_ID: ${{ secrets.source_pp_tenant_id }}
          SOURCE_APP_ID: ${{ secrets.source_pp_app_id }}
          SOURCE_CLIENT_SECRET: ${{ secrets.source_pp_client_secret }}
          SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
        run: |
          $ErrorActionPreference = "Stop"

          $tenantId = $env:SOURCE_TENANT_ID
          $appId = $env:SOURCE_APP_ID
          $clientSecret = $env:SOURCE_CLIENT_SECRET

          if ([string]::IsNullOrWhiteSpace($tenantId)) {
            $tenantId = $env:TARGET_TENANT_ID
          }

          if ([string]::IsNullOrWhiteSpace($appId)) {
            $appId = $env:TARGET_APP_ID
          }

          if ([string]::IsNullOrWhiteSpace($clientSecret)) {
            $clientSecret = $env:TARGET_CLIENT_SECRET
          }

          pac auth create `
            --name "GitHub-PP-Source" `
            --applicationId "$appId" `
            --clientSecret "$clientSecret" `
            --tenant "$tenantId" `
            --environment "$env:SOURCE_ENVIRONMENT"

          if ($LASTEXITCODE -ne 0) {
            throw "Authentication to the source environment failed."
          }

          pac auth who

      - name: Export solution from source environment
        if: inputs.solution_source_mode == 'Environment'
        shell: pwsh
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOURCE_SOLUTION_NAME: ${{ inputs.source_solution_name }}
          SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
          EXPORT_MANAGED: ${{ inputs.source_export_managed }}
          EXPORT_ASYNC: ${{ inputs.source_export_async }}
          EXPORT_INCLUDE: ${{ inputs.source_export_include }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SOURCE_SOLUTION_NAME)) {
            $sourceSolutionName = $env:SOLUTION_NAME
          }
          else {
            $sourceSolutionName = $env:SOURCE_SOLUTION_NAME
          }

          $solutionZip = Join-Path `
            $env:PACKAGE_OUTPUT_FOLDER `
            "$($env:SOLUTION_NAME).zip"

          $diagnosticLog = Join-Path `
            $env:PACKAGE_OUTPUT_FOLDER `
            "$($env:SOLUTION_NAME)-export.txt"

          $arguments = @(
            "--log-to-console",
            "solution",
            "export",
            "--name",
            $sourceSolutionName,
            "--path",
            $solutionZip,
            "--environment",
            $env:SOURCE_ENVIRONMENT,
            "--overwrite",
            "--max-async-wait-time",
            $env:MAX_WAIT
          )

          if ($env:EXPORT_MANAGED -eq "true") {
            $arguments += "--managed"
            $effectivePackageType = "Managed"
          }
          else {
            $effectivePackageType = "Unmanaged"
          }

          if ($env:EXPORT_ASYNC -eq "true") {
            $arguments += "--async"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:EXPORT_INCLUDE)) {
            $arguments += @("--include", $env:EXPORT_INCLUDE)
          }

          @"
          Source environment: $env:SOURCE_ENVIRONMENT
          Source solution: $sourceSolutionName
          Export type: $effectivePackageType
          "@ | Out-File $diagnosticLog -Encoding utf8

          & pac @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "The source solution could not be exported."
          }

          "SOLUTION_ZIP=$solutionZip" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "DIAGNOSTIC_LOG=$diagnosticLog" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "EFFECTIVE_PACKAGE_TYPE=$effectivePackageType" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve package details
        id: package_details
        shell: pwsh
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
        run: |
          $ErrorActionPreference = "Stop"

          if (
            [string]::IsNullOrWhiteSpace($env:SOLUTION_ZIP) -or
            -not (Test-Path -LiteralPath $env:SOLUTION_ZIP -PathType Leaf)
          ) {
            throw "The solution package was not created."
          }

          $artifactName = `
            "$($env:SOLUTION_NAME)-$($env:EFFECTIVE_PACKAGE_TYPE)"

          Write-Host "Solution package: $env:SOLUTION_ZIP"
          Write-Host "Package type: $env:EFFECTIVE_PACKAGE_TYPE"

          "solution_zip=$env:SOLUTION_ZIP" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "diagnostic_log=$env:DIAGNOSTIC_LOG" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "package_type=$env:EFFECTIVE_PACKAGE_TYPE" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "artifact_name=$artifactName" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload solution artifact
        if: inputs.upload_solution_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_details.outputs.artifact_name }}
          path: |
            ${{ steps.package_details.outputs.solution_zip }}
            ${{ steps.package_details.outputs.diagnostic_log }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Authenticate to target environment
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "GitHub-PP-Target" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID" `
            --environment "$env:ENVIRONMENT_URL"

          if ($LASTEXITCODE -ne 0) {
            throw "Authentication to the target environment failed."
          }

          pac auth who

      - name: Import solution into target environment
        shell: pwsh
        env:
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
          DEPLOYMENT_SETTINGS_FILE: ${{ inputs.deployment_settings_file }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite }}
          PUBLISH_CHANGES: ${{ inputs.publish_changes }}
          ASYNCHRONOUS_IMPORT: ${{ inputs.asynchronous_import }}
          ACTIVATE_PLUGINS: ${{ inputs.activate_plugins }}
          SKIP_DEPENDENCY_CHECK: ${{ inputs.skip_dependency_check }}
          SKIP_LOWER_VERSION: ${{ inputs.skip_lower_version }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "--log-to-console",
            "solution",
            "import",
            "--path",
            $env:SOLUTION_ZIP,
            "--environment",
            $env:ENVIRONMENT_URL,
            "--max-async-wait-time",
            $env:MAX_WAIT
          )

          if ($env:FORCE_OVERWRITE -eq "true") {
            $arguments += "--force-overwrite"
          }

          if ($env:PUBLISH_CHANGES -eq "true") {
            $arguments += "--publish-changes"
          }

          if ($env:ASYNCHRONOUS_IMPORT -eq "true") {
            $arguments += "--async"
          }

          if ($env:ACTIVATE_PLUGINS -eq "true") {
            $arguments += "--activate-plugins"
          }

          if ($env:SKIP_DEPENDENCY_CHECK -eq "true") {
            $arguments += "--skip-dependency-check"
          }

          if ($env:SKIP_LOWER_VERSION -eq "true") {
            $arguments += "--skip-lower-version"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:DEPLOYMENT_SETTINGS_FILE)) {
            if (
              -not (
                Test-Path `
                  -LiteralPath $env:DEPLOYMENT_SETTINGS_FILE `
                  -PathType Leaf
              )
            ) {
              throw "Deployment settings file not found: $env:DEPLOYMENT_SETTINGS_FILE"
            }

            $arguments += @(
              "--settings-file",
              $env:DEPLOYMENT_SETTINGS_FILE
            )
          }

          Write-Host "Importing: $env:SOLUTION_ZIP"
          Write-Host "Target: $env:ENVIRONMENT_URL"

          & pac @arguments

          if ($LASTEXITCODE -ne 0) {
            throw @"
          The Power Platform solution could not be imported.

          Review the PAC CLI output, target Solution History and
          uploaded solution artifact.
          "@
          }

      - name: Create workspace summary
        shell: pwsh
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
          DEVELOPER_UPN: ${{ inputs.developer_upn }}
          SOURCE_MODE: ${{ inputs.solution_source_mode }}
          SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
          SOURCE_SOLUTION_NAME: ${{ inputs.source_solution_name }}
          ENVIRONMENT_EXISTED: ${{ steps.find_environment.outputs.exists }}
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
          ENVIRONMENT_TYPE: ${{ inputs.environment_type }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          PACKAGE_TYPE: ${{ steps.package_details.outputs.package_type }}
          SOURCE_REF: ${{ inputs.source_ref }}
          ARTIFACT_NAME: ${{ steps.package_details.outputs.artifact_name }}
          ARTIFACT_UPLOADED: ${{ inputs.upload_solution_artifact }}
          NEXT_STEP_MESSAGE: ${{ inputs.next_step_message }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:ENVIRONMENT_EXISTED -eq "true") {
            $environmentAction = "Reused existing environment"
          }
          else {
            $environmentAction = "Created new environment"
          }

          if ($env:SOURCE_MODE -eq "Environment") {
            if ([string]::IsNullOrWhiteSpace($env:SOURCE_SOLUTION_NAME)) {
              $sourceSolution = $env:SOLUTION_NAME
            }
            else {
              $sourceSolution = $env:SOURCE_SOLUTION_NAME
            }

            $sourceLine = `
              "**Source:** $sourceSolution from $env:SOURCE_ENVIRONMENT"
          }
          else {
            $sourceLine = `
              "**Source:** Repository ref $env:SOURCE_REF"
          }

          if ($env:ARTIFACT_UPLOADED -eq "true") {
            $artifactLine = "**Artifact:** $env:ARTIFACT_NAME"
          }
          else {
            $artifactLine = "**Artifact:** Not uploaded"
          }

          @"
          # Developer workspace ready

          **Project:** $env:PROJECT_KEY

          **Developer:** $env:DEVELOPER_UPN

          $sourceLine

          **Target environment:** $env:ENVIRONMENT_NAME

          **Target handling:** $environmentAction

          **Target type:** $env:ENVIRONMENT_TYPE

          **Target URL:** $env:ENVIRONMENT_URL

          **Solution:** $env:SOLUTION_NAME

          **Package type:** $env:PACKAGE_TYPE

          $artifactLine

          ## Next step

          $env:NEXT_STEP_MESSAGE
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append