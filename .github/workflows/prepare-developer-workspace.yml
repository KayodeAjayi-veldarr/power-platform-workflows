# Central reusable workflow for preparing a Power Platform
# developer workspace.
#
# Project repositories call this workflow and provide their own
# project, developer, solution and environment settings.
#
# Behaviour:
#
# Environment does not exist
#   -> Create the environment
#   -> Assign the automation application
#   -> Assign the developer
#   -> Pack and import the project solution
#
# Environment already exists
#   -> Reuse the environment
#   -> Confirm the user assignments
#   -> Pack and import the latest project solution again
#
# This workflow does not delete environments.

name: Reusable - Prepare Power Platform Developer Workspace

on:
  workflow_call:
    inputs:
      # ------------------------------------------------------------
      # Project and developer settings
      # ------------------------------------------------------------

      project_key:
        description: Short project identifier, for example LUG-CHESS
        required: true
        type: string

      developer_alias:
        description: Short developer name, for example KAYODE
        required: true
        type: string

      developer_upn:
        description: Microsoft 365 email address or Entra Object ID
        required: true
        type: string

      # ------------------------------------------------------------
      # Solution settings
      # ------------------------------------------------------------

      solution_name:
        description: Power Platform solution unique name
        required: true
        type: string

      solution_source_folder:
        description: Folder containing the unpacked solution source
        required: true
        type: string

      source_ref:
        description: Trusted Git branch or tag containing the solution source
        required: false
        default: main
        type: string

      solution_package_type:
        description: Package the solution as Unmanaged or Managed
        required: false
        default: Unmanaged
        type: string

      deployment_settings_file:
        description: Optional deployment settings JSON file path
        required: false
        default: ""
        type: string

      # ------------------------------------------------------------
      # Environment settings
      # ------------------------------------------------------------

      environment_type:
        description: Developer, Sandbox, Production, Trial, Teams or SubscriptionBasedTrial
        required: false
        default: Developer
        type: string

      environment_name:
        description: Optional full environment name. Generated when blank.
        required: false
        default: ""
        type: string

      environment_domain:
        description: Optional environment domain. Generated when blank.
        required: false
        default: ""
        type: string

      environment_suffix:
        description: Suffix used when generating the environment name
        required: false
        default: DEV
        type: string

      environment_language:
        description: Language used when creating Dataverse
        required: false
        default: English
        type: string

      environment_templates:
        description: Optional comma-separated Dynamics 365 app templates
        required: false
        default: ""
        type: string

      security_group_id:
        description: Optional Entra security group ID. Required for Teams environments.
        required: false
        default: ""
        type: string

      region:
        description: Power Platform region
        required: false
        default: europe
        type: string

      currency:
        description: Dataverse currency code
        required: false
        default: GBP
        type: string

      # ------------------------------------------------------------
      # User and application access
      # ------------------------------------------------------------

      assign_developer:
        description: Assign the developer to the prepared environment
        required: false
        default: true
        type: boolean

      developer_role:
        description: Dataverse security role assigned to the developer
        required: false
        default: System Administrator
        type: string

      assign_automation_user:
        description: Add the automation application as a Dataverse application user
        required: false
        default: true
        type: boolean

      automation_role:
        description: Dataverse security role assigned to the automation application
        required: false
        default: System Administrator
        type: string

      # ------------------------------------------------------------
      # Solution import behaviour
      # ------------------------------------------------------------

      force_overwrite:
        description: Overwrite unmanaged customisations during import
        required: false
        default: true
        type: boolean

      publish_changes:
        description: Publish changes after a successful solution import
        required: false
        default: true
        type: boolean

      asynchronous_import:
        description: Run the solution import asynchronously
        required: false
        default: false
        type: boolean

      activate_plugins:
        description: Activate plug-ins and workflows during import
        required: false
        default: false
        type: boolean

      skip_dependency_check:
        description: Skip dependencies marked as product updates
        required: false
        default: false
        type: boolean

      skip_lower_version:
        description: Skip import when the same or a higher version already exists
        required: false
        default: false
        type: boolean

      pack_error_level:
        description: Solution pack log level
        required: false
        default: Verbose
        type: string

      # ------------------------------------------------------------
      # Retry and diagnostic settings
      # ------------------------------------------------------------

      max_async_wait_minutes:
        description: Maximum PAC CLI wait time for long-running operations
        required: false
        default: 60
        type: number

      environment_lookup_attempts:
        description: Number of attempts used to retrieve environment details
        required: false
        default: 20
        type: number

      environment_lookup_delay_seconds:
        description: Delay between environment lookup attempts
        required: false
        default: 30
        type: number

      upload_solution_artifact:
        description: Upload the generated solution ZIP to the workflow run
        required: false
        default: true
        type: boolean

      artifact_name:
        description: Optional name for the generated solution artifact
        required: false
        default: ""
        type: string

      artifact_retention_days:
        description: Number of days to retain the generated solution ZIP
        required: false
        default: 7
        type: number

      next_step_message:
        description: Project-specific instruction displayed after deployment
        required: false
        default: Validate the solution before beginning development.
        type: string

    # The caller repository supplies these values as GitHub secrets.
    secrets:
      pp_tenant_id:
        description: Microsoft Entra tenant ID
        required: true

      pp_app_id:
        description: Automation application ID
        required: true

      pp_client_secret:
        description: Automation application client secret
        required: true

    # Values returned to the caller workflow.
    outputs:
      environment_id:
        description: ID of the prepared environment
        value: ${{ jobs.prepare-workspace.outputs.environment_id }}

      environment_name:
        description: Name of the prepared environment
        value: ${{ jobs.prepare-workspace.outputs.environment_name }}

      environment_url:
        description: URL of the prepared environment
        value: ${{ jobs.prepare-workspace.outputs.environment_url }}

      solution_artifact_name:
        description: Name of the generated solution artifact
        value: ${{ jobs.prepare-workspace.outputs.solution_artifact_name }}

permissions:
  contents: read

jobs:
  prepare-workspace:
    name: Prepare Power Platform developer workspace

    runs-on: windows-latest

    timeout-minutes: 120

    outputs:
      environment_id: ${{ steps.environment_details.outputs.environment_id }}

      environment_name: ${{ steps.workspace_names.outputs.environment_name }}

      environment_url: ${{ steps.environment_details.outputs.environment_url }}

      solution_artifact_name: ${{ steps.pack_solution.outputs.artifact_name }}

    steps:
      # ------------------------------------------------------------
      # Check out the project repository
      # ------------------------------------------------------------

      # The repository calling this reusable workflow is checked out.
      #
      # For the Chess project, this provides:
      # power-platform/ChessPlayingAgent/src
      - name: Check out trusted project source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      # Install PAC CLI and add the pac command to PATH.
      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true

      # ------------------------------------------------------------
      # Validate the configuration
      # ------------------------------------------------------------

      - name: Validate inputs and solution source
        shell: pwsh
        env:
          ENVIRONMENT_TYPE: ${{ inputs.environment_type }}

          SECURITY_GROUP_ID: ${{ inputs.security_group_id }}

          SOLUTION_NAME: ${{ inputs.solution_name }}

          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}

          SOLUTION_PACKAGE_TYPE: ${{ inputs.solution_package_type }}

          PACK_ERROR_LEVEL: ${{ inputs.pack_error_level }}

          MAX_ASYNC_WAIT_MINUTES: ${{ inputs.max_async_wait_minutes }}

          LOOKUP_ATTEMPTS: ${{ inputs.environment_lookup_attempts }}

          LOOKUP_DELAY_SECONDS: ${{ inputs.environment_lookup_delay_seconds }}

          ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}

        run: |
          $ErrorActionPreference = "Stop"

          $allowedEnvironmentTypes = @(
            "Developer",
            "Sandbox",
            "Production",
            "Trial",
            "Teams",
            "SubscriptionBasedTrial"
          )

          if (
            $allowedEnvironmentTypes -notcontains
            $env:ENVIRONMENT_TYPE
          ) {
            throw "Unsupported environment type: $env:ENVIRONMENT_TYPE"
          }

          # Teams environments require an Entra security group.
          if (
            $env:ENVIRONMENT_TYPE -eq "Teams" -and
            [string]::IsNullOrWhiteSpace(
              $env:SECURITY_GROUP_ID
            )
          ) {
            throw "security_group_id is required for a Teams environment."
          }

          $allowedPackageTypes = @(
            "Unmanaged",
            "Managed"
          )

          if (
            $allowedPackageTypes -notcontains
            $env:SOLUTION_PACKAGE_TYPE
          ) {
            throw @"
          Unsupported solution package type:

          $env:SOLUTION_PACKAGE_TYPE

          Supported values are Unmanaged and Managed.
          "@
          }

          $allowedPackErrorLevels = @(
            "Verbose",
            "Info",
            "Warning",
            "Error",
            "Off"
          )

          if (
            $allowedPackErrorLevels -notcontains
            $env:PACK_ERROR_LEVEL
          ) {
            throw "Unsupported pack error level: $env:PACK_ERROR_LEVEL"
          }

          if (
            -not (
              Test-Path `
                -LiteralPath $env:SOLUTION_SOURCE_FOLDER `
                -PathType Container
            )
          ) {
            throw @"
          Solution source folder not found:

          $env:SOLUTION_SOURCE_FOLDER

          Confirm that the caller supplied the correct folder.
          "@
          }

          foreach ($numberSetting in @(
            @{
              Name = "max_async_wait_minutes"
              Value = $env:MAX_ASYNC_WAIT_MINUTES
            },
            @{
              Name = "environment_lookup_attempts"
              Value = $env:LOOKUP_ATTEMPTS
            },
            @{
              Name = "environment_lookup_delay_seconds"
              Value = $env:LOOKUP_DELAY_SECONDS
            },
            @{
              Name = "artifact_retention_days"
              Value = $env:ARTIFACT_RETENTION_DAYS
            }
          )) {
            $parsedValue = 0

            $validNumber = [int]::TryParse(
              [string]$numberSetting.Value,
              [ref]$parsedValue
            )

            if (
              -not $validNumber -or
              $parsedValue -lt 1
            ) {
              throw "$($numberSetting.Name) must be greater than zero."
            }
          }

          Write-Host "Checking Power Platform CLI installation..."

          $pacCommand = Get-Command pac `
            -ErrorAction SilentlyContinue

          if ($null -eq $pacCommand) {
            throw @"
          Power Platform CLI was installed, but the pac command
          was not added to PATH.
          "@
          }

          Write-Host "PAC CLI location:"
          Write-Host $pacCommand.Source

          # Running pac without --version confirms that it starts.
          pac

          if ($LASTEXITCODE -ne 0) {
            throw "Power Platform CLI could not be started."
          }

          Write-Host ""
          Write-Host "Solution configuration:"
          Write-Host "Solution: $env:SOLUTION_NAME"
          Write-Host "Source folder: $env:SOLUTION_SOURCE_FOLDER"
          Write-Host "Package type: $env:SOLUTION_PACKAGE_TYPE"

      # ------------------------------------------------------------
      # Generate the environment name and domain
      # ------------------------------------------------------------

      - name: Generate workspace names
        id: workspace_names
        shell: pwsh
        env:
          PROJECT_KEY: ${{ inputs.project_key }}

          DEVELOPER_ALIAS: ${{ inputs.developer_alias }}

          REQUESTED_ENVIRONMENT_NAME: ${{ inputs.environment_name }}

          REQUESTED_ENVIRONMENT_DOMAIN: ${{ inputs.environment_domain }}

          ENVIRONMENT_SUFFIX: ${{ inputs.environment_suffix }}

        run: |
          $ErrorActionPreference = "Stop"

          function Convert-ToSafeName {
            param(
              [Parameter(Mandatory)]
              [string]$Value
            )

            $safeValue = $Value.ToUpperInvariant()

            $safeValue = $safeValue `
              -replace '[^A-Z0-9-]', '-'

            $safeValue = $safeValue `
              -replace '-+', '-'

            return $safeValue.Trim('-')
          }

          function Convert-ToSafeDomain {
            param(
              [Parameter(Mandatory)]
              [string]$Value
            )

            $safeValue = $Value.ToLowerInvariant()

            $safeValue = $safeValue `
              -replace '[^a-z0-9-]', '-'

            $safeValue = $safeValue `
              -replace '-+', '-'

            return $safeValue.Trim('-')
          }

          $projectKey = Convert-ToSafeName `
            -Value $env:PROJECT_KEY

          $developerAlias = Convert-ToSafeName `
            -Value $env:DEVELOPER_ALIAS

          $environmentSuffix = Convert-ToSafeName `
            -Value $env:ENVIRONMENT_SUFFIX

          if (
            [string]::IsNullOrWhiteSpace(
              $env:REQUESTED_ENVIRONMENT_NAME
            )
          ) {
            $environmentName = `
              "$projectKey-$developerAlias-$environmentSuffix"
          }
          else {
            $environmentName = `
              $env:REQUESTED_ENVIRONMENT_NAME.Trim()
          }

          if (
            [string]::IsNullOrWhiteSpace(
              $env:REQUESTED_ENVIRONMENT_DOMAIN
            )
          ) {
            $environmentDomain = Convert-ToSafeDomain `
              -Value "$projectKey-$developerAlias-$environmentSuffix"
          }
          else {
            $environmentDomain = Convert-ToSafeDomain `
              -Value $env:REQUESTED_ENVIRONMENT_DOMAIN
          }

          if ([string]::IsNullOrWhiteSpace($environmentName)) {
            throw "A valid environment name could not be generated."
          }

          if ([string]::IsNullOrWhiteSpace($environmentDomain)) {
            throw "A valid environment domain could not be generated."
          }

          Write-Host "Environment name: $environmentName"

          Write-Host "Environment domain: $environmentDomain"

          "environment_name=$environmentName" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "environment_domain=$environmentDomain" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # ------------------------------------------------------------
      # Authenticate for tenant administration
      # ------------------------------------------------------------

      - name: Authenticate for Power Platform administration
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}

          PP_APP_ID: ${{ secrets.pp_app_id }}

          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}

        run: |
          $ErrorActionPreference = "Stop"

          foreach ($variableName in @(
            "PP_TENANT_ID",
            "PP_APP_ID",
            "PP_CLIENT_SECRET"
          )) {
            $value = Get-Item "Env:$variableName" `
              -ErrorAction SilentlyContinue

            if (
              $null -eq $value -or
              [string]::IsNullOrWhiteSpace(
                $value.Value
              )
            ) {
              throw "Required secret $variableName is missing."
            }
          }

          pac auth create `
            --name "GitHub-PP-Admin" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID"

          if ($LASTEXITCODE -ne 0) {
            throw @"
          Power Platform administration authentication failed.
          "@
          }

          pac auth who

      # ------------------------------------------------------------
      # Find the existing environment
      # ------------------------------------------------------------

      - name: Find the existing environment
        id: find_environment
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}

        run: |
          $ErrorActionPreference = "Stop"

          $rawOutput = & pac admin list `
            --name "$env:ENVIRONMENT_NAME" `
            --json

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to retrieve Power Platform environments."
          }

          $jsonText = $rawOutput -join "`n"

          if ([string]::IsNullOrWhiteSpace($jsonText)) {
            Write-Host "Environment does not currently exist."

            "exists=false" |
              Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Encoding utf8 `
                -Append

            exit 0
          }

          try {
            $parsedResult = $jsonText |
              ConvertFrom-Json
          }
          catch {
            Write-Host $jsonText

            throw "The environment list was not valid JSON."
          }

          $environments = @()

          if ($null -ne $parsedResult) {
            $valueProperty = `
              $parsedResult.PSObject.Properties["value"]

            if ($null -ne $valueProperty) {
              $environments = @($parsedResult.value)
            }
            else {
              $environments = @($parsedResult)
            }
          }

          function Get-PropertyValue {
            param(
              [object]$Object,
              [string[]]$Names
            )

            if ($null -eq $Object) {
              return $null
            }

            foreach ($name in $Names) {
              $property = `
                $Object.PSObject.Properties[$name]

              if (
                $null -ne $property -and
                -not [string]::IsNullOrWhiteSpace(
                  [string]$property.Value
                )
              ) {
                return [string]$property.Value
              }
            }

            return $null
          }

          $matchingEnvironment = $null

          foreach ($environment in $environments) {
            $name = Get-PropertyValue `
              -Object $environment `
              -Names @(
                "Environment",
                "DisplayName",
                "EnvironmentName",
                "FriendlyName"
              )

            if ($name -eq $env:ENVIRONMENT_NAME) {
              $matchingEnvironment = $environment

              break
            }
          }

          if ($null -eq $matchingEnvironment) {
            Write-Host "Environment does not currently exist."

            "exists=false" |
              Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Encoding utf8 `
                -Append

            exit 0
          }

          $environmentId = Get-PropertyValue `
            -Object $matchingEnvironment `
            -Names @(
              "EnvironmentId",
              "Environment Id",
              "Id"
            )

          $environmentUrl = Get-PropertyValue `
            -Object $matchingEnvironment `
            -Names @(
              "EnvironmentUrl",
              "Environment Url",
              "Url"
            )

          Write-Host "Existing environment found."

          Write-Host "Environment ID: $environmentId"

          Write-Host "Environment URL: $environmentUrl"

          "exists=true" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "environment_id=$environmentId" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "environment_url=$environmentUrl" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # ------------------------------------------------------------
      # Create the environment only when it does not exist
      # ------------------------------------------------------------

      # There is no delete or recreate step.
      #
      # The developer is assigned separately after creation.
      - name: Create the environment when required
        if: steps.find_environment.outputs.exists == 'false'
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}

          ENVIRONMENT_DOMAIN: ${{ steps.workspace_names.outputs.environment_domain }}

          ENVIRONMENT_TYPE: ${{ inputs.environment_type }}

          ENVIRONMENT_LANGUAGE: ${{ inputs.environment_language }}

          ENVIRONMENT_TEMPLATES: ${{ inputs.environment_templates }}

          SECURITY_GROUP_ID: ${{ inputs.security_group_id }}

          REGION: ${{ inputs.region }}

          CURRENCY: ${{ inputs.currency }}

          MAX_ASYNC_WAIT_MINUTES: ${{ inputs.max_async_wait_minutes }}

        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Creating environment:"
          Write-Host $env:ENVIRONMENT_NAME

          $arguments = @(
            "--log-to-console",
            "admin",
            "create",
            "--name",
            $env:ENVIRONMENT_NAME,
            "--type",
            $env:ENVIRONMENT_TYPE,
            "--region",
            $env:REGION,
            "--currency",
            $env:CURRENCY,
            "--domain",
            $env:ENVIRONMENT_DOMAIN,
            "--max-async-wait-time",
            $env:MAX_ASYNC_WAIT_MINUTES,
            "--json"
          )

          if (
            -not [string]::IsNullOrWhiteSpace(
              $env:ENVIRONMENT_LANGUAGE
            )
          ) {
            $arguments += @(
              "--language",
              $env:ENVIRONMENT_LANGUAGE
            )
          }

          if (
            -not [string]::IsNullOrWhiteSpace(
              $env:ENVIRONMENT_TEMPLATES
            )
          ) {
            $arguments += @(
              "--templates",
              $env:ENVIRONMENT_TEMPLATES
            )
          }

          if (
            -not [string]::IsNullOrWhiteSpace(
              $env:SECURITY_GROUP_ID
            )
          ) {
            $arguments += @(
              "--security-group-id",
              $env:SECURITY_GROUP_ID
            )
          }

          & pac @arguments

          if ($LASTEXITCODE -ne 0) {
            throw @"
          The Power Platform environment could not be created.
          "@
          }

      # ------------------------------------------------------------
      # Retrieve the prepared environment ID and URL
      # ------------------------------------------------------------

      # A new environment can take time to expose its ID and URL.
      #
      # This step also works when the environment already existed.
      - name: Retrieve prepared environment details
        id: environment_details
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}

          LOOKUP_ATTEMPTS: ${{ inputs.environment_lookup_attempts }}

          LOOKUP_DELAY_SECONDS: ${{ inputs.environment_lookup_delay_seconds }}

        run: |
          $ErrorActionPreference = "Stop"

          function Get-PropertyValue {
            param(
              [object]$Object,
              [string[]]$Names
            )

            if ($null -eq $Object) {
              return $null
            }

            foreach ($name in $Names) {
              $property = `
                $Object.PSObject.Properties[$name]

              if (
                $null -ne $property -and
                -not [string]::IsNullOrWhiteSpace(
                  [string]$property.Value
                )
              ) {
                return [string]$property.Value
              }
            }

            return $null
          }

          $maximumAttempts = `
            [int]$env:LOOKUP_ATTEMPTS

          $delaySeconds = `
            [int]$env:LOOKUP_DELAY_SECONDS

          $environmentId = $null

          $environmentUrl = $null

          for (
            $attempt = 1;
            $attempt -le $maximumAttempts;
            $attempt++
          ) {
            Write-Host `
              "Environment lookup attempt $attempt of $maximumAttempts."

            $rawOutput = & pac admin list `
              --name "$env:ENVIRONMENT_NAME" `
              --json

            if ($LASTEXITCODE -ne 0) {
              throw @"
            Unable to retrieve Power Platform environments.
            "@
            }

            $jsonText = $rawOutput -join "`n"

            if (
              -not [string]::IsNullOrWhiteSpace(
                $jsonText
              )
            ) {
              try {
                $parsedResult = $jsonText |
                  ConvertFrom-Json
              }
              catch {
                Write-Host $jsonText

                throw "The environment list was not valid JSON."
              }

              $environments = @()

              if ($null -ne $parsedResult) {
                $valueProperty = `
                  $parsedResult.PSObject.Properties["value"]

                if ($null -ne $valueProperty) {
                  $environments = @($parsedResult.value)
                }
                else {
                  $environments = @($parsedResult)
                }
              }

              foreach ($environment in $environments) {
                $name = Get-PropertyValue `
                  -Object $environment `
                  -Names @(
                    "Environment",
                    "DisplayName",
                    "EnvironmentName",
                    "FriendlyName"
                  )

                if ($name -ne $env:ENVIRONMENT_NAME) {
                  continue
                }

                $environmentId = Get-PropertyValue `
                  -Object $environment `
                  -Names @(
                    "EnvironmentId",
                    "Environment Id",
                    "Id"
                  )

                $environmentUrl = Get-PropertyValue `
                  -Object $environment `
                  -Names @(
                    "EnvironmentUrl",
                    "Environment Url",
                    "Url"
                  )

                break
              }
            }

            if (
              -not [string]::IsNullOrWhiteSpace(
                $environmentId
              ) -and
              -not [string]::IsNullOrWhiteSpace(
                $environmentUrl
              )
            ) {
              break
            }

            if ($attempt -lt $maximumAttempts) {
              Start-Sleep `
                -Seconds $delaySeconds
            }
          }

          if ([string]::IsNullOrWhiteSpace($environmentId)) {
            throw @"
          The prepared environment ID could not be identified.
          "@
          }

          if ([string]::IsNullOrWhiteSpace($environmentUrl)) {
            throw @"
          The prepared environment URL could not be identified.
          "@
          }

          Write-Host "Environment ID: $environmentId"

          Write-Host "Environment URL: $environmentUrl"

          "environment_id=$environmentId" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "environment_url=$environmentUrl" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # ------------------------------------------------------------
      # Assign access
      # ------------------------------------------------------------

      # Add or confirm the service principal as an application user.
      - name: Assign the automation application user
        if: inputs.assign_automation_user
        shell: pwsh
        env:
          PP_APP_ID: ${{ secrets.pp_app_id }}

          AUTOMATION_ROLE: ${{ inputs.automation_role }}

          ENVIRONMENT_ID: ${{ steps.environment_details.outputs.environment_id }}

        run: |
          $ErrorActionPreference = "Stop"

          pac admin assign-user `
            --environment "$env:ENVIRONMENT_ID" `
            --user "$env:PP_APP_ID" `
            --role "$env:AUTOMATION_ROLE" `
            --application-user

          if ($LASTEXITCODE -ne 0) {
            throw @"
          The automation application user could not be assigned.
          "@
          }

      # Add or confirm the human developer and security role.
      - name: Assign the developer
        if: inputs.assign_developer
        shell: pwsh
        env:
          DEVELOPER_UPN: ${{ inputs.developer_upn }}

          DEVELOPER_ROLE: ${{ inputs.developer_role }}

          ENVIRONMENT_ID: ${{ steps.environment_details.outputs.environment_id }}

        run: |
          $ErrorActionPreference = "Stop"

          pac admin assign-user `
            --environment "$env:ENVIRONMENT_ID" `
            --user "$env:DEVELOPER_UPN" `
            --role "$env:DEVELOPER_ROLE"

          if ($LASTEXITCODE -ne 0) {
            throw "The developer could not be assigned."
          }

      # ------------------------------------------------------------
      # Pack the solution from source control
      # ------------------------------------------------------------

      - name: Pack the project solution
        id: pack_solution
        shell: pwsh
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}

          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}

          SOLUTION_PACKAGE_TYPE: ${{ inputs.solution_package_type }}

          PACK_ERROR_LEVEL: ${{ inputs.pack_error_level }}

          REQUESTED_ARTIFACT_NAME: ${{ inputs.artifact_name }}

        run: |
          $ErrorActionPreference = "Stop"

          $outputFolder = Join-Path `
            $env:RUNNER_TEMP `
            "power-platform-solutions"

          New-Item `
            -ItemType Directory `
            -Path $outputFolder `
            -Force |
            Out-Null

          $solutionZip = Join-Path `
            $outputFolder `
            "$($env:SOLUTION_NAME).zip"

          $packLog = Join-Path `
            $outputFolder `
            "$($env:SOLUTION_NAME)-pack.log"

          $packArguments = @(
            "--log-to-console",
            "solution",
            "pack",
            "--zipfile",
            $solutionZip,
            "--folder",
            $env:SOLUTION_SOURCE_FOLDER,
            "--packagetype",
            $env:SOLUTION_PACKAGE_TYPE,
            "--errorlevel",
            $env:PACK_ERROR_LEVEL,
            "--log",
            $packLog
          )

          Write-Host "Packing solution source:"
          Write-Host $env:SOLUTION_SOURCE_FOLDER

          Write-Host ""
          Write-Host "Solution package:"
          Write-Host $solutionZip

          & pac @packArguments

          if ($LASTEXITCODE -ne 0) {
            throw @"
          The Power Platform solution could not be packed.
          "@
          }

          if (
            -not (
              Test-Path `
                -LiteralPath $solutionZip `
                -PathType Leaf
            )
          ) {
            throw "The solution package was not created."
          }

          $solutionFile = Get-Item `
            -LiteralPath $solutionZip

          Write-Host ""
          Write-Host "Packed solution size:"
          Write-Host "$($solutionFile.Length) bytes"

          if (
            [string]::IsNullOrWhiteSpace(
              $env:REQUESTED_ARTIFACT_NAME
            )
          ) {
            $artifactName = `
              "$($env:SOLUTION_NAME)-$($env:SOLUTION_PACKAGE_TYPE)"
          }
          else {
            $artifactName = `
              $env:REQUESTED_ARTIFACT_NAME.Trim()
          }

          "SOLUTION_ZIP=$solutionZip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "solution_zip=$solutionZip" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "artifact_name=$artifactName" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # Keep the exact ZIP that the workflow attempted to import.
      #
      # This is useful for manual import testing and troubleshooting.
      - name: Upload packed solution artifact
        if: inputs.upload_solution_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack_solution.outputs.artifact_name }}

          path: ${{ steps.pack_solution.outputs.solution_zip }}

          if-no-files-found: error

          retention-days: ${{ inputs.artifact_retention_days }}

      # ------------------------------------------------------------
      # Authenticate directly to the target environment
      # ------------------------------------------------------------

      - name: Authenticate to the target environment
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}

          PP_APP_ID: ${{ secrets.pp_app_id }}

          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}

          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}

        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "GitHub-PP-Target" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID" `
            --environment "$env:ENVIRONMENT_URL"

          if ($LASTEXITCODE -ne 0) {
            throw @"
          Authentication to the target environment failed.
          "@
          }

          pac auth who

      # ------------------------------------------------------------
      # Import the latest solution
      # ------------------------------------------------------------

      # This runs for both new and existing environments.
      #
      # An existing environment therefore receives the latest solution
      # package every time the workflow runs.
      - name: Import the project solution
        shell: pwsh
        env:
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}

          DEPLOYMENT_SETTINGS_FILE: ${{ inputs.deployment_settings_file }}

          FORCE_OVERWRITE: ${{ inputs.force_overwrite }}

          PUBLISH_CHANGES: ${{ inputs.publish_changes }}

          ASYNCHRONOUS_IMPORT: ${{ inputs.asynchronous_import }}

          ACTIVATE_PLUGINS: ${{ inputs.activate_plugins }}

          SKIP_DEPENDENCY_CHECK: ${{ inputs.skip_dependency_check }}

          SKIP_LOWER_VERSION: ${{ inputs.skip_lower_version }}

          MAX_ASYNC_WAIT_MINUTES: ${{ inputs.max_async_wait_minutes }}

        run: |
          $ErrorActionPreference = "Stop"

          # --log-to-console is a global PAC CLI option.
          # It must appear before "solution import".
          $arguments = @(
            "--log-to-console",
            "solution",
            "import",
            "--path",
            $env:SOLUTION_ZIP,
            "--environment",
            $env:ENVIRONMENT_URL,
            "--max-async-wait-time",
            $env:MAX_ASYNC_WAIT_MINUTES
          )

          if ($env:FORCE_OVERWRITE -eq "true") {
            $arguments += "--force-overwrite"
          }

          if ($env:PUBLISH_CHANGES -eq "true") {
            $arguments += "--publish-changes"
          }

          if ($env:ASYNCHRONOUS_IMPORT -eq "true") {
            $arguments += "--async"
          }

          if ($env:ACTIVATE_PLUGINS -eq "true") {
            $arguments += "--activate-plugins"
          }

          if ($env:SKIP_DEPENDENCY_CHECK -eq "true") {
            $arguments += "--skip-dependency-check"
          }

          if ($env:SKIP_LOWER_VERSION -eq "true") {
            $arguments += "--skip-lower-version"
          }

          if (
            -not [string]::IsNullOrWhiteSpace(
              $env:DEPLOYMENT_SETTINGS_FILE
            )
          ) {
            if (
              -not (
                Test-Path `
                  -LiteralPath $env:DEPLOYMENT_SETTINGS_FILE `
                  -PathType Leaf
              )
            ) {
              throw @"
          Deployment settings file not found:

          $env:DEPLOYMENT_SETTINGS_FILE
          "@
            }

            $arguments += @(
              "--settings-file",
              $env:DEPLOYMENT_SETTINGS_FILE
            )
          }

          Write-Host "Importing solution:"
          Write-Host $env:SOLUTION_ZIP

          Write-Host ""
          Write-Host "Target environment:"
          Write-Host $env:ENVIRONMENT_URL

          & pac @arguments

          if ($LASTEXITCODE -ne 0) {
            throw @"
          The Power Platform solution could not be imported.

          Review:
          1. The PAC CLI diagnostic output above.
          2. The target environment Solution History.
          3. The generated solution ZIP in the workflow artifacts.
          "@
          }

      # ------------------------------------------------------------
      # Create the workflow summary
      # ------------------------------------------------------------

      - name: Create workspace summary
        shell: pwsh
        env:
          ENVIRONMENT_EXISTED: ${{ steps.find_environment.outputs.exists }}

          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}

          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}

          ARTIFACT_NAME: ${{ steps.pack_solution.outputs.artifact_name }}

          ARTIFACT_UPLOADED: ${{ inputs.upload_solution_artifact }}

          PROJECT_KEY: ${{ inputs.project_key }}

          DEVELOPER_UPN: ${{ inputs.developer_upn }}

          ENVIRONMENT_TYPE: ${{ inputs.environment_type }}

          SOLUTION_NAME: ${{ inputs.solution_name }}

          SOURCE_REF: ${{ inputs.source_ref }}

          SOLUTION_PACKAGE_TYPE: ${{ inputs.solution_package_type }}

          NEXT_STEP_MESSAGE: ${{ inputs.next_step_message }}

        run: |
          $ErrorActionPreference = "Stop"

          if ($env:ENVIRONMENT_EXISTED -eq "true") {
            $environmentAction = `
              "Reused existing environment"
          }
          else {
            $environmentAction = `
              "Created new environment"
          }

          if ($env:ARTIFACT_UPLOADED -eq "true") {
            $artifactLine = `
              "**Solution artifact:** $env:ARTIFACT_NAME"
          }
          else {
            $artifactLine = `
              "**Solution artifact:** Not uploaded"
          }

          @"
          # Developer workspace ready

          **Project:** $env:PROJECT_KEY

          **Developer:** $env:DEVELOPER_UPN

          **Environment:** $env:ENVIRONMENT_NAME

          **Environment handling:** $environmentAction

          **Environment type:** $env:ENVIRONMENT_TYPE

          **Environment URL:** $env:ENVIRONMENT_URL

          **Solution:** $env:SOLUTION_NAME

          **Solution type:** $env:SOLUTION_PACKAGE_TYPE

          **Source branch:** $env:SOURCE_REF

          $artifactLine

          ## Next step

          $env:NEXT_STEP_MESSAGE
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append
