# Central reusable workflow for preparing a Power Platform
# developer workspace.
#
# Project repositories call this workflow using a small caller file.
#
# Behaviour:
#
# Environment does not exist
#   -> Create the environment
#   -> Assign the automation application user
#   -> Assign the developer
#   -> Pack and import the project solution
#
# Environment already exists
#   -> Reuse the existing environment
#   -> Confirm the user assignments
#   -> Pack and import the latest project solution again
#
# This workflow does not delete or reset environments.

name: Reusable - Prepare Power Platform Developer Workspace

on:
  workflow_call:
    inputs:
      # ============================================================
      # Required project settings
      # ============================================================

      project_key:
        description: Short project identifier, for example LUG-CHESS
        required: true
        type: string

      developer_alias:
        description: Short developer name, for example KAYODE
        required: true
        type: string

      developer_upn:
        description: Microsoft 365 email address or Entra Object ID
        required: true
        type: string

      solution_name:
        description: Power Platform solution unique name
        required: true
        type: string

      solution_source_folder:
        description: Folder containing the unpacked solution source
        required: true
        type: string

      # ============================================================
      # Optional solution settings
      # ============================================================

      source_ref:
        description: Git branch or tag containing the solution source
        required: false
        default: main
        type: string

      solution_package_type:
        description: Package the solution as Unmanaged or Managed
        required: false
        default: Unmanaged
        type: string

      deployment_settings_file:
        description: Optional deployment settings JSON file path
        required: false
        default: ""
        type: string

      # ============================================================
      # Optional environment settings
      # ============================================================

      environment_type:
        description: Power Platform environment type
        required: false
        default: Developer
        type: string

      environment_name:
        description: Optional full environment name. Generated when blank.
        required: false
        default: ""
        type: string

      environment_domain:
        description: Optional Dataverse domain. Generated when blank.
        required: false
        default: ""
        type: string

      environment_suffix:
        description: Suffix used when generating the environment name
        required: false
        default: DEV
        type: string

      environment_language:
        description: Default language used when creating the environment
        required: false
        default: English
        type: string

      region:
        description: Power Platform region
        required: false
        default: europe
        type: string

      currency:
        description: Default Dataverse currency code
        required: false
        default: GBP
        type: string

      # ============================================================
      # Access settings
      # ============================================================

      developer_role:
        description: Dataverse role assigned to the developer
        required: false
        default: System Administrator
        type: string

      automation_role:
        description: Dataverse role assigned to the automation application
        required: false
        default: System Administrator
        type: string

      # ============================================================
      # Solution import settings
      # ============================================================

      force_overwrite:
        description: Overwrite unmanaged customisations during import
        required: false
        default: true
        type: boolean

      publish_changes:
        description: Publish changes after a successful import
        required: false
        default: true
        type: boolean

      asynchronous_import:
        description: Import the solution asynchronously
        required: false
        default: false
        type: boolean

      # ============================================================
      # Retry and diagnostic settings
      # ============================================================

      max_async_wait_minutes:
        description: Maximum PAC CLI wait time in minutes
        required: false
        default: 60
        type: number

      environment_lookup_attempts:
        description: Number of attempts used to retrieve environment details
        required: false
        default: 20
        type: number

      environment_lookup_delay_seconds:
        description: Delay between environment lookup attempts
        required: false
        default: 30
        type: number

      upload_solution_artifact:
        description: Upload the generated ZIP and pack log
        required: false
        default: true
        type: boolean

      artifact_retention_days:
        description: Number of days to retain the generated artifact
        required: false
        default: 7
        type: number

      next_step_message:
        description: Project-specific instruction shown after deployment
        required: false
        default: Validate the solution before beginning development.
        type: string

    # These secrets are passed by the project caller workflow.
    secrets:
      pp_tenant_id:
        description: Microsoft Entra tenant ID
        required: true

      pp_app_id:
        description: Automation application ID
        required: true

      pp_client_secret:
        description: Automation application client secret
        required: true

    # Values returned to the caller workflow.
    outputs:
      environment_id:
        description: ID of the prepared Power Platform environment
        value: ${{ jobs.prepare-workspace.outputs.environment_id }}

      environment_name:
        description: Name of the prepared Power Platform environment
        value: ${{ jobs.prepare-workspace.outputs.environment_name }}

      environment_url:
        description: URL of the prepared Power Platform environment
        value: ${{ jobs.prepare-workspace.outputs.environment_url }}

      solution_artifact_name:
        description: Name of the generated solution artifact
        value: ${{ jobs.prepare-workspace.outputs.solution_artifact_name }}

permissions:
  contents: read

jobs:
  prepare-workspace:
    name: Prepare Power Platform developer workspace

    runs-on: windows-latest
    timeout-minutes: 120

    # Prevent two runs from modifying the same developer environment
    # at the same time.
    concurrency:
      group: >-
        power-platform-${{ github.repository }}-${{
        inputs.project_key }}-${{ inputs.developer_alias }}
      cancel-in-progress: false

    outputs:
      environment_id: ${{ steps.environment_details.outputs.environment_id }}
      environment_name: ${{ steps.workspace_names.outputs.environment_name }}
      environment_url: ${{ steps.environment_details.outputs.environment_url }}
      solution_artifact_name: ${{ steps.pack_solution.outputs.artifact_name }}

    steps:
      # ============================================================
      # 1. Check out the calling project repository
      # ============================================================

      # In a reusable workflow, github.repository refers to the
      # repository containing the caller workflow.
      - name: Check out project source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_ref }}

      # Install PAC CLI and make pac available to later steps.
      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: "true"

      # ============================================================
      # 2. Validate the project settings
      # ============================================================

      - name: Validate configuration and solution source
        shell: pwsh
        env:
          ENVIRONMENT_TYPE: ${{ inputs.environment_type }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          SOLUTION_PACKAGE_TYPE: ${{ inputs.solution_package_type }}
          MAX_ASYNC_WAIT_MINUTES: ${{ inputs.max_async_wait_minutes }}
          LOOKUP_ATTEMPTS: ${{ inputs.environment_lookup_attempts }}
          LOOKUP_DELAY_SECONDS: ${{ inputs.environment_lookup_delay_seconds }}
          ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        run: |
          $ErrorActionPreference = "Stop"

          $allowedEnvironmentTypes = @(
            "Developer",
            "Sandbox",
            "Production",
            "Trial",
            "Teams",
            "SubscriptionBasedTrial"
          )

          if (
            $allowedEnvironmentTypes -notcontains
            $env:ENVIRONMENT_TYPE
          ) {
            throw @"
          Unsupported environment type:

          $env:ENVIRONMENT_TYPE
          "@
          }

          $allowedPackageTypes = @(
            "Unmanaged",
            "Managed"
          )

          if (
            $allowedPackageTypes -notcontains
            $env:SOLUTION_PACKAGE_TYPE
          ) {
            throw @"
          Unsupported solution package type:

          $env:SOLUTION_PACKAGE_TYPE

          Supported values are Unmanaged and Managed.
          "@
          }

          if (
            -not (
              Test-Path `
                -LiteralPath $env:SOLUTION_SOURCE_FOLDER `
                -PathType Container
            )
          ) {
            throw @"
          Solution source folder not found:

          $env:SOLUTION_SOURCE_FOLDER

          Confirm that the caller supplied the correct folder.
          "@
          }

          foreach ($numberSetting in @(
            @{
              Name = "max_async_wait_minutes"
              Value = $env:MAX_ASYNC_WAIT_MINUTES
            },
            @{
              Name = "environment_lookup_attempts"
              Value = $env:LOOKUP_ATTEMPTS
            },
            @{
              Name = "environment_lookup_delay_seconds"
              Value = $env:LOOKUP_DELAY_SECONDS
            },
            @{
              Name = "artifact_retention_days"
              Value = $env:ARTIFACT_RETENTION_DAYS
            }
          )) {
            $parsedValue = 0

            $validNumber = [int]::TryParse(
              [string]$numberSetting.Value,
              [ref]$parsedValue
            )

            if (
              -not $validNumber -or
              $parsedValue -lt 1
            ) {
              throw "$($numberSetting.Name) must be greater than zero."
            }
          }

          Write-Host "Checking Power Platform CLI installation..."

          $pacCommand = Get-Command pac `
            -ErrorAction SilentlyContinue

          if ($null -eq $pacCommand) {
            throw @"
          Power Platform CLI was installed, but pac was not
          added to PATH.
          "@
          }

          Write-Host "PAC CLI location:"
          Write-Host $pacCommand.Source

          Write-Host ""
          Write-Host "Project configuration:"
          Write-Host "Repository: ${{ github.repository }}"
          Write-Host "Solution: $env:SOLUTION_NAME"
          Write-Host "Source folder: $env:SOLUTION_SOURCE_FOLDER"
          Write-Host "Package type: $env:SOLUTION_PACKAGE_TYPE"
          Write-Host "Environment type: $env:ENVIRONMENT_TYPE"

      # ============================================================
      # 3. Generate the environment name and domain
      # ============================================================

      - name: Generate environment name and domain
        id: workspace_names
        shell: pwsh
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
          DEVELOPER_ALIAS: ${{ inputs.developer_alias }}
          REQUESTED_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          REQUESTED_ENVIRONMENT_DOMAIN: ${{ inputs.environment_domain }}
          ENVIRONMENT_SUFFIX: ${{ inputs.environment_suffix }}
        run: |
          $ErrorActionPreference = "Stop"

          function Convert-ToSafeName {
            param(
              [Parameter(Mandatory)]
              [string]$Value
            )

            $safeValue = $Value.ToUpperInvariant()
            $safeValue = $safeValue -replace '[^A-Z0-9-]', '-'
            $safeValue = $safeValue -replace '-+', '-'

            return $safeValue.Trim('-')
          }

          function Convert-ToSafeDomain {
            param(
              [Parameter(Mandatory)]
              [string]$Value
            )

            $safeValue = $Value.ToLowerInvariant()
            $safeValue = $safeValue -replace '[^a-z0-9-]', '-'
            $safeValue = $safeValue -replace '-+', '-'

            return $safeValue.Trim('-')
          }

          $projectKey = Convert-ToSafeName `
            -Value $env:PROJECT_KEY

          $developerAlias = Convert-ToSafeName `
            -Value $env:DEVELOPER_ALIAS

          $environmentSuffix = Convert-ToSafeName `
            -Value $env:ENVIRONMENT_SUFFIX

          if (
            [string]::IsNullOrWhiteSpace(
              $env:REQUESTED_ENVIRONMENT_NAME
            )
          ) {
            $environmentName = `
              "$projectKey-$developerAlias-$environmentSuffix"
          }
          else {
            $environmentName = `
              $env:REQUESTED_ENVIRONMENT_NAME.Trim()
          }

          if (
            [string]::IsNullOrWhiteSpace(
              $env:REQUESTED_ENVIRONMENT_DOMAIN
            )
          ) {
            $environmentDomain = Convert-ToSafeDomain `
              -Value "$projectKey-$developerAlias-$environmentSuffix"
          }
          else {
            $environmentDomain = Convert-ToSafeDomain `
              -Value $env:REQUESTED_ENVIRONMENT_DOMAIN
          }

          if ([string]::IsNullOrWhiteSpace($environmentName)) {
            throw "A valid environment name could not be generated."
          }

          if ([string]::IsNullOrWhiteSpace($environmentDomain)) {
            throw "A valid environment domain could not be generated."
          }

          Write-Host "Environment name:"
          Write-Host $environmentName

          Write-Host ""
          Write-Host "Environment domain:"
          Write-Host $environmentDomain

          "environment_name=$environmentName" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "environment_domain=$environmentDomain" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 4. Authenticate for tenant administration
      # ============================================================

      - name: Authenticate for Power Platform administration
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($variableName in @(
            "PP_TENANT_ID",
            "PP_APP_ID",
            "PP_CLIENT_SECRET"
          )) {
            $value = Get-Item "Env:$variableName" `
              -ErrorAction SilentlyContinue

            if (
              $null -eq $value -or
              [string]::IsNullOrWhiteSpace(
                $value.Value
              )
            ) {
              throw "Required secret $variableName is missing."
            }
          }

          pac auth create `
            --name "GitHub-PP-Admin" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Power Platform administration authentication failed."
          }

          pac auth who

      # ============================================================
      # 5. Find an existing environment
      # ============================================================

      - name: Find existing environment
        id: find_environment
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-PropertyValue {
            param(
              [object]$Object,
              [string[]]$Names
            )

            if ($null -eq $Object) {
              return $null
            }

            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties[$name]

              if (
                $null -ne $property -and
                -not [string]::IsNullOrWhiteSpace(
                  [string]$property.Value
                )
              ) {
                return [string]$property.Value
              }
            }

            return $null
          }

          $rawOutput = & pac admin list `
            --name "$env:ENVIRONMENT_NAME" `
            --json

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to retrieve Power Platform environments."
          }

          $jsonText = $rawOutput -join "`n"

          if ([string]::IsNullOrWhiteSpace($jsonText)) {
            Write-Host "Environment does not currently exist."

            "exists=false" |
              Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Encoding utf8 `
                -Append

            exit 0
          }

          try {
            $parsedResult = $jsonText |
              ConvertFrom-Json
          }
          catch {
            Write-Host $jsonText

            throw "The environment list response was not valid JSON."
          }

          if ($null -ne $parsedResult.value) {
            $environments = @($parsedResult.value)
          }
          else {
            $environments = @($parsedResult)
          }

          $matchingEnvironment = $null

          foreach ($environment in $environments) {
            $name = Get-PropertyValue `
              -Object $environment `
              -Names @(
                "Environment",
                "DisplayName",
                "EnvironmentName",
                "FriendlyName"
              )

            if ($name -eq $env:ENVIRONMENT_NAME) {
              $matchingEnvironment = $environment
              break
            }
          }

          if ($null -eq $matchingEnvironment) {
            Write-Host "Environment does not currently exist."

            "exists=false" |
              Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Encoding utf8 `
                -Append

            exit 0
          }

          $environmentId = Get-PropertyValue `
            -Object $matchingEnvironment `
            -Names @(
              "EnvironmentId",
              "Environment Id",
              "Id"
            )

          $environmentUrl = Get-PropertyValue `
            -Object $matchingEnvironment `
            -Names @(
              "EnvironmentUrl",
              "Environment Url",
              "Url"
            )

          Write-Host "Existing environment found."
          Write-Host "Environment ID: $environmentId"
          Write-Host "Environment URL: $environmentUrl"

          "exists=true" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "environment_id=$environmentId" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "environment_url=$environmentUrl" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 6. Create the environment only when it is missing
      # ============================================================

      # There is deliberately no delete or recreate step.
      - name: Create environment when required
        if: steps.find_environment.outputs.exists == 'false'
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}
          ENVIRONMENT_DOMAIN: ${{ steps.workspace_names.outputs.environment_domain }}
          ENVIRONMENT_TYPE: ${{ inputs.environment_type }}
          REGION: ${{ inputs.region }}
          CURRENCY: ${{ inputs.currency }}
          ENVIRONMENT_LANGUAGE: ${{ inputs.environment_language }}
          MAX_ASYNC_WAIT_MINUTES: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Creating environment:"
          Write-Host $env:ENVIRONMENT_NAME

          $arguments = @(
            "--log-to-console",
            "admin",
            "create",
            "--name",
            $env:ENVIRONMENT_NAME,
            "--type",
            $env:ENVIRONMENT_TYPE,
            "--region",
            $env:REGION,
            "--currency",
            $env:CURRENCY,
            "--domain",
            $env:ENVIRONMENT_DOMAIN,
            "--language",
            $env:ENVIRONMENT_LANGUAGE,
            "--max-async-wait-time",
            $env:MAX_ASYNC_WAIT_MINUTES,
            "--json"
          )

          & pac @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "The Power Platform environment could not be created."
          }

      # ============================================================
      # 7. Retrieve the prepared environment details
      # ============================================================

      - name: Retrieve prepared environment details
        id: environment_details
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}
          LOOKUP_ATTEMPTS: ${{ inputs.environment_lookup_attempts }}
          LOOKUP_DELAY_SECONDS: ${{ inputs.environment_lookup_delay_seconds }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-PropertyValue {
            param(
              [object]$Object,
              [string[]]$Names
            )

            if ($null -eq $Object) {
              return $null
            }

            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties[$name]

              if (
                $null -ne $property -and
                -not [string]::IsNullOrWhiteSpace(
                  [string]$property.Value
                )
              ) {
                return [string]$property.Value
              }
            }

            return $null
          }

          $maximumAttempts = [int]$env:LOOKUP_ATTEMPTS
          $delaySeconds = [int]$env:LOOKUP_DELAY_SECONDS

          $environmentId = $null
          $environmentUrl = $null

          for (
            $attempt = 1;
            $attempt -le $maximumAttempts;
            $attempt++
          ) {
            Write-Host `
              "Environment lookup attempt $attempt of $maximumAttempts."

            $rawOutput = & pac admin list `
              --name "$env:ENVIRONMENT_NAME" `
              --json

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to retrieve Power Platform environments."
            }

            $jsonText = $rawOutput -join "`n"

            if (-not [string]::IsNullOrWhiteSpace($jsonText)) {
              try {
                $parsedResult = $jsonText |
                  ConvertFrom-Json
              }
              catch {
                Write-Host $jsonText

                throw "The environment list response was not valid JSON."
              }

              if ($null -ne $parsedResult.value) {
                $environments = @($parsedResult.value)
              }
              else {
                $environments = @($parsedResult)
              }

              foreach ($environment in $environments) {
                $name = Get-PropertyValue `
                  -Object $environment `
                  -Names @(
                    "Environment",
                    "DisplayName",
                    "EnvironmentName",
                    "FriendlyName"
                  )

                if ($name -ne $env:ENVIRONMENT_NAME) {
                  continue
                }

                $environmentId = Get-PropertyValue `
                  -Object $environment `
                  -Names @(
                    "EnvironmentId",
                    "Environment Id",
                    "Id"
                  )

                $environmentUrl = Get-PropertyValue `
                  -Object $environment `
                  -Names @(
                    "EnvironmentUrl",
                    "Environment Url",
                    "Url"
                  )

                break
              }
            }

            if (
              -not [string]::IsNullOrWhiteSpace(
                $environmentId
              ) -and
              -not [string]::IsNullOrWhiteSpace(
                $environmentUrl
              )
            ) {
              break
            }

            if ($attempt -lt $maximumAttempts) {
              Start-Sleep -Seconds $delaySeconds
            }
          }

          if ([string]::IsNullOrWhiteSpace($environmentId)) {
            throw "The prepared environment ID could not be identified."
          }

          if ([string]::IsNullOrWhiteSpace($environmentUrl)) {
            throw "The prepared environment URL could not be identified."
          }

          Write-Host "Environment ID:"
          Write-Host $environmentId

          Write-Host ""
          Write-Host "Environment URL:"
          Write-Host $environmentUrl

          "environment_id=$environmentId" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "environment_url=$environmentUrl" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 8. Assign the automation application user
      # ============================================================

      - name: Assign automation application user
        shell: pwsh
        env:
          PP_APP_ID: ${{ secrets.pp_app_id }}
          AUTOMATION_ROLE: ${{ inputs.automation_role }}
          ENVIRONMENT_ID: ${{ steps.environment_details.outputs.environment_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "--log-to-console",
            "admin",
            "assign-user",
            "--environment",
            $env:ENVIRONMENT_ID,
            "--user",
            $env:PP_APP_ID,
            "--role",
            $env:AUTOMATION_ROLE,
            "--application-user"
          )

          & pac @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "The automation application user could not be assigned."
          }

      # ============================================================
      # 9. Assign the developer
      # ============================================================

      - name: Assign developer
        shell: pwsh
        env:
          DEVELOPER_UPN: ${{ inputs.developer_upn }}
          DEVELOPER_ROLE: ${{ inputs.developer_role }}
          ENVIRONMENT_ID: ${{ steps.environment_details.outputs.environment_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "--log-to-console",
            "admin",
            "assign-user",
            "--environment",
            $env:ENVIRONMENT_ID,
            "--user",
            $env:DEVELOPER_UPN,
            "--role",
            $env:DEVELOPER_ROLE
          )

          & pac @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "The developer could not be assigned."
          }

      # ============================================================
      # 10. Pack the solution from the project repository
      # ============================================================

      - name: Pack project solution
        id: pack_solution
        shell: pwsh
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          SOLUTION_PACKAGE_TYPE: ${{ inputs.solution_package_type }}
        run: |
          $ErrorActionPreference = "Stop"

          $outputFolder = Join-Path `
            $env:RUNNER_TEMP `
            "power-platform-solutions"

          New-Item `
            -ItemType Directory `
            -Path $outputFolder `
            -Force |
            Out-Null

          $solutionZip = Join-Path `
            $outputFolder `
            "$($env:SOLUTION_NAME).zip"

          $packLog = Join-Path `
            $outputFolder `
            "$($env:SOLUTION_NAME)-pack.log"

          $arguments = @(
            "--log-to-console",
            "solution",
            "pack",
            "--zipfile",
            $solutionZip,
            "--folder",
            $env:SOLUTION_SOURCE_FOLDER,
            "--packagetype",
            $env:SOLUTION_PACKAGE_TYPE,
            "--errorlevel",
            "Verbose",
            "--log",
            $packLog
          )

          & pac @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "The Power Platform solution could not be packed."
          }

          if (
            -not (
              Test-Path `
                -LiteralPath $solutionZip `
                -PathType Leaf
            )
          ) {
            throw "The solution ZIP was not created."
          }

          $artifactName = `
            "$($env:SOLUTION_NAME)-$($env:SOLUTION_PACKAGE_TYPE)"

          "SOLUTION_ZIP=$solutionZip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "solution_zip=$solutionZip" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "pack_log=$packLog" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "artifact_name=$artifactName" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 11. Upload the generated ZIP and pack log
      # ============================================================

      - name: Upload solution artifact
        if: inputs.upload_solution_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack_solution.outputs.artifact_name }}

          path: |
            ${{ steps.pack_solution.outputs.solution_zip }}
            ${{ steps.pack_solution.outputs.pack_log }}

          if-no-files-found: error

          retention-days: ${{ inputs.artifact_retention_days }}

      # ============================================================
      # 12. Authenticate directly to the target environment
      # ============================================================

      - name: Authenticate to target environment
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "GitHub-PP-Target" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID" `
            --environment "$env:ENVIRONMENT_URL"

          if ($LASTEXITCODE -ne 0) {
            throw "Authentication to the target environment failed."
          }

          pac auth who

      # ============================================================
      # 13. Import the latest solution
      # ============================================================

      # This runs whether the environment was created or reused.
      - name: Import project solution
        shell: pwsh
        env:
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
          DEPLOYMENT_SETTINGS_FILE: ${{ inputs.deployment_settings_file }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite }}
          PUBLISH_CHANGES: ${{ inputs.publish_changes }}
          ASYNCHRONOUS_IMPORT: ${{ inputs.asynchronous_import }}
          MAX_ASYNC_WAIT_MINUTES: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "--log-to-console",
            "solution",
            "import",
            "--path",
            $env:SOLUTION_ZIP,
            "--environment",
            $env:ENVIRONMENT_URL,
            "--max-async-wait-time",
            $env:MAX_ASYNC_WAIT_MINUTES
          )

          if ($env:FORCE_OVERWRITE -eq "true") {
            $arguments += "--force-overwrite"
          }

          if ($env:PUBLISH_CHANGES -eq "true") {
            $arguments += "--publish-changes"
          }

          if ($env:ASYNCHRONOUS_IMPORT -eq "true") {
            $arguments += "--async"
          }

          if (
            -not [string]::IsNullOrWhiteSpace(
              $env:DEPLOYMENT_SETTINGS_FILE
            )
          ) {
            if (
              -not (
                Test-Path `
                  -LiteralPath $env:DEPLOYMENT_SETTINGS_FILE `
                  -PathType Leaf
              )
            ) {
              throw @"
          Deployment settings file not found:

          $env:DEPLOYMENT_SETTINGS_FILE
          "@
            }

            $arguments += @(
              "--settings-file",
              $env:DEPLOYMENT_SETTINGS_FILE
            )
          }

          Write-Host "Importing solution:"
          Write-Host $env:SOLUTION_ZIP

          Write-Host ""
          Write-Host "Target environment:"
          Write-Host $env:ENVIRONMENT_URL

          & pac @arguments

          if ($LASTEXITCODE -ne 0) {
            throw @"
          The Power Platform solution could not be imported.

          Review:
          1. The PAC CLI output above.
          2. Solution History in the target environment.
          3. The generated solution ZIP in the workflow artifacts.
          "@
          }

      # ============================================================
      # 14. Create the GitHub Actions summary
      # ============================================================

      - name: Create workspace summary
        shell: pwsh
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
          DEVELOPER_UPN: ${{ inputs.developer_upn }}
          ENVIRONMENT_EXISTED: ${{ steps.find_environment.outputs.exists }}
          ENVIRONMENT_NAME: ${{ steps.workspace_names.outputs.environment_name }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
          ENVIRONMENT_TYPE: ${{ inputs.environment_type }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOLUTION_PACKAGE_TYPE: ${{ inputs.solution_package_type }}
          SOURCE_REF: ${{ inputs.source_ref }}
          ARTIFACT_NAME: ${{ steps.pack_solution.outputs.artifact_name }}
          ARTIFACT_UPLOADED: ${{ inputs.upload_solution_artifact }}
          NEXT_STEP_MESSAGE: ${{ inputs.next_step_message }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:ENVIRONMENT_EXISTED -eq "true") {
            $environmentAction = "Reused existing environment"
          }
          else {
            $environmentAction = "Created new environment"
          }

          if ($env:ARTIFACT_UPLOADED -eq "true") {
            $artifactLine = `
              "**Solution artifact:** $env:ARTIFACT_NAME"
          }
          else {
            $artifactLine = `
              "**Solution artifact:** Not uploaded"
          }

          @"
          # Developer workspace ready

          **Project:** $env:PROJECT_KEY

          **Developer:** $env:DEVELOPER_UPN

          **Environment:** $env:ENVIRONMENT_NAME

          **Environment handling:** $environmentAction

          **Environment type:** $env:ENVIRONMENT_TYPE

          **Environment URL:** $env:ENVIRONMENT_URL

          **Solution:** $env:SOLUTION_NAME

          **Solution type:** $env:SOLUTION_PACKAGE_TYPE

          **Source branch:** $env:SOURCE_REF

          $artifactLine

          ## Next step

          $env:NEXT_STEP_MESSAGE
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding utf8 `
              -Append