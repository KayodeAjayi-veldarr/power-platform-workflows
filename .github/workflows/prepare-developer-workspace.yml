# This is the Chess project-level caller workflow.
#
# It does not contain the Power Platform provisioning logic itself.
# Instead, it collects the project and developer settings from the
# GitHub Actions "Run workflow" form and passes them to the central
# reusable Power Platform workflow.
#
# Behaviour:
#
# Environment does not exist
#   -> Create the developer environment
#   -> Assign the automation application
#   -> Assign the developer
#   -> Pack and import the Chess solution
#
# Environment already exists
#   -> Reuse the existing environment
#   -> Pack and import the latest Chess solution again
#
# This workflow does not delete environments.

name: Prepare Developer Workspace

# Show a useful name for each run in the GitHub Actions history.
run-name: Prepare ${{ inputs.project_key }} workspace for ${{ inputs.developer_alias }}

on:
  # Adds the "Run workflow" button to the GitHub Actions page.
  workflow_dispatch:
    inputs:
      # ------------------------------------------------------------
      # Project and developer information
      # ------------------------------------------------------------

      project_key:
        description: Short project identifier used in the environment name
        required: true
        default: LUG-CHESS
        type: string

      developer_alias:
        description: Short developer name used in the environment name
        required: true
        default: KAYODE
        type: string

      developer_upn:
        description: Microsoft 365 email address of the developer
        required: true
        default: kayode.ajayi@veldarr.com
        type: string

      # ------------------------------------------------------------
      # Power Platform solution settings
      # ------------------------------------------------------------

      solution_name:
        description: Power Platform solution unique name
        required: true
        default: ChessPlayingAgent
        type: string

      solution_source_folder:
        description: Folder containing the unpacked solution source
        required: true
        default: power-platform/ChessPlayingAgent/src
        type: string

      source_ref:
        description: Trusted Git branch or tag containing the solution source
        required: true
        default: main
        type: string

      solution_package_type:
        description: Package the solution as unmanaged or managed
        required: true
        default: Unmanaged
        type: choice
        options:
          - Unmanaged
          - Managed

      deployment_settings_file:
        description: Optional path to the deployment settings JSON file
        required: false
        default: ""
        type: string

      # ------------------------------------------------------------
      # Developer environment settings
      # ------------------------------------------------------------

      environment_type:
        description: Type of developer environment to prepare
        required: true
        default: Developer
        type: choice
        options:
          - Developer
          - Sandbox

      environment_name:
        description: Optional full environment name. Leave blank to generate it
        required: false
        default: ""
        type: string

      environment_domain:
        description: Optional Dataverse domain. Leave blank to generate it
        required: false
        default: ""
        type: string

      environment_suffix:
        description: Suffix used when generating the environment name
        required: true
        default: DEV
        type: string

      environment_purpose:
        description: Description applied to a newly created environment
        required: true
        default: Individual Chess project developer workspace
        type: string

      region:
        description: Power Platform region
        required: true
        default: europe
        type: string

      currency:
        description: Default Dataverse currency code
        required: true
        default: GBP
        type: string

      # ------------------------------------------------------------
      # Environment access
      # ------------------------------------------------------------

      assign_developer:
        description: Assign the developer to the prepared environment
        required: true
        default: true
        type: boolean

      developer_role:
        description: Dataverse security role assigned to the developer
        required: true
        default: System Administrator
        type: string

      assign_automation_user:
        description: Add the automation application as a Dataverse user
        required: true
        default: true
        type: boolean

      automation_role:
        description: Dataverse role assigned to the automation application
        required: true
        default: System Administrator
        type: string

      # ------------------------------------------------------------
      # Solution import behaviour
      # ------------------------------------------------------------

      force_overwrite:
        description: Overwrite unmanaged customisations during import
        required: true
        default: true
        type: boolean

      publish_changes:
        description: Publish changes after the solution is imported
        required: true
        default: true
        type: boolean

      asynchronous_import:
        description: Run the solution import asynchronously
        required: true
        default: true
        type: boolean

      # ------------------------------------------------------------
      # Diagnostics and workflow output
      # ------------------------------------------------------------

      upload_solution_artifact:
        description: Keep the generated solution ZIP in the workflow run
        required: true
        default: true
        type: boolean

      artifact_retention_days:
        description: Number of days to keep the generated solution ZIP
        required: true
        default: 7
        type: number

      next_step_message:
        description: Instruction shown after the workspace is prepared
        required: true
        default: Open the ChessPlayingAgent solution and run the Seed Chess Test Data flow before starting development.
        type: string

# The workflow only needs permission to read files from this repository.
#
# The Power Platform credentials are provided separately as secrets.
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Power Platform workspace

    # Prevent two runs from changing the same developer environment
    # at the same time.
    concurrency:
      group: prepare-${{ inputs.project_key }}-${{ inputs.developer_alias }}
      cancel-in-progress: false

    # Call the reusable workflow from the central workflow repository.
    #
    # Keep @main while developing and testing the workflow.
    # Replace it with a version tag such as @v1.0.0 when stable.
    uses: KayodeAjayi-Veldarr/power-platform-workflows/.github/workflows/prepare-developer-workspace.yml@main

    with:
      # ------------------------------------------------------------
      # Project and developer information
      # ------------------------------------------------------------

      project_key: ${{ inputs.project_key }}
      developer_alias: ${{ inputs.developer_alias }}
      developer_upn: ${{ inputs.developer_upn }}

      # ------------------------------------------------------------
      # Solution configuration
      # ------------------------------------------------------------

      solution_name: ${{ inputs.solution_name }}
      solution_source_folder: ${{ inputs.solution_source_folder }}
      source_ref: ${{ inputs.source_ref }}
      solution_package_type: ${{ inputs.solution_package_type }}
      deployment_settings_file: ${{ inputs.deployment_settings_file }}

      # ------------------------------------------------------------
      # Environment configuration
      # ------------------------------------------------------------

      environment_type: ${{ inputs.environment_type }}
      environment_name: ${{ inputs.environment_name }}
      environment_domain: ${{ inputs.environment_domain }}
      environment_suffix: ${{ inputs.environment_suffix }}
      environment_purpose: ${{ inputs.environment_purpose }}
      region: ${{ inputs.region }}
      currency: ${{ inputs.currency }}

      # ------------------------------------------------------------
      # User and application access
      # ------------------------------------------------------------

      assign_developer: ${{ inputs.assign_developer }}
      developer_role: ${{ inputs.developer_role }}

      assign_automation_user: ${{ inputs.assign_automation_user }}
      automation_role: ${{ inputs.automation_role }}

      # ------------------------------------------------------------
      # Import configuration
      # ------------------------------------------------------------

      force_overwrite: ${{ inputs.force_overwrite }}
      publish_changes: ${{ inputs.publish_changes }}
      asynchronous_import: ${{ inputs.asynchronous_import }}

      # These less commonly changed options use safe project defaults.
      activate_plugins: false
      skip_dependency_check: false
      skip_lower_version: false
      pack_error_level: Verbose

      # ------------------------------------------------------------
      # Diagnostics
      # ------------------------------------------------------------

      upload_solution_artifact: ${{ inputs.upload_solution_artifact }}
      artifact_retention_days: ${{ inputs.artifact_retention_days }}

      # Leave blank so the reusable workflow generates an artifact name
      # such as ChessPlayingAgent-Unmanaged.
      artifact_name: ""

      next_step_message: ${{ inputs.next_step_message }}

    # Sensitive values are stored as GitHub Actions secrets.
    #
    # They must not be added to the workflow form or committed to Git.
    secrets:
      pp_tenant_id: ${{ secrets.PP_TENANT_ID }}
      pp_app_id: ${{ secrets.PP_APP_ID }}
      pp_client_secret: ${{ secrets.PP_CLIENT_SECRET }}