name: Reusable - Commit Power Platform Feature Changes

on:
  workflow_call:
    inputs:
      project_key:
        required: true
        type: string
      pac_cli_version:
        description: Power Platform CLI version installed by microsoft/powerplatform-actions
        required: false
        default: 2.9.3
        type: string
      branch_ref:
        required: true
        type: string
      base_branch:
        required: false
        default: main
        type: string
      developer_alias:
        required: true
        type: string
      developer_environment:
        description: Developer environment name, URL or ID
        required: true
        type: string

      solution_name:
        required: true
        type: string
      solution_project_folder:
        required: true
        type: string
      solution_source_folder:
        required: true
        type: string
      export_managed:
        required: false
        default: false
        type: boolean
      export_async:
        required: false
        default: true
        type: boolean
      export_include:
        required: false
        default: ""
        type: string

      commit_changes:
        required: false
        default: true
        type: boolean
      push_changes:
        required: false
        default: true
        type: boolean
      commit_message:
        required: false
        default: Sync Power Platform solution changes
        type: string
      azure_work_item_ids:
        description: Azure Boards work item IDs separated by commas or spaces
        required: false
        default: ""
        type: string
      create_pull_request:
        required: false
        default: false
        type: boolean
      pull_request_title:
        required: false
        default: ""
        type: string
      pull_request_body:
        required: false
        default: ""
        type: string
      pull_request_draft:
        required: false
        default: true
        type: boolean

      max_async_wait_minutes:
        required: false
        default: 60
        type: number
      upload_solution_artifact:
        required: false
        default: true
        type: boolean
      artifact_retention_days:
        required: false
        default: 7
        type: number

    secrets:
      pp_tenant_id:
        required: true
      pp_app_id:
        required: true
      pp_client_secret:
        required: true

    outputs:
      branch_ref:
        value: ${{ jobs.commit.outputs.branch_ref }}
      developer_environment_id:
        value: ${{ jobs.commit.outputs.developer_environment_id }}
      developer_environment_name:
        value: ${{ jobs.commit.outputs.developer_environment_name }}
      developer_environment_url:
        value: ${{ jobs.commit.outputs.developer_environment_url }}
      changes_detected:
        value: ${{ jobs.commit.outputs.changes_detected }}
      commit_created:
        value: ${{ jobs.commit.outputs.commit_created }}
      commit_sha:
        value: ${{ jobs.commit.outputs.commit_sha }}
      push_completed:
        value: ${{ jobs.commit.outputs.push_completed }}
      compare_url:
        value: ${{ jobs.commit.outputs.compare_url }}
      pull_request_created:
        value: ${{ jobs.commit.outputs.pull_request_created }}
      pull_request_number:
        value: ${{ jobs.commit.outputs.pull_request_number }}
      pull_request_url:
        value: ${{ jobs.commit.outputs.pull_request_url }}
      solution_version:
        value: ${{ jobs.commit.outputs.solution_version }}
      solution_artifact_name:
        value: ${{ jobs.commit.outputs.solution_artifact_name }}

permissions:
  contents: write
  pull-requests: write

jobs:
  commit:
    name: Commit solution changes
    runs-on: windows-latest
    timeout-minutes: 120

    concurrency:
      group: power-platform-commit-${{ github.repository }}-${{ inputs.developer_alias }}
      cancel-in-progress: false

    outputs:
      branch_ref: ${{ inputs.branch_ref }}
      developer_environment_id: ${{ steps.environment.outputs.environment_id }}
      developer_environment_name: ${{ steps.environment.outputs.environment_name }}
      developer_environment_url: ${{ steps.environment.outputs.environment_url }}
      changes_detected: ${{ steps.git_changes.outputs.changes_detected }}
      commit_created: ${{ steps.git_changes.outputs.commit_created }}
      commit_sha: ${{ steps.git_changes.outputs.commit_sha }}
      push_completed: ${{ steps.git_changes.outputs.push_completed }}
      compare_url: ${{ steps.links.outputs.compare_url }}
      pull_request_created: ${{ steps.pull_request.outputs.pull_request_created }}
      pull_request_number: ${{ steps.pull_request.outputs.pull_request_number }}
      pull_request_url: ${{ steps.pull_request.outputs.pull_request_url }}
      solution_version: ${{ steps.solution_details.outputs.solution_version }}
      solution_artifact_name: ${{ steps.export.outputs.artifact_name }}

    steps:
      - name: Check out change branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.branch_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: "true"
          pac-version-override: ${{ inputs.pac_cli_version }}

      - name: Validate inputs
        shell: pwsh
        env:
          BRANCH_REF: ${{ inputs.branch_ref }}
          DEVELOPER_ENVIRONMENT: ${{ inputs.developer_environment }}
          SOLUTION_PROJECT_FOLDER: ${{ inputs.solution_project_folder }}
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:BRANCH_REF)) {
            throw "branch_ref is required."
          }
          if ([string]::IsNullOrWhiteSpace($env:DEVELOPER_ENVIRONMENT)) {
            throw "developer_environment is required."
          }
          if (-not (Test-Path -LiteralPath $env:SOLUTION_PROJECT_FOLDER -PathType Container)) {
            throw "solution_project_folder was not found: $env:SOLUTION_PROJECT_FOLDER"
          }

          $sourceParent = Split-Path -Parent $env:SOLUTION_SOURCE_FOLDER
          if (-not [string]::IsNullOrWhiteSpace($sourceParent)) {
            New-Item -ItemType Directory -Path $sourceParent -Force | Out-Null
          }

      - name: Authenticate for environment administration
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-commit-admin" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Environment administration authentication failed."
          }

      - name: Resolve developer environment
        id: environment
        shell: pwsh
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.developer_environment }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Value($Object, [string[]]$Names) {
            if ($null -eq $Object) {
              return ""
            }

            $properties = $Object.PSObject.Properties
            if ($null -eq $properties) {
              return ""
            }

            foreach ($name in $Names) {
              $property = $properties[$name]
              if ($null -ne $property -and
                  -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                return [string]$property.Value
              }
            }

            return ""
          }

          function Normalize-Url([string]$Value) {
            return $Value.Trim().TrimEnd('/').ToLowerInvariant()
          }

          $raw = & pac admin list --environment "$env:REQUESTED_ENVIRONMENT" --json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list Power Platform environments."
          }

          $parsed = ($raw -join "`n") | ConvertFrom-Json
          $items = if ($null -ne $parsed.value) { @($parsed.value) } else { @($parsed) }
          $match = $null

          foreach ($item in $items) {
            $name = Get-Value $item @("Environment", "DisplayName", "EnvironmentName", "FriendlyName", "Name")
            $id = Get-Value $item @("Environment Id", "EnvironmentId", "Id")
            $url = Get-Value $item @("Environment Url", "EnvironmentUrl", "Url")

            if ($name -ceq $env:REQUESTED_ENVIRONMENT -or
                $id -ceq $env:REQUESTED_ENVIRONMENT -or
                (Normalize-Url $url) -eq (Normalize-Url $env:REQUESTED_ENVIRONMENT)) {
              $match = $item
              break
            }
          }

          if ($null -eq $match) {
            throw "The developer environment could not be resolved exactly."
          }

          "environment_id=$(Get-Value $match @('Environment Id','EnvironmentId','Id'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_name=$(Get-Value $match @('Environment','DisplayName','EnvironmentName','FriendlyName','Name'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_url=$(Get-Value $match @('Environment Url','EnvironmentUrl','Url'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate to developer environment
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
          ENVIRONMENT_URL: ${{ steps.environment.outputs.environment_url }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-commit-dev" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID" `
            --environment "$env:ENVIRONMENT_URL"

          if ($LASTEXITCODE -ne 0) {
            throw "Authentication to the developer environment failed."
          }

      - name: Export exact current feature solution
        id: export
        shell: pwsh
        env:
          ENVIRONMENT_URL: ${{ steps.environment.outputs.environment_url }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          EXPORT_MANAGED: ${{ inputs.export_managed }}
          EXPORT_ASYNC: ${{ inputs.export_async }}
          EXPORT_INCLUDE: ${{ inputs.export_include }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          $artifactFolder = Join-Path $env:RUNNER_TEMP "power-platform-feature-commit"
          New-Item -ItemType Directory -Path $artifactFolder -Force | Out-Null
          $suffix = if ($env:EXPORT_MANAGED -eq "true") { "_managed" } else { "_unmanaged" }
          $solutionZip = Join-Path $artifactFolder "$($env:SOLUTION_NAME)$suffix.zip"
          $exportLog = Join-Path $artifactFolder "solution-export.log"

          $arguments = @(
            "solution", "export",
            "--environment", $env:ENVIRONMENT_URL,
            "--name", $env:SOLUTION_NAME,
            "--path", $solutionZip,
            "--overwrite"
          )
          if ($env:EXPORT_MANAGED -eq "true") { $arguments += "--managed" }
          if ($env:EXPORT_ASYNC -eq "true") {
            $arguments += "--async"
            $arguments += @("--max-async-wait-time", $env:MAX_WAIT)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:EXPORT_INCLUDE)) {
            $arguments += @("--include", $env:EXPORT_INCLUDE)
          }

          $output = & pac @arguments 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $exportLog | Write-Host
          if ($exitCode -ne 0) { throw "The feature solution export failed." }
          if (-not (Test-Path -LiteralPath $solutionZip -PathType Leaf)) { throw "The feature solution ZIP was not created." }

          $hash = (Get-FileHash -LiteralPath $solutionZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $artifactName = "$($env:SOLUTION_NAME)-feature-changes-${{ github.run_number }}"
          "solution_zip=$solutionZip" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "solution_hash=$hash" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_folder=$artifactFolder" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=$artifactName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Commit exact feature export immediately
        id: commit_exact_package
        if: inputs.commit_changes && inputs.push_changes
        shell: pwsh
        env:
          BRANCH_REF: ${{ inputs.branch_ref }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOLUTION_PROJECT_FOLDER: ${{ inputs.solution_project_folder }}
          SOLUTION_ZIP: ${{ steps.export.outputs.solution_zip }}
          SOLUTION_HASH: ${{ steps.export.outputs.solution_hash }}
        run: |
          $ErrorActionPreference = "Stop"
          $packageFolder = Join-Path $env:SOLUTION_PROJECT_FOLDER "package/source"
          New-Item -ItemType Directory -Path $packageFolder -Force | Out-Null
          $suffix = if ($env:SOLUTION_ZIP -match '_managed\.zip$') { "_managed" } else { "_unmanaged" }
          $repositoryZip = Join-Path $packageFolder "$($env:SOLUTION_NAME)$suffix.zip"
          $hashFile = "$repositoryZip.sha256"
          Copy-Item -LiteralPath $env:SOLUTION_ZIP -Destination $repositoryZip -Force
          "$($env:SOLUTION_HASH)  $([System.IO.Path]::GetFileName($repositoryZip))" | Set-Content -LiteralPath $hashFile -Encoding utf8
          $relativeZip = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE,$repositoryZip).Replace('\','/')
          $relativeHash = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE,$hashFile).Replace('\','/')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- $relativeZip $relativeHash
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: store exact $($env:SOLUTION_NAME) feature export [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "The exact feature-package commit failed." }
            git push origin "HEAD:$env:BRANCH_REF"
            if ($LASTEXITCODE -ne 0) { throw "The exact feature package could not be pushed." }
          }
          "repository_zip=$relativeZip" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Unpack current feature solution
        shell: pwsh
        env:
          SOLUTION_ZIP: ${{ steps.export.outputs.solution_zip }}
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          EXPORT_MANAGED: ${{ inputs.export_managed }}
          ARTIFACT_FOLDER: ${{ steps.export.outputs.artifact_folder }}
        run: |
          $ErrorActionPreference = "Stop"

          $packageType = if ($env:EXPORT_MANAGED -eq "true") { "Managed" } else { "Unmanaged" }
          $unpackLog = Join-Path $env:ARTIFACT_FOLDER "solution-unpack.log"

          & pac solution unpack `
            --zipfile "$env:SOLUTION_ZIP" `
            --folder "$env:SOLUTION_SOURCE_FOLDER" `
            --packagetype "$packageType" `
            --allowWrite `
            --allowDelete `
            --clobber `
            --errorlevel Verbose `
            --log "$unpackLog"

          if ($LASTEXITCODE -ne 0) {
            throw "The exported solution could not be unpacked."
          }

      - name: Commit and push solution changes
        id: git_changes
        shell: pwsh
        env:
          BRANCH_REF: ${{ inputs.branch_ref }}
          SOLUTION_PROJECT_FOLDER: ${{ inputs.solution_project_folder }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          AZURE_WORK_ITEM_IDS: ${{ inputs.azure_work_item_ids }}
          COMMIT_CHANGES: ${{ inputs.commit_changes }}
          PUSH_CHANGES: ${{ inputs.push_changes }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all -- "$env:SOLUTION_PROJECT_FOLDER"
          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            $sha = (git rev-parse HEAD).Trim()
            "changes_detected=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "commit_created=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "push_completed=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "commit_sha=$sha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          "changes_detected=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($env:COMMIT_CHANGES -ne "true") {
            "commit_created=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "push_completed=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "commit_sha=$(git rev-parse HEAD)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $commitMessage = $env:COMMIT_MESSAGE.Trim()
          $workItemReferences = @()

          if (-not [string]::IsNullOrWhiteSpace($env:AZURE_WORK_ITEM_IDS)) {
            $tokens = $env:AZURE_WORK_ITEM_IDS -split '[,;\s]+' | Where-Object {
              -not [string]::IsNullOrWhiteSpace($_)
            }

            foreach ($token in $tokens) {
              $candidate = $token.Trim()
              if ($candidate -match '^(?i:AB#)?(?<id>\d+)$') {
                $reference = "AB#$($Matches.id)"
                if ($workItemReferences -notcontains $reference) {
                  $workItemReferences += $reference
                }
              }
              else {
                throw "Invalid Azure Boards work item ID: $candidate. Use numeric IDs such as 123 or AB#123."
              }
            }
          }

          foreach ($reference in $workItemReferences) {
            if ($commitMessage -notmatch "(?i)(^|\s)$([regex]::Escape($reference))(?=\s|$|[.,;:])") {
              $commitMessage = "$commitMessage $reference"
            }
          }

          git commit -m "$commitMessage"
          if ($LASTEXITCODE -ne 0) {
            throw "The feature commit failed."
          }

          $sha = (git rev-parse HEAD).Trim()
          "commit_created=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit_sha=$sha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($env:PUSH_CHANGES -eq "true") {
            git push origin "HEAD:$env:BRANCH_REF"
            if ($LASTEXITCODE -ne 0) {
              throw "The feature commit could not be pushed."
            }
            "push_completed=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          else {
            "push_completed=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Retrieve solution version
        id: solution_details
        shell: pwsh
        env:
          ENVIRONMENT_URL: ${{ steps.environment.outputs.environment_url }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Value($Object, [string[]]$Names) {
            if ($null -eq $Object) {
              return ""
            }

            $properties = $Object.PSObject.Properties
            if ($null -eq $properties) {
              return ""
            }

            foreach ($name in $Names) {
              $property = $properties[$name]
              if ($null -ne $property -and
                  -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                return [string]$property.Value
              }
            }

            return ""
          }

          $raw = & pac solution list --environment "$env:ENVIRONMENT_URL" --json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list solutions."
          }

          $parsed = ($raw -join "`n") | ConvertFrom-Json
          $items = if ($null -ne $parsed.value) { @($parsed.value) } else { @($parsed) }
          $version = ""

          foreach ($item in $items) {
            $uniqueName = Get-Value $item @("Unique Name", "UniqueName", "SolutionUniqueName", "Name")
            if ($uniqueName -ceq $env:SOLUTION_NAME) {
              $version = Get-Value $item @("Version", "SolutionVersion")
              break
            }
          }

          "solution_version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build compare link
        id: links
        shell: pwsh
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANCH_REF: ${{ inputs.branch_ref }}
        run: |
          $base = [uri]::EscapeDataString($env:BASE_BRANCH)
          $branch = [uri]::EscapeDataString($env:BRANCH_REF)
          $compareUrl = "${{ github.server_url }}/${{ github.repository }}/compare/$base...$branch"
          "compare_url=$compareUrl" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or locate pull request
        id: pull_request
        if: inputs.create_pull_request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_REF: ${{ inputs.branch_ref }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          PR_TITLE: ${{ inputs.pull_request_title }}
          PR_BODY: ${{ inputs.pull_request_body }}
          AZURE_WORK_ITEM_IDS: ${{ inputs.azure_work_item_ids }}
          PR_DRAFT: ${{ inputs.pull_request_draft }}
          PROJECT_KEY: ${{ inputs.project_key }}
        run: |
          $ErrorActionPreference = "Stop"

          $existingJson = gh pr list `
            --head "$env:BRANCH_REF" `
            --base "$env:BASE_BRANCH" `
            --state open `
            --json number,url

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to search for an existing pull request."
          }

          $existing = @($existingJson | ConvertFrom-Json)
          if ($existing.Count -gt 0) {
            "pull_request_created=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "pull_request_number=$($existing[0].number)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "pull_request_url=$($existing[0].url)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $title = if ([string]::IsNullOrWhiteSpace($env:PR_TITLE)) {
            "$($env:PROJECT_KEY): $($env:BRANCH_REF)"
          }
          else {
            $env:PR_TITLE
          }

          $body = if ([string]::IsNullOrWhiteSpace($env:PR_BODY)) {
            "Power Platform solution changes exported from the developer environment."
          }
          else {
            $env:PR_BODY
          }

          if (-not [string]::IsNullOrWhiteSpace($env:AZURE_WORK_ITEM_IDS)) {
            $references = @()
            $tokens = $env:AZURE_WORK_ITEM_IDS -split '[,;\s]+' | Where-Object {
              -not [string]::IsNullOrWhiteSpace($_)
            }

            foreach ($token in $tokens) {
              if ($token.Trim() -match '^(?i:AB#)?(?<id>\d+)$') {
                $reference = "AB#$($Matches.id)"
                if ($references -notcontains $reference) {
                  $references += $reference
                }
              }
            }

            if ($references.Count -gt 0) {
              $missingReferences = @($references | Where-Object {
                $body -notmatch "(?i)(^|\s)$([regex]::Escape($_))(?=\s|$|[.,;:])"
              })
              if ($missingReferences.Count -gt 0) {
                $body = "$body`n`nAzure Boards: $($missingReferences -join ', ')"
              }
            }
          }

          $arguments = @(
            "pr", "create",
            "--base", $env:BASE_BRANCH,
            "--head", $env:BRANCH_REF,
            "--title", $title,
            "--body", $body
          )
          if ($env:PR_DRAFT -eq "true") {
            $arguments += "--draft"
          }

          $url = (& gh @arguments).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "The pull request could not be created."
          }

          $number = ($url.TrimEnd('/') -split '/')[-1]

          "pull_request_created=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pull_request_number=$number" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pull_request_url=$url" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Record pull request outputs when disabled
        id: no_pull_request
        if: ${{ !inputs.create_pull_request }}
        shell: pwsh
        run: |
          "pull_request_created=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pull_request_number=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pull_request_url=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload feature-change artifact
        if: inputs.upload_solution_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.export.outputs.artifact_name }}
          path: ${{ steps.export.outputs.artifact_folder }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Add feature-change summary
        shell: pwsh
        env:
          BRANCH_REF: ${{ inputs.branch_ref }}
          ENVIRONMENT_NAME: ${{ steps.environment.outputs.environment_name }}
          ENVIRONMENT_URL: ${{ steps.environment.outputs.environment_url }}
          CHANGES_DETECTED: ${{ steps.git_changes.outputs.changes_detected }}
          COMMIT_SHA: ${{ steps.git_changes.outputs.commit_sha }}
          COMPARE_URL: ${{ steps.links.outputs.compare_url }}
          PR_URL: ${{ steps.pull_request.outputs.pull_request_url }}
          SOLUTION_VERSION: ${{ steps.solution_details.outputs.solution_version }}
          SOURCE_PACKAGE: ${{ steps.commit_exact_package.outputs.repository_zip }}
          SOURCE_HASH: ${{ steps.export.outputs.solution_hash }}
        run: |
          $pullRequestLine = if ([string]::IsNullOrWhiteSpace($env:PR_URL)) {
            "[Open comparison]($env:COMPARE_URL)"
          }
          else {
            "[Open pull request]($env:PR_URL)"
          }

          @"
          # Feature changes committed

          **Branch:** ``$env:BRANCH_REF``

