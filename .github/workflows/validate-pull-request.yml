name: Reusable - Validate Power Platform Pull Request

on:
  workflow_call:
    inputs:
      project_key:
        required: true
        type: string
      source_ref:
        description: Commit SHA or branch to validate
        required: true
        type: string
      pull_request_number:
        required: false
        default: 0
        type: number

      solution_name:
        required: true
        type: string
      solution_source_folder:
        required: true
        type: string
      solution_package_type:
        required: false
        default: Unmanaged
        type: string
      deployment_settings_file:
        required: false
        default: ""
        type: string

      run_solution_checker:
        required: false
        default: true
        type: boolean
      checker_environment:
        description: Environment URL or ID used to authenticate Solution Checker
        required: false
        default: ""
        type: string
      checker_geo:
        required: false
        default: UnitedKingdom
        type: string
      checker_rule_set:
        required: false
        default: Solution Checker
        type: string
      checker_rule_level_override_file:
        required: false
        default: ""
        type: string
      checker_excluded_files:
        required: false
        default: ""
        type: string
      checker_save_results:
        required: false
        default: false
        type: boolean
      checker_fail_on_errors:
        description: Fail when SARIF error-level findings are present
        required: false
        default: false
        type: boolean

      deploy_to_validation_environment:
        required: false
        default: false
        type: boolean
      validation_environment:
        description: Existing validation environment URL or ID
        required: false
        default: ""
        type: string
      validation_environment_name:
        description: Exact name used when creating or finding validation environment
        required: false
        default: ""
        type: string
      validation_environment_domain:
        required: false
        default: ""
        type: string
      validation_environment_mode:
        description: ReuseOrCreate or ExistingOnly
        required: false
        default: ReuseOrCreate
        type: string
      validation_environment_type:
        required: false
        default: Sandbox
        type: string
      validation_environment_region:
        required: false
        default: europe
        type: string
      validation_environment_currency:
        required: false
        default: GBP
        type: string
      validation_environment_language:
        required: false
        default: English
        type: string
      validation_environment_templates:
        required: false
        default: ""
        type: string
      validation_environment_security_group_id:
        required: false
        default: ""
        type: string
      environment_create_async:
        required: false
        default: true
        type: boolean

      force_overwrite:
        required: false
        default: true
        type: boolean
      publish_changes:
        required: false
        default: true
        type: boolean
      asynchronous_import:
        required: false
        default: false
        type: boolean

      max_async_wait_minutes:
        required: false
        default: 60
        type: number
      environment_lookup_attempts:
        required: false
        default: 20
        type: number
      environment_lookup_delay_seconds:
        required: false
        default: 30
        type: number
      upload_validation_artifacts:
        required: false
        default: true
        type: boolean
      artifact_retention_days:
        required: false
        default: 14
        type: number

    secrets:
      pp_tenant_id:
        required: true
      pp_app_id:
        required: true
      pp_client_secret:
        required: true

    outputs:
      validation_passed:
        value: ${{ jobs.validate.outputs.validation_passed }}
      pack_status:
        value: ${{ jobs.validate.outputs.pack_status }}
      checker_status:
        value: ${{ jobs.validate.outputs.checker_status }}
      checker_issue_count:
        value: ${{ jobs.validate.outputs.checker_issue_count }}
      checker_error_count:
        value: ${{ jobs.validate.outputs.checker_error_count }}
      checker_warning_count:
        value: ${{ jobs.validate.outputs.checker_warning_count }}
      checker_results_artifact_name:
        value: ${{ jobs.validate.outputs.checker_results_artifact_name }}
      deployment_status:
        value: ${{ jobs.validate.outputs.deployment_status }}
      validation_environment_action:
        value: ${{ jobs.validate.outputs.validation_environment_action }}
      validation_environment_id:
        value: ${{ jobs.validate.outputs.validation_environment_id }}
      validation_environment_name:
        value: ${{ jobs.validate.outputs.validation_environment_name }}
      validation_environment_url:
        value: ${{ jobs.validate.outputs.validation_environment_url }}
      validation_solution_url:
        value: ${{ jobs.validate.outputs.validation_solution_url }}
      deployment_url:
        value: ${{ jobs.validate.outputs.deployment_url }}
      solution_zip_artifact_name:
        value: ${{ jobs.validate.outputs.solution_zip_artifact_name }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Power Platform solution
    runs-on: windows-latest
    timeout-minutes: 150

    outputs:
      validation_passed: ${{ steps.result.outputs.validation_passed }}
      pack_status: ${{ steps.pack.outputs.pack_status }}
      checker_status: ${{ steps.checker_results.outputs.checker_status }}
      checker_issue_count: ${{ steps.checker_results.outputs.issue_count }}
      checker_error_count: ${{ steps.checker_results.outputs.error_count }}
      checker_warning_count: ${{ steps.checker_results.outputs.warning_count }}
      checker_results_artifact_name: ${{ steps.artifact_names.outputs.checker_artifact_name }}
      deployment_status: ${{ steps.deployment_result.outputs.deployment_status }}
      validation_environment_action: ${{ steps.environment_details.outputs.environment_action }}
      validation_environment_id: ${{ steps.environment_details.outputs.environment_id }}
      validation_environment_name: ${{ steps.environment_details.outputs.environment_name }}
      validation_environment_url: ${{ steps.environment_details.outputs.environment_url }}
      validation_solution_url: ${{ steps.links.outputs.solution_url }}
      deployment_url: ${{ steps.links.outputs.deployment_url }}
      solution_zip_artifact_name: ${{ steps.artifact_names.outputs.solution_artifact_name }}

    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: "true"

      - name: Validate inputs
        shell: pwsh
        env:
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          PACKAGE_TYPE: ${{ inputs.solution_package_type }}
          RUN_CHECKER: ${{ inputs.run_solution_checker }}
          CHECKER_ENVIRONMENT: ${{ inputs.checker_environment }}
          DEPLOY: ${{ inputs.deploy_to_validation_environment }}
          VALIDATION_ENVIRONMENT: ${{ inputs.validation_environment }}
          VALIDATION_NAME: ${{ inputs.validation_environment_name }}
          VALIDATION_MODE: ${{ inputs.validation_environment_mode }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:SOLUTION_SOURCE_FOLDER -PathType Container)) {
            throw "solution_source_folder was not found: $env:SOLUTION_SOURCE_FOLDER"
          }

          if (@("Unmanaged", "Managed") -notcontains $env:PACKAGE_TYPE) {
            throw "solution_package_type must be Unmanaged or Managed."
          }

          if (@("ReuseOrCreate", "ExistingOnly") -notcontains $env:VALIDATION_MODE) {
            throw "validation_environment_mode must be ReuseOrCreate or ExistingOnly."
          }

          if ($env:RUN_CHECKER -eq "true" -and
              [string]::IsNullOrWhiteSpace($env:CHECKER_ENVIRONMENT) -and
              $env:DEPLOY -ne "true") {
            throw "checker_environment is required when Solution Checker runs without validation deployment."
          }

          if ($env:DEPLOY -eq "true" -and
              [string]::IsNullOrWhiteSpace($env:VALIDATION_ENVIRONMENT) -and
              [string]::IsNullOrWhiteSpace($env:VALIDATION_NAME)) {
            throw "Provide validation_environment or validation_environment_name when deployment is enabled."
          }

      - name: Prepare artifact folders
        id: folders
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "power-platform-pr-validation"
          $checker = Join-Path $root "checker"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path $checker -Force | Out-Null

          "root=$root" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checker=$checker" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Pack solution
        id: pack
        shell: pwsh
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          PACKAGE_TYPE: ${{ inputs.solution_package_type }}
          ARTIFACT_ROOT: ${{ steps.folders.outputs.root }}
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path $env:ARTIFACT_ROOT "$($env:SOLUTION_NAME)-validation.zip"
          $log = Join-Path $env:ARTIFACT_ROOT "solution-pack.log"

          & pac solution pack `
            --zipfile "$zip" `
            --folder "$env:SOLUTION_SOURCE_FOLDER" `
            --packagetype "$env:PACKAGE_TYPE" `
            --errorlevel Verbose `
            --log "$log"

          if ($LASTEXITCODE -ne 0) {
            "pack_status=Failed" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            throw "The pull request solution could not be packed."
          }

          "solution_zip=$zip" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pack_status=Succeeded" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate for tenant administration
        if: inputs.deploy_to_validation_environment
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-val-admin" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Validation tenant administration authentication failed."
          }

      - name: Find existing validation environment
        id: find_environment
        if: inputs.deploy_to_validation_environment
        shell: pwsh
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.validation_environment }}
          REQUESTED_NAME: ${{ inputs.validation_environment_name }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Value($Object, [string[]]$Names) {
            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties[$name]
              if ($null -ne $property -and -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                return [string]$property.Value
              }
            }
            return ""
          }

          function Normalize-Url([string]$Value) {
            return $Value.Trim().TrimEnd('/').ToLowerInvariant()
          }

          $query = if (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_ENVIRONMENT)) {
            $env:REQUESTED_ENVIRONMENT
          }
          else {
            $env:REQUESTED_NAME
          }

          $raw = & pac admin list --environment "$query" --json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list validation environments."
          }

          $text = $raw -join "`n"
          $items = @()
          if (-not [string]::IsNullOrWhiteSpace($text)) {
            $parsed = $text | ConvertFrom-Json
            $items = if ($null -ne $parsed.value) { @($parsed.value) } else { @($parsed) }
          }

          $match = $null
          foreach ($item in $items) {
            $name = Get-Value $item @("Environment", "DisplayName", "EnvironmentName", "FriendlyName", "Name")
            $id = Get-Value $item @("Environment Id", "EnvironmentId", "Id")
            $url = Get-Value $item @("Environment Url", "EnvironmentUrl", "Url")

            $matchesRequested = -not [string]::IsNullOrWhiteSpace($env:REQUESTED_ENVIRONMENT) -and (
              $id -ceq $env:REQUESTED_ENVIRONMENT -or
              (Normalize-Url $url) -eq (Normalize-Url $env:REQUESTED_ENVIRONMENT)
            )
            $matchesName = -not [string]::IsNullOrWhiteSpace($env:REQUESTED_NAME) -and
              $name -ceq $env:REQUESTED_NAME

            if ($matchesRequested -or $matchesName) {
              $match = $item
              break
            }
          }

          if ($null -eq $match) {
            "exists=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          "exists=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_id=$(Get-Value $match @('Environment Id','EnvironmentId','Id'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_name=$(Get-Value $match @('Environment','DisplayName','EnvironmentName','FriendlyName','Name'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_url=$(Get-Value $match @('Environment Url','EnvironmentUrl','Url'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Block missing ExistingOnly validation environment
        if: inputs.deploy_to_validation_environment && steps.find_environment.outputs.exists == 'false' && inputs.validation_environment_mode == 'ExistingOnly'
        shell: pwsh
        run: |
          throw "The validation environment does not exist and validation_environment_mode is ExistingOnly."

      - name: Generate validation environment domain
        id: validation_domain
        if: inputs.deploy_to_validation_environment && steps.find_environment.outputs.exists == 'false'
        shell: pwsh
        env:
          REQUESTED_DOMAIN: ${{ inputs.validation_environment_domain }}
          VALIDATION_NAME: ${{ inputs.validation_environment_name }}
        run: |
          function Convert-ToSafeDomain([string]$Value) {
            $result = $Value.ToLowerInvariant() -replace '[^a-z0-9-]', '-'
            $result = $result -replace '-+', '-'
            return $result.Trim('-')
          }

          $domain = if ([string]::IsNullOrWhiteSpace($env:REQUESTED_DOMAIN)) {
            Convert-ToSafeDomain $env:VALIDATION_NAME
          }
          else {
            Convert-ToSafeDomain $env:REQUESTED_DOMAIN
          }

          if ([string]::IsNullOrWhiteSpace($domain)) {
            throw "A validation environment domain could not be generated."
          }

          "domain=$domain" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create validation environment
        if: inputs.deploy_to_validation_environment && steps.find_environment.outputs.exists == 'false'
        shell: pwsh
        env:
          NAME: ${{ inputs.validation_environment_name }}
          DOMAIN: ${{ steps.validation_domain.outputs.domain }}
          TYPE: ${{ inputs.validation_environment_type }}
          REGION: ${{ inputs.validation_environment_region }}
          CURRENCY: ${{ inputs.validation_environment_currency }}
          LANGUAGE: ${{ inputs.validation_environment_language }}
          TEMPLATES: ${{ inputs.validation_environment_templates }}
          SECURITY_GROUP_ID: ${{ inputs.validation_environment_security_group_id }}
          CREATE_ASYNC: ${{ inputs.environment_create_async }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "admin", "create",
            "--name", $env:NAME,
            "--domain", $env:DOMAIN,
            "--type", $env:TYPE,
            "--region", $env:REGION,
            "--currency", $env:CURRENCY,
            "--language", $env:LANGUAGE,
            "--max-async-wait-time", $env:MAX_WAIT,
            "--json"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:TEMPLATES)) {
            $arguments += @("--templates", $env:TEMPLATES)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SECURITY_GROUP_ID)) {
            $arguments += @("--security-group-id", $env:SECURITY_GROUP_ID)
          }
          if ($env:CREATE_ASYNC -eq "true") {
            $arguments += "--async"
          }

          & pac @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Validation environment creation failed."
          }

      - name: Retrieve validation environment details
        id: environment_details
        if: inputs.deploy_to_validation_environment
        shell: pwsh
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.validation_environment }}
          REQUESTED_NAME: ${{ inputs.validation_environment_name }}
          EXISTED: ${{ steps.find_environment.outputs.exists }}
          LOOKUP_ATTEMPTS: ${{ inputs.environment_lookup_attempts }}
          LOOKUP_DELAY: ${{ inputs.environment_lookup_delay_seconds }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Value($Object, [string[]]$Names) {
            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties[$name]
              if ($null -ne $property -and -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                return [string]$property.Value
              }
            }
            return ""
          }

          function Normalize-Url([string]$Value) {
            return $Value.Trim().TrimEnd('/').ToLowerInvariant()
          }

          $environmentId = ""
          $environmentName = ""
          $environmentUrl = ""

          for ($attempt = 1; $attempt -le [int]$env:LOOKUP_ATTEMPTS; $attempt++) {
            $query = if (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_ENVIRONMENT)) {
              $env:REQUESTED_ENVIRONMENT
            }
            else {
              $env:REQUESTED_NAME
            }

            $raw = & pac admin list --environment "$query" --json
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to retrieve the validation environment."
            }

            $parsed = ($raw -join "`n") | ConvertFrom-Json
            $items = if ($null -ne $parsed.value) { @($parsed.value) } else { @($parsed) }

            foreach ($item in $items) {
              $name = Get-Value $item @("Environment", "DisplayName", "EnvironmentName", "FriendlyName", "Name")
              $id = Get-Value $item @("Environment Id", "EnvironmentId", "Id")
              $url = Get-Value $item @("Environment Url", "EnvironmentUrl", "Url")

              $matchesRequested = -not [string]::IsNullOrWhiteSpace($env:REQUESTED_ENVIRONMENT) -and (
                $id -ceq $env:REQUESTED_ENVIRONMENT -or
                (Normalize-Url $url) -eq (Normalize-Url $env:REQUESTED_ENVIRONMENT)
              )
              $matchesName = -not [string]::IsNullOrWhiteSpace($env:REQUESTED_NAME) -and
                $name -ceq $env:REQUESTED_NAME

              if ($matchesRequested -or $matchesName) {
                $environmentId = $id
                $environmentName = $name
                $environmentUrl = $url
                break
              }
            }

            if (-not [string]::IsNullOrWhiteSpace($environmentId) -and
                -not [string]::IsNullOrWhiteSpace($environmentUrl)) {
              break
            }

            if ($attempt -lt [int]$env:LOOKUP_ATTEMPTS) {
              Start-Sleep -Seconds ([int]$env:LOOKUP_DELAY)
            }
          }

          if ([string]::IsNullOrWhiteSpace($environmentId)) {
            throw "The validation environment could not be resolved."
          }

          $action = if ($env:EXISTED -eq "true") { "Reused" } else { "Created" }

          "environment_action=$action" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_id=$environmentId" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_name=$environmentName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_url=$environmentUrl" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate for Solution Checker
        if: inputs.run_solution_checker
        id: checker_auth
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
          CHECKER_ENVIRONMENT: ${{ inputs.checker_environment }}
          VALIDATION_ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
        run: |
          $ErrorActionPreference = "Stop"

          $environment = $env:CHECKER_ENVIRONMENT
          if ([string]::IsNullOrWhiteSpace($environment)) {
            $environment = $env:VALIDATION_ENVIRONMENT_URL
          }
          if ([string]::IsNullOrWhiteSpace($environment)) {
            throw "No environment is available for Solution Checker authentication."
          }

          pac auth create `
            --name "pp-checker" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID" `
            --environment "$environment"

          if ($LASTEXITCODE -ne 0) {
            throw "Solution Checker authentication failed."
          }

          "environment=$environment" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run Solution Checker
        if: inputs.run_solution_checker
        shell: pwsh
        env:
          SOLUTION_ZIP: ${{ steps.pack.outputs.solution_zip }}
          CHECKER_OUTPUT: ${{ steps.folders.outputs.checker }}
          CHECKER_ENVIRONMENT: ${{ steps.checker_auth.outputs.environment }}
          CHECKER_GEO: ${{ inputs.checker_geo }}
          CHECKER_RULE_SET: ${{ inputs.checker_rule_set }}
          RULE_OVERRIDE_FILE: ${{ inputs.checker_rule_level_override_file }}
          EXCLUDED_FILES: ${{ inputs.checker_excluded_files }}
          SAVE_RESULTS: ${{ inputs.checker_save_results }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "solution", "check",
            "--path", $env:SOLUTION_ZIP,
            "--outputDirectory", $env:CHECKER_OUTPUT,
            "--environment", $env:CHECKER_ENVIRONMENT,
            "--geo", $env:CHECKER_GEO,
            "--ruleSet", $env:CHECKER_RULE_SET
          )

          if (-not [string]::IsNullOrWhiteSpace($env:RULE_OVERRIDE_FILE)) {
            if (-not (Test-Path -LiteralPath $env:RULE_OVERRIDE_FILE -PathType Leaf)) {
              throw "checker_rule_level_override_file was not found."
            }
            $arguments += @("--ruleLevelOverride", $env:RULE_OVERRIDE_FILE)
          }

          if (-not [string]::IsNullOrWhiteSpace($env:EXCLUDED_FILES)) {
            $arguments += @("--excludedFiles", $env:EXCLUDED_FILES)
          }

          if ($env:SAVE_RESULTS -eq "true") {
            $arguments += "--saveResults"
          }

          & pac @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Solution Checker did not complete successfully."
          }

      - name: Read Solution Checker results
        id: checker_results
        shell: pwsh
        env:
          RUN_CHECKER: ${{ inputs.run_solution_checker }}
          CHECKER_OUTPUT: ${{ steps.folders.outputs.checker }}
          FAIL_ON_ERRORS: ${{ inputs.checker_fail_on_errors }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RUN_CHECKER -ne "true") {
            "checker_status=Skipped" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "issue_count=0" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "error_count=0" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "warning_count=0" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $issueCount = 0
          $errorCount = 0
          $warningCount = 0

          $sarifFiles = Get-ChildItem -Path $env:CHECKER_OUTPUT -Filter *.sarif -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $sarifFiles) {
            try {
              $sarif = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
              foreach ($run in @($sarif.runs)) {
                foreach ($result in @($run.results)) {
                  $issueCount++
                  switch ([string]$result.level) {
                    "error" { $errorCount++ }
                    "warning" { $warningCount++ }
                  }
                }
              }
            }
            catch {
              Write-Warning "Could not parse SARIF file: $($file.FullName)"
            }
          }

          "checker_status=Completed" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "issue_count=$issueCount" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "error_count=$errorCount" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "warning_count=$warningCount" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($env:FAIL_ON_ERRORS -eq "true" -and $errorCount -gt 0) {
            throw "Solution Checker returned $errorCount error-level findings."
          }

      - name: Authenticate to validation environment
        if: inputs.deploy_to_validation_environment
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-val-target" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID" `
            --environment "$env:ENVIRONMENT_URL"

          if ($LASTEXITCODE -ne 0) {
            throw "Authentication to the validation environment failed."
          }

      - name: Deploy solution to validation environment
        if: inputs.deploy_to_validation_environment
        id: deploy
        shell: pwsh
        env:
          SOLUTION_ZIP: ${{ steps.pack.outputs.solution_zip }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
          SETTINGS_FILE: ${{ inputs.deployment_settings_file }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite }}
          PUBLISH_CHANGES: ${{ inputs.publish_changes }}
          ASYNC_IMPORT: ${{ inputs.asynchronous_import }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "solution", "import",
            "--path", $env:SOLUTION_ZIP,
            "--environment", $env:ENVIRONMENT_URL,
            "--max-async-wait-time", $env:MAX_WAIT
          )

          if ($env:FORCE_OVERWRITE -eq "true") { $arguments += "--force-overwrite" }
          if ($env:PUBLISH_CHANGES -eq "true") { $arguments += "--publish-changes" }
          if ($env:ASYNC_IMPORT -eq "true") { $arguments += "--async" }

          if (-not [string]::IsNullOrWhiteSpace($env:SETTINGS_FILE)) {
            if (-not (Test-Path -LiteralPath $env:SETTINGS_FILE -PathType Leaf)) {
              throw "deployment_settings_file was not found: $env:SETTINGS_FILE"
            }
            $arguments += @("--settings-file", $env:SETTINGS_FILE)
          }

          & pac @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Validation deployment failed."
          }

      - name: Record deployment result
        id: deployment_result
        shell: pwsh
        env:
          DEPLOY: ${{ inputs.deploy_to_validation_environment }}
        run: |
          $status = if ($env:DEPLOY -eq "true") { "Succeeded" } else { "Skipped" }
          "deployment_status=$status" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build validation links
        id: links
        shell: pwsh
        env:
          DEPLOY: ${{ inputs.deploy_to_validation_environment }}
          ENVIRONMENT_ID: ${{ steps.environment_details.outputs.environment_id }}
        run: |
          if ($env:DEPLOY -ne "true" -or [string]::IsNullOrWhiteSpace($env:ENVIRONMENT_ID)) {
            "solution_url=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "deployment_url=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $solutionsUrl = "https://make.powerapps.com/environments/$env:ENVIRONMENT_ID/solutions"
          "solution_url=$solutionsUrl" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "deployment_url=$solutionsUrl" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build artifact names
        id: artifact_names
        shell: pwsh
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
        run: |
          "solution_artifact_name=$($env:SOLUTION_NAME)-pr-validation-${{ github.run_number }}" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checker_artifact_name=$($env:SOLUTION_NAME)-checker-${{ github.run_number }}" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload validation artifacts
        if: inputs.upload_validation_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_names.outputs.solution_artifact_name }}
          path: ${{ steps.folders.outputs.root }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Record overall validation result
        id: result
        shell: pwsh
        run: |
          "validation_passed=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Add validation summary
        if: always()
        shell: pwsh
        env:
          PACK_STATUS: ${{ steps.pack.outputs.pack_status }}
          CHECKER_STATUS: ${{ steps.checker_results.outputs.checker_status }}
          ISSUE_COUNT: ${{ steps.checker_results.outputs.issue_count }}
          ERROR_COUNT: ${{ steps.checker_results.outputs.error_count }}
          WARNING_COUNT: ${{ steps.checker_results.outputs.warning_count }}
          DEPLOYMENT_STATUS: ${{ steps.deployment_result.outputs.deployment_status }}
          ENVIRONMENT_NAME: ${{ steps.environment_details.outputs.environment_name }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
          SOLUTION_URL: ${{ steps.links.outputs.solution_url }}
        run: |
          $environmentLine = if ([string]::IsNullOrWhiteSpace($env:ENVIRONMENT_URL)) {
            "Validation deployment was not requested."
          }
          else {
            "**Validation environment:** [$env:ENVIRONMENT_NAME]($env:ENVIRONMENT_URL)`n`n**Solution:** [Open Solutions]($env:SOLUTION_URL)"
          }

          @"
          # Pull request validation

          **Pack:** ``$env:PACK_STATUS``

          **Solution Checker:** ``$env:CHECKER_STATUS``

          **Checker findings:** $env:ISSUE_COUNT total, $env:ERROR_COUNT errors, $env:WARNING_COUNT warnings

          **Deployment:** ``$env:DEPLOYMENT_STATUS``

          $environmentLine
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
