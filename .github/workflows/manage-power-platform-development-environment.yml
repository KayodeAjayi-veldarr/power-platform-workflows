name: Internal - Reusable Manage Power Platform Development Environment

on:
  workflow_call:
    inputs:
      workspace_action:
        description: PrepareOrReuse or DeleteEnvironment
        required: false
        default: PrepareOrReuse
        type: string

      project_key:
        description: Short project identifier used for naming and safety checks
        required: true
        type: string

      pac_cli_version:
        description: Power Platform CLI version installed by microsoft/powerplatform-actions
        required: false
        default: 2.9.3
        type: string

      branch_ref:
        description: Feature branch to update when preparing a workspace
        required: false
        default: ""
        type: string

      base_branch:
        description: Main integration branch
        required: false
        default: main
        type: string

      developer_alias:
        description: Short developer identifier
        required: true
        type: string

      developer_upn:
        description: Developer Microsoft 365 UPN or Entra object ID
        required: false
        default: ""
        type: string

      source_environment:
        description: Source environment URL, ID or unique name
        required: false
        default: ""
        type: string

      source_solution_name:
        description: Solution unique name in the source environment
        required: false
        default: ""
        type: string

      source_export_managed:
        required: false
        default: false
        type: boolean

      source_export_async:
        required: false
        default: true
        type: boolean

      source_export_include:
        description: Optional comma-separated export settings
        required: false
        default: ""
        type: string

      solution_name:
        description: Canonical solution unique name
        required: false
        default: ""
        type: string

      solution_project_folder:
        description: Repository folder containing the cdsproj and source folder
        required: false
        default: ""
        type: string

      solution_source_folder:
        description: Repository folder containing unpacked solution source
        required: false
        default: ""
        type: string

      solution_package_type:
        description: Unmanaged or Managed
        required: false
        default: Unmanaged
        type: string

      auto_bind_connection_references:
        description: Advanced opt-in connection binding. Disabled by default for predictable imports
        required: false
        default: false
        type: boolean

      require_connection_bindings:
        description: Fail when connection references cannot be bound automatically
        required: false
        default: false
        type: boolean

      provision_dataverse_connections:
        description: Advanced opt-in Dataverse connection provisioning
        required: false
        default: false
        type: boolean

      dataverse_connection_name:
        description: Optional fixed name for the automatically provisioned Dataverse connection
        required: false
        default: ""
        type: string

      commit_baseline_to_branch:
        required: false
        default: true
        type: boolean

      baseline_commit_message:
        required: false
        default: Sync baseline Power Platform solution
        type: string

      workspace_environment:
        description: >
          PrepareOrReuse: exact environment display name, or blank to generate.
          DeleteEnvironment: environment name, URL or ID.
        required: false
        default: ""
        type: string

      workspace_environment_domain:
        description: Dataverse domain used only when creating an environment
        required: false
        default: ""
        type: string

      workspace_environment_suffix:
        required: false
        default: DEV
        type: string

      workspace_environment_mode:
        description: ReuseOrCreate or CreateOnly
        required: false
        default: ReuseOrCreate
        type: string

      workspace_environment_type:
        description: Developer, Sandbox, Trial or SubscriptionBasedTrial
        required: false
        default: Developer
        type: string

      workspace_environment_region:
        description: Power Platform region
        required: false
        default: europe
        type: string

      workspace_environment_currency:
        description: Dataverse currency code
        required: false
        default: GBP
        type: string

      workspace_environment_language:
        description: Environment language
        required: false
        default: English
        type: string

      workspace_environment_templates:
        required: false
        default: ""
        type: string

      workspace_environment_security_group_id:
        required: false
        default: ""
        type: string

      environment_create_async:
        required: false
        default: false
        type: boolean

      environment_stabilization_seconds:
        description: Seconds to wait after creating a new environment before importing a solution
        required: false
        default: 180
        type: number

      assign_automation_user:
        required: false
        default: true
        type: boolean

      automation_role:
        required: false
        default: System Administrator
        type: string

      assign_developer:
        required: false
        default: true
        type: boolean

      developer_role:
        required: false
        default: System Administrator
        type: string

      force_overwrite:
        required: false
        default: true
        type: boolean

      publish_changes:
        required: false
        default: true
        type: boolean

      asynchronous_import:
        required: false
        default: false
        type: boolean

      activate_plugins:
        required: false
        default: false
        type: boolean

      skip_dependency_check:
        required: false
        default: false
        type: boolean

      skip_lower_version:
        required: false
        default: false
        type: boolean

      deletion_confirmation:
        description: Required for deletion. Must equal DELETE:resolved-environment-name
        required: false
        default: ""
        type: string

      expected_environment_name_prefix:
        description: Safe environment-name prefix required for deletion
        required: false
        default: ""
        type: string

      allowed_environment_types:
        description: Comma-separated environment types allowed for deletion
        required: false
        default: Developer,Sandbox,Trial,SubscriptionBasedTrial
        type: string

      asynchronous_delete:
        required: false
        default: true
        type: boolean

      max_async_wait_minutes:
        required: false
        default: 60
        type: number

      environment_lookup_attempts:
        required: false
        default: 20
        type: number

      environment_lookup_delay_seconds:
        required: false
        default: 30
        type: number

      upload_solution_artifact:
        required: false
        default: true
        type: boolean

      artifact_retention_days:
        required: false
        default: 7
        type: number

      next_step_message:
        required: false
        default: Open the imported solution and begin development.
        type: string

    secrets:
      pp_tenant_id:
        required: true

      pp_app_id:
        required: true

      pp_client_secret:
        required: true

      source_pp_tenant_id:
        required: false

      source_pp_app_id:
        required: false

      source_pp_client_secret:
        required: false

    outputs:
      workspace_action:
        value: ${{ jobs.validate.outputs.workspace_action }}

      workspace_status:
        value: >-
          ${{ jobs.prepare.outputs.developer_environment_action ||
          jobs.delete.outputs.deletion_status }}

      environment_id:
        value: >-
          ${{ jobs.prepare.outputs.developer_environment_id ||
          jobs.delete.outputs.environment_id }}

      environment_name:
        value: >-
          ${{ jobs.prepare.outputs.developer_environment_name ||
          jobs.delete.outputs.environment_name }}

      environment_url:
        value: >-
          ${{ jobs.prepare.outputs.developer_environment_url ||
          jobs.delete.outputs.environment_url }}

      maker_environment_url:
        value: ${{ jobs.prepare.outputs.maker_environment_url }}

      solution_url:
        value: ${{ jobs.prepare.outputs.solution_url }}

      solution_version:
        value: ${{ jobs.prepare.outputs.solution_version }}

      baseline_commit_sha:
        value: ${{ jobs.prepare.outputs.baseline_commit_sha }}

      deleted:
        value: ${{ jobs.delete.outputs.deleted }}

permissions:
  contents: write


jobs:
  validate:
    name: Validate workspace request
    runs-on: ubuntu-latest

    outputs:
      workspace_action: ${{ steps.validate.outputs.workspace_action }}

    steps:
      - name: Validate action and environment inputs
        id: validate
        shell: bash
        env:
          WORKSPACE_ACTION: ${{ inputs.workspace_action }}
          PROJECT_KEY: ${{ inputs.project_key }}
          WORKSPACE_ENVIRONMENT: ${{ inputs.workspace_environment }}
          SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
          DEVELOPER_UPN: ${{ inputs.developer_upn }}
          EXPECTED_PREFIX: ${{ inputs.expected_environment_name_prefix }}
          DELETION_CONFIRMATION: ${{ inputs.deletion_confirmation }}
        run: |
          set -euo pipefail

          if [[ -z "$PROJECT_KEY" ]]; then
            echo "project_key is required."
            exit 1
          fi

          case "$WORKSPACE_ACTION" in
            PrepareOrReuse)
              if [[ -z "$SOURCE_ENVIRONMENT" ]]; then
                echo "source_environment is required for PrepareOrReuse."
                exit 1
              fi

              if [[ -z "$DEVELOPER_UPN" ]]; then
                echo "developer_upn is required for PrepareOrReuse."
                exit 1
              fi
              ;;

            DeleteEnvironment)
              if [[ -z "$WORKSPACE_ENVIRONMENT" ]]; then
                echo "workspace_environment is required for DeleteEnvironment."
                exit 1
              fi

              if [[ -z "$EXPECTED_PREFIX" ]]; then
                echo "expected_environment_name_prefix is required for deletion."
                exit 1
              fi

              if [[ -z "$DELETION_CONFIRMATION" ]]; then
                echo "deletion_confirmation is required for deletion."
                exit 1
              fi
              ;;

            *)
              echo "workspace_action must be PrepareOrReuse or DeleteEnvironment."
              exit 1
              ;;
          esac

          echo "workspace_action=$WORKSPACE_ACTION" >> "$GITHUB_OUTPUT"

  prepare:
    needs: validate
    if: inputs.workspace_action == 'PrepareOrReuse'

    name: Manage Power Platform development environment
    runs-on: windows-latest
    timeout-minutes: 150

    concurrency:
      group: power-platform-start-${{ github.repository }}-${{ inputs.developer_alias }}
      cancel-in-progress: false

    outputs:
      branch_ref: ${{ inputs.branch_ref }}
      baseline_changes_detected: ${{ steps.commit_baseline.outputs.changes_detected || steps.no_commit_baseline.outputs.changes_detected }}
      baseline_commit_sha: ${{ steps.commit_baseline.outputs.commit_sha || steps.no_commit_baseline.outputs.commit_sha }}
      developer_environment_action: ${{ steps.environment_details.outputs.environment_action }}
      developer_environment_id: ${{ steps.environment_details.outputs.environment_id }}
      developer_environment_name: ${{ steps.names.outputs.environment_name }}
      developer_environment_url: ${{ steps.environment_details.outputs.environment_url }}
      maker_environment_url: ${{ steps.links.outputs.maker_environment_url }}
      solutions_url: ${{ steps.links.outputs.solutions_url }}
      solution_id: ${{ steps.solution_details.outputs.solution_id }}
      solution_url: ${{ steps.links.outputs.solution_url }}
      solution_version: ${{ steps.solution_details.outputs.solution_version }}
      solution_artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Check out change branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.branch_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: "true"
          pac-version-override: ${{ inputs.pac_cli_version }}

      - name: Validate inputs
        shell: pwsh
        env:
          BRANCH_REF: ${{ inputs.branch_ref }}
          SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
          SOURCE_SOLUTION_NAME: ${{ inputs.source_solution_name }}
          SOLUTION_PROJECT_FOLDER: ${{ inputs.solution_project_folder }}
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          SOLUTION_PACKAGE_TYPE: ${{ inputs.solution_package_type }}
          TARGET_MODE: ${{ inputs.workspace_environment_mode }}
          TARGET_TYPE: ${{ inputs.workspace_environment_type }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:BRANCH_REF)) {
            throw "branch_ref is required."
          }

          if ([string]::IsNullOrWhiteSpace($env:SOURCE_ENVIRONMENT)) {
            throw "source_environment is required."
          }

          if ([string]::IsNullOrWhiteSpace($env:SOURCE_SOLUTION_NAME)) {
            throw "source_solution_name is required."
          }

          if ([string]::IsNullOrWhiteSpace($env:SOLUTION_PROJECT_FOLDER)) {
            throw "solution_project_folder is required."
          }

          if ([string]::IsNullOrWhiteSpace($env:SOLUTION_SOURCE_FOLDER)) {
            throw "solution_source_folder is required."
          }

          # These folders may not exist on the first run. Create them inside the
          # checked-out project repository before exporting and unpacking the baseline.
          New-Item -ItemType Directory -Path $env:SOLUTION_PROJECT_FOLDER -Force | Out-Null
          New-Item -ItemType Directory -Path $env:SOLUTION_SOURCE_FOLDER -Force | Out-Null

          if (@("Unmanaged", "Managed") -notcontains $env:SOLUTION_PACKAGE_TYPE) {
            throw "solution_package_type must be Unmanaged or Managed."
          }

          if (@("ReuseOrCreate", "CreateOnly") -notcontains $env:TARGET_MODE) {
            throw "target_environment_mode must be ReuseOrCreate or CreateOnly."
          }

          $allowedTypes = @(
            "Developer",
            "Sandbox",
            "Production",
            "Trial",
            "Teams",
            "SubscriptionBasedTrial"
          )
          if ($allowedTypes -notcontains $env:TARGET_TYPE) {
            throw "Unsupported target_environment_type: $env:TARGET_TYPE"
          }

          if ([int]$env:MAX_WAIT -lt 1) {
            throw "max_async_wait_minutes must be greater than zero."
          }

          if ($null -eq (Get-Command pac -ErrorAction SilentlyContinue)) {
            throw "PAC CLI is not available on PATH."
          }

      - name: Authenticate to source environment
        shell: pwsh
        env:
          SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
          TARGET_TENANT_ID: ${{ secrets.pp_tenant_id }}
          TARGET_APP_ID: ${{ secrets.pp_app_id }}
          TARGET_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
          SOURCE_TENANT_ID: ${{ secrets.source_pp_tenant_id }}
          SOURCE_APP_ID: ${{ secrets.source_pp_app_id }}
          SOURCE_CLIENT_SECRET: ${{ secrets.source_pp_client_secret }}
        run: |
          $ErrorActionPreference = "Stop"

          $tenantId = $env:SOURCE_TENANT_ID
          $appId = $env:SOURCE_APP_ID
          $clientSecret = $env:SOURCE_CLIENT_SECRET

          if ([string]::IsNullOrWhiteSpace($tenantId)) {
            $tenantId = $env:TARGET_TENANT_ID
          }
          if ([string]::IsNullOrWhiteSpace($appId)) {
            $appId = $env:TARGET_APP_ID
          }
          if ([string]::IsNullOrWhiteSpace($clientSecret)) {
            $clientSecret = $env:TARGET_CLIENT_SECRET
          }

          pac auth create `
            --name "pp-src" `
            --applicationId "$appId" `
            --clientSecret "$clientSecret" `
            --tenant "$tenantId" `
            --environment "$env:SOURCE_ENVIRONMENT"

          if ($LASTEXITCODE -ne 0) {
            throw "Authentication to the source environment failed."
          }

      - name: Export exact baseline solution
        id: export_baseline
        shell: pwsh
        env:
          SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
          SOURCE_SOLUTION_NAME: ${{ inputs.source_solution_name }}
          EXPORT_MANAGED: ${{ inputs.source_export_managed }}
          EXPORT_ASYNC: ${{ inputs.source_export_async }}
          EXPORT_INCLUDE: ${{ inputs.source_export_include }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          $artifactFolder = Join-Path $env:RUNNER_TEMP "power-platform-feature-start"
          New-Item -ItemType Directory -Path $artifactFolder -Force | Out-Null

          $suffix = if ($env:EXPORT_MANAGED -eq "true") { "_managed" } else { "_unmanaged" }
          $sourceZip = Join-Path $artifactFolder "$($env:SOURCE_SOLUTION_NAME)$suffix.zip"
          $exportLog = Join-Path $artifactFolder "solution-export.log"

          $arguments = @(
            "solution", "export",
            "--environment", $env:SOURCE_ENVIRONMENT,
            "--name", $env:SOURCE_SOLUTION_NAME,
            "--path", $sourceZip,
            "--overwrite"
          )

          if ($env:EXPORT_MANAGED -eq "true") { $arguments += "--managed" }
          if ($env:EXPORT_ASYNC -eq "true") {
            $arguments += "--async"
            $arguments += @("--max-async-wait-time", $env:MAX_WAIT)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:EXPORT_INCLUDE)) {
            $arguments += @("--include", $env:EXPORT_INCLUDE)
          }

          $output = & pac @arguments 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $exportLog | Write-Host

          if ($exitCode -ne 0) { throw "The baseline solution export failed." }
          if (-not (Test-Path -LiteralPath $sourceZip -PathType Leaf)) {
            throw "The source solution ZIP was not created."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($sourceZip)
          try {
            $entries = @($archive.Entries.FullName)
            if ($entries -notcontains "solution.xml" -or $entries -notcontains "customizations.xml") {
              throw "The exported file is not a valid Power Platform solution ZIP."
            }
          }
          finally { $archive.Dispose() }

          $hash = (Get-FileHash -LiteralPath $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($sourceZip))" |
            Set-Content -LiteralPath (Join-Path $artifactFolder "source-package.sha256") -Encoding utf8

          "source_zip=$sourceZip" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_hash=$hash" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_folder=$artifactFolder" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Commit exact source ZIP immediately
        id: commit_source_package
        if: inputs.commit_baseline_to_branch
        shell: pwsh
        env:
          BRANCH_REF: ${{ inputs.branch_ref }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOLUTION_PROJECT_FOLDER: ${{ inputs.solution_project_folder }}
          SOURCE_ZIP: ${{ steps.export_baseline.outputs.source_zip }}
          SOURCE_HASH: ${{ steps.export_baseline.outputs.source_hash }}
        run: |
          $ErrorActionPreference = "Stop"

          $packageFolder = Join-Path $env:SOLUTION_PROJECT_FOLDER "package/source"
          New-Item -ItemType Directory -Path $packageFolder -Force | Out-Null

          $suffix = if ($env:SOURCE_ZIP -match '_managed\.zip$') { "_managed" } else { "_unmanaged" }
          $repositoryZip = Join-Path $packageFolder "$($env:SOLUTION_NAME)$suffix.zip"
          $hashFile = "$repositoryZip.sha256"

          Copy-Item -LiteralPath $env:SOURCE_ZIP -Destination $repositoryZip -Force
          "$($env:SOURCE_HASH)  $([System.IO.Path]::GetFileName($repositoryZip))" |
            Set-Content -LiteralPath $hashFile -Encoding utf8

          $relativeZip = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $repositoryZip).Replace('\','/')
          $relativeHash = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $hashFile).Replace('\','/')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- $relativeZip $relativeHash
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: store exact $($env:SOLUTION_NAME) source export [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "The exact source-package commit failed." }
            git push origin "HEAD:$env:BRANCH_REF"
            if ($LASTEXITCODE -ne 0) { throw "The exact source package could not be pushed." }
          }

          "repository_zip=$relativeZip" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "repository_hash=$relativeHash" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Unpack baseline into the change branch
        shell: pwsh
        env:
          SOURCE_ZIP: ${{ steps.export_baseline.outputs.source_zip }}
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          EXPORT_MANAGED: ${{ inputs.source_export_managed }}
        run: |
          $ErrorActionPreference = "Stop"

          $unpackLog = Join-Path `
            "${{ steps.export_baseline.outputs.artifact_folder }}" `
            "baseline-unpack.log"

          $packageType = if ($env:EXPORT_MANAGED -eq "true") {
            "Managed"
          }
          else {
            "Unmanaged"
          }

          $arguments = @(
            "solution", "unpack",
            "--zipfile", $env:SOURCE_ZIP,
            "--folder", $env:SOLUTION_SOURCE_FOLDER,
            "--packagetype", $packageType,
            "--allowWrite",
            "--allowDelete",
            "--clobber",
            "--errorlevel", "Verbose",
            "--log", $unpackLog
          )

          & pac @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "The baseline solution could not be unpacked into the branch."
          }

      - name: Commit baseline files to the change branch
        id: commit_baseline
        if: inputs.commit_baseline_to_branch
        shell: pwsh
        env:
          BRANCH_REF: ${{ inputs.branch_ref }}
          SOLUTION_PROJECT_FOLDER: ${{ inputs.solution_project_folder }}
          COMMIT_MESSAGE: ${{ inputs.baseline_commit_message }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all -- "$env:SOLUTION_PROJECT_FOLDER"

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            $sha = (git rev-parse HEAD).Trim()
            "changes_detected=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "commit_sha=$sha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No baseline source changes were detected."
            exit 0
          }

          git commit -m "$env:COMMIT_MESSAGE"
          if ($LASTEXITCODE -ne 0) {
            throw "The baseline commit failed."
          }

          git push origin "HEAD:$env:BRANCH_REF"
          if ($LASTEXITCODE -ne 0) {
            throw "The baseline commit could not be pushed to $env:BRANCH_REF."
          }

          $sha = (git rev-parse HEAD).Trim()
          "changes_detected=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit_sha=$sha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Record baseline outputs when commit is disabled
        id: no_commit_baseline
        if: ${{ !inputs.commit_baseline_to_branch }}
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          "Commit to branch was disabled." | Write-Host
          "changes_detected=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit_sha=$sha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate developer environment name and domain
        id: names
        shell: pwsh
        env:
          PROJECT_KEY: ${{ inputs.project_key }}
          DEVELOPER_ALIAS: ${{ inputs.developer_alias }}
          REQUESTED_NAME: ${{ inputs.workspace_environment }}
          REQUESTED_DOMAIN: ${{ inputs.workspace_environment_domain }}
          SUFFIX: ${{ inputs.workspace_environment_suffix }}
          BRANCH_REF: ${{ inputs.branch_ref }}
        run: |
          $ErrorActionPreference = "Stop"

          function Convert-ToSafeName([string]$Value) {
            $result = $Value.ToUpperInvariant() -replace '[^A-Z0-9-]', '-'
            $result = $result -replace '-+', '-'
            return $result.Trim('-')
          }

          function Convert-ToSafeDomain([string]$Value) {
            $result = $Value.ToLowerInvariant() -replace '[^a-z0-9-]', '-'
            $result = $result -replace '-+', '-'
            $result = $result.Trim('-')
            if ([string]::IsNullOrWhiteSpace($result)) { $result = "pp" }
            if ($result.Length -gt 32) { $result = $result.Substring(0, 32).Trim('-') }
            if ($result.Length -lt 2) { $result = ($result + "pp").Substring(0, 2) }
            return $result
          }

          if ([string]::IsNullOrWhiteSpace($env:REQUESTED_NAME)) {
            $branchPart = Convert-ToSafeName (($env:BRANCH_REF -replace '^refs/heads/', '') -replace '^(change|feature|bugfix|hotfix)/', '')
            if ([string]::IsNullOrWhiteSpace($branchPart)) { $branchPart = "WORK" }
            if ($branchPart.Length -gt 24) { $branchPart = $branchPart.Substring(0, 24).Trim('-') }
            $environmentName = "{0}-{1}-{2}-{3}" -f `
              (Convert-ToSafeName $env:PROJECT_KEY), `
              (Convert-ToSafeName $env:DEVELOPER_ALIAS), `
              $branchPart, `
              (Convert-ToSafeName $env:SUFFIX)
          }
          else {
            $environmentName = $env:REQUESTED_NAME.Trim()
          }

          if ([string]::IsNullOrWhiteSpace($env:REQUESTED_DOMAIN)) {
            $environmentDomain = Convert-ToSafeDomain $environmentName
          }
          else {
            $environmentDomain = Convert-ToSafeDomain $env:REQUESTED_DOMAIN
          }

          if ([string]::IsNullOrWhiteSpace($environmentName)) {
            throw "A valid developer environment name could not be generated."
          }
          if ([string]::IsNullOrWhiteSpace($environmentDomain)) {
            throw "A valid developer environment domain could not be generated."
          }

          "environment_name=$environmentName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_domain=$environmentDomain" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate for target tenant administration
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-tgt-admin" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Target tenant administration authentication failed."
          }

      - name: Find existing developer environment
        id: find_environment
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.names.outputs.environment_name }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Value($Object, [string[]]$Names) {
            if ($null -eq $Object) {
              return ""
            }

            $properties = $Object.PSObject.Properties
            if ($null -eq $properties) {
              return ""
            }

            foreach ($name in $Names) {
              $property = $properties[$name]
              if ($null -ne $property -and
                  -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                return [string]$property.Value
              }
            }

            return ""
          }

          $raw = & pac admin list --name "$env:ENVIRONMENT_NAME" --json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list Power Platform environments."
          }

          $text = $raw -join "`n"
          $items = @()
          if (-not [string]::IsNullOrWhiteSpace($text)) {
            $parsed = $text | ConvertFrom-Json
            if ($null -ne $parsed.value) {
              $items = @($parsed.value)
            }
            else {
              $items = @($parsed)
            }
          }

          $match = $null
          foreach ($item in $items) {
            $name = Get-Value $item @("Environment", "DisplayName", "EnvironmentName", "FriendlyName", "Name")
            if ($name -ceq $env:ENVIRONMENT_NAME) {
              $match = $item
              break
            }
          }

          if ($null -eq $match) {
            "exists=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          "exists=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_id=$(Get-Value $match @('Environment Id','EnvironmentId','Id'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_url=$(Get-Value $match @('Environment Url','EnvironmentUrl','Url'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_type=$(Get-Value $match @('Type','EnvironmentType'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Enforce target environment mode
        if: steps.find_environment.outputs.exists == 'true' && inputs.workspace_environment_mode == 'CreateOnly'
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.names.outputs.environment_name }}
        run: |
          throw "Environment '$env:ENVIRONMENT_NAME' already exists and target_environment_mode is CreateOnly."

      - name: Create developer environment
        if: steps.find_environment.outputs.exists == 'false'
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.names.outputs.environment_name }}
          ENVIRONMENT_DOMAIN: ${{ steps.names.outputs.environment_domain }}
          ENVIRONMENT_TYPE: ${{ inputs.workspace_environment_type }}
          DEVELOPER_UPN: ${{ inputs.developer_upn }}
          REGION: ${{ inputs.workspace_environment_region }}
          CURRENCY: ${{ inputs.workspace_environment_currency }}
          LANGUAGE: ${{ inputs.workspace_environment_language }}
          TEMPLATES: ${{ inputs.workspace_environment_templates }}
          SECURITY_GROUP_ID: ${{ inputs.workspace_environment_security_group_id }}
          CREATE_ASYNC: ${{ inputs.environment_create_async }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "admin", "create",
            "--name", $env:ENVIRONMENT_NAME,
            "--type", $env:ENVIRONMENT_TYPE,
            "--region", $env:REGION,
            "--currency", $env:CURRENCY,
            "--language", $env:LANGUAGE,
            "--domain", $env:ENVIRONMENT_DOMAIN,
            "--max-async-wait-time", $env:MAX_WAIT
          )

          if ($env:ENVIRONMENT_TYPE -eq "Developer") {
            if ([string]::IsNullOrWhiteSpace($env:DEVELOPER_UPN)) {
              throw "developer_upn is required when creating a Developer environment."
            }

            # Developer environments are owner-specific. Without --user,
            # PAC tries to use the authenticated service principal as the
            # environment owner, but a service principal is not a user.
            $arguments += @("--user", $env:DEVELOPER_UPN)
          }

          if (-not [string]::IsNullOrWhiteSpace($env:TEMPLATES)) {
            $arguments += @("--templates", $env:TEMPLATES)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SECURITY_GROUP_ID)) {
            $arguments += @("--security-group-id", $env:SECURITY_GROUP_ID)
          }
          if ($env:CREATE_ASYNC -eq "true") {
            $arguments += "--async"
          }

          & pac @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Developer environment creation failed."
          }

      - name: Retrieve developer environment details
        id: environment_details
        shell: pwsh
        env:
          ENVIRONMENT_NAME: ${{ steps.names.outputs.environment_name }}
          EXISTED: ${{ steps.find_environment.outputs.exists }}
          LOOKUP_ATTEMPTS: ${{ inputs.environment_lookup_attempts }}
          LOOKUP_DELAY: ${{ inputs.environment_lookup_delay_seconds }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Value($Object, [string[]]$Names) {
            if ($null -eq $Object) {
              return ""
            }

            $properties = $Object.PSObject.Properties
            if ($null -eq $properties) {
              return ""
            }

            foreach ($name in $Names) {
              $property = $properties[$name]
              if ($null -ne $property -and
                  -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                return [string]$property.Value
              }
            }

            return ""
          }

          $environmentId = ""
          $environmentUrl = ""
          $environmentType = ""

          for ($attempt = 1; $attempt -le [int]$env:LOOKUP_ATTEMPTS; $attempt++) {
            $raw = & pac admin list --name "$env:ENVIRONMENT_NAME" --json
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to retrieve the developer environment."
            }

            $text = $raw -join "`n"
            if (-not [string]::IsNullOrWhiteSpace($text)) {
              $parsed = $text | ConvertFrom-Json
              $items = if ($null -ne $parsed.value) { @($parsed.value) } else { @($parsed) }

              foreach ($item in $items) {
                $name = Get-Value $item @("Environment", "DisplayName", "EnvironmentName", "FriendlyName", "Name")
                if ($name -ceq $env:ENVIRONMENT_NAME) {
                  $environmentId = Get-Value $item @("Environment Id", "EnvironmentId", "Id")
                  $environmentUrl = Get-Value $item @("Environment Url", "EnvironmentUrl", "Url")
                  $environmentType = Get-Value $item @("Type", "EnvironmentType")
                  break
                }
              }
            }

            if (-not [string]::IsNullOrWhiteSpace($environmentId) -and
                -not [string]::IsNullOrWhiteSpace($environmentUrl)) {
              break
            }

            if ($attempt -lt [int]$env:LOOKUP_ATTEMPTS) {
              Start-Sleep -Seconds ([int]$env:LOOKUP_DELAY)
            }
          }

          if ([string]::IsNullOrWhiteSpace($environmentId) -or
              [string]::IsNullOrWhiteSpace($environmentUrl)) {
            throw "The developer environment was not available after the configured wait."
          }

          $action = if ($env:EXISTED -eq "true") { "Reused" } else { "Created" }

          "environment_action=$action" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_id=$environmentId" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_url=$environmentUrl" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_type=$environmentType" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Wait for new developer environment readiness
        if: steps.find_environment.outputs.exists == 'false'
        shell: pwsh
        env:
          WAIT_SECONDS: ${{ inputs.environment_stabilization_seconds }}
          ENVIRONMENT_NAME: ${{ steps.names.outputs.environment_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $seconds = [int]$env:WAIT_SECONDS
          if ($seconds -le 0) {
            Write-Host "No stabilization wait configured for $env:ENVIRONMENT_NAME."
            exit 0
          }

          Write-Host "Waiting $seconds seconds for Dataverse provisioning to settle in $env:ENVIRONMENT_NAME."
          Start-Sleep -Seconds $seconds

      - name: Assign automation application user
        if: inputs.assign_automation_user
        shell: pwsh
        env:
          ENVIRONMENT_ID: ${{ steps.environment_details.outputs.environment_id }}
          APP_ID: ${{ secrets.pp_app_id }}
          ROLE: ${{ inputs.automation_role }}
        run: |
          $ErrorActionPreference = "Stop"

          $output = & pac admin assign-user `
            --environment "$env:ENVIRONMENT_ID" `
            --user "$env:APP_ID" `
            --role "$env:ROLE" `
            --application-user 2>&1

          $exitCode = $LASTEXITCODE
          $output | Write-Host

          if ($exitCode -ne 0 -and (($output -join "`n") -notmatch '(?i)already|exists|assigned')) {
            throw "The automation application user could not be assigned."
          }

      - name: Assign developer
        if: inputs.assign_developer
        shell: pwsh
        env:
          ENVIRONMENT_ID: ${{ steps.environment_details.outputs.environment_id }}
          DEVELOPER_UPN: ${{ inputs.developer_upn }}
          ROLE: ${{ inputs.developer_role }}
        run: |
          $ErrorActionPreference = "Stop"

          $output = & pac admin assign-user `
            --environment "$env:ENVIRONMENT_ID" `
            --user "$env:DEVELOPER_UPN" `
            --role "$env:ROLE" 2>&1

          $exitCode = $LASTEXITCODE
          $output | Write-Host

          if ($exitCode -ne 0 -and (($output -join "`n") -notmatch '(?i)already|exists|assigned')) {
            throw "The developer could not be assigned."
          }

      - name: Prepare exact source package for import
        id: package
        shell: pwsh
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOURCE_ZIP: ${{ steps.export_baseline.outputs.source_zip }}
          SOURCE_HASH: ${{ steps.export_baseline.outputs.source_hash }}
          ARTIFACT_FOLDER: ${{ steps.export_baseline.outputs.artifact_folder }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:SOURCE_ZIP -PathType Leaf)) {
            throw "The exact source export is missing: $env:SOURCE_ZIP"
          }
          $currentHash = (Get-FileHash -LiteralPath $env:SOURCE_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($currentHash -ne $env:SOURCE_HASH) {
            throw "The source solution ZIP changed after export. Expected $env:SOURCE_HASH but found $currentHash."
          }
          $artifactName = "$($env:SOLUTION_NAME)-feature-start-${{ github.run_number }}"
          "solution_zip=$($env:SOURCE_ZIP)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=$artifactName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate to developer environment
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-dev" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID" `
            --environment "$env:ENVIRONMENT_URL"

          if ($LASTEXITCODE -ne 0) {
            throw "Authentication to the developer environment failed."
          }

      - name: Provision and bind developer-environment connections
        id: connection_settings
        if: inputs.auto_bind_connection_references
        shell: pwsh
        env:
          SOLUTION_ZIP: ${{ steps.package.outputs.solution_zip }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
          ENVIRONMENT_NAME: ${{ steps.names.outputs.environment_name }}
          PROJECT_KEY: ${{ inputs.project_key }}
          ARTIFACT_FOLDER: ${{ steps.export_baseline.outputs.artifact_folder }}
          REQUIRE_BINDINGS: ${{ inputs.require_connection_bindings }}
          PROVISION_DATAVERSE: ${{ inputs.provision_dataverse_connections }}
          DATAVERSE_CONNECTION_NAME: ${{ inputs.dataverse_connection_name }}
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
        run: |
          $ErrorActionPreference = "Stop"

          function Normalize-ApiId([string]$Value) {
            if ([string]::IsNullOrWhiteSpace($Value)) { return "" }
            return $Value.Trim().TrimEnd('/').Split('/')[-1].ToLowerInvariant()
          }

          function Test-IsDataverseApi([string]$ApiId) {
            return @('shared_commondataserviceforapps','shared_commondataservice') -contains (Normalize-ApiId $ApiId)
          }

          function Test-IsHealthy([string]$Status) {
            if ([string]::IsNullOrWhiteSpace($Status)) { return $true }
            return $Status -match '(?i)connected|ready|enabled'
          }

          function Get-Connections {
            $raw = & pac connection list --environment "$env:ENVIRONMENT_URL" 2>&1
            if ($LASTEXITCODE -ne 0) {
              $raw | Write-Host
              throw "Unable to list connections in the developer environment."
            }

            $items = @()
            foreach ($line in $raw) {
              $text = [string]$line
              $idMatch = [regex]::Match($text, '(?i)(?<id>[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})')
              $apiMatch = [regex]::Match($text, '(?i)(?<api>shared_[a-z0-9_]+)')
              if (-not $idMatch.Success -or -not $apiMatch.Success) { continue }

              $nameStart = $idMatch.Index + $idMatch.Length
              $nameLength = [Math]::Max(0, $apiMatch.Index - $nameStart)
              $name = if ($nameLength -gt 0) { $text.Substring($nameStart, $nameLength).Trim(' ', '|', "`t") } else { "" }
              $statusStart = $apiMatch.Index + $apiMatch.Length
              $status = if ($statusStart -lt $text.Length) { $text.Substring($statusStart).Trim(' ', '|', "`t") } else { "" }

              $items += [pscustomobject]@{
                Id = $idMatch.Groups['id'].Value
                Name = $name
                ApiId = Normalize-ApiId $apiMatch.Groups['api'].Value
                Status = $status
              }
            }
            return @($items)
          }

          function Find-Connection($Connections, [string]$ApiId, [string]$PreferredName) {
            $normalApi = Normalize-ApiId $ApiId
            $aliases = if (Test-IsDataverseApi $normalApi) {
              @('shared_commondataserviceforapps','shared_commondataservice')
            }
            else { @($normalApi) }

            $matches = @($Connections | Where-Object {
              $aliases -contains $_.ApiId -and (Test-IsHealthy $_.Status)
            })

            if (-not [string]::IsNullOrWhiteSpace($PreferredName)) {
              $preferred = @($matches | Where-Object { $_.Name -ieq $PreferredName })
              if ($preferred.Count -gt 0) { return $preferred[0] }
            }
            if ($matches.Count -eq 1) { return $matches[0] }
            return $null
          }

          $generated = Join-Path $env:ARTIFACT_FOLDER "generated-deployment-settings.json"
          & pac solution create-settings --solution-zip "$env:SOLUTION_ZIP" --settings-file "$generated"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $generated)) {
            throw "PAC could not inspect the solution connection references."
          }

          $settings = Get-Content -LiteralPath $generated -Raw | ConvertFrom-Json
          $references = @($settings.ConnectionReferences)
          if ($references.Count -eq 0) {
            "settings_file=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "mapping_status=NotRequired" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $desiredName = $env:DATAVERSE_CONNECTION_NAME
          if ([string]::IsNullOrWhiteSpace($desiredName)) {
            $safeProject = ($env:PROJECT_KEY -replace '[^A-Za-z0-9_-]', '-').Trim('-')
            $safeEnvironment = ($env:ENVIRONMENT_NAME -replace '[^A-Za-z0-9 _-]', '-').Trim('-')
            $desiredName = "ALM Dataverse - $safeProject - $safeEnvironment"
            if ($desiredName.Length -gt 90) { $desiredName = $desiredName.Substring(0, 90).Trim() }
          }

          $connections = Get-Connections
          $createdCount = 0
          $unresolved = @()

          foreach ($reference in $references) {
            $apiId = Normalize-ApiId ([string]$reference.ConnectorId)
            $preferredName = if (Test-IsDataverseApi $apiId) { $desiredName } else { "" }
            $connection = Find-Connection $connections $apiId $preferredName

            if ($null -eq $connection -and (Test-IsDataverseApi $apiId) -and $env:PROVISION_DATAVERSE -eq 'true') {
              Write-Host "No reusable Dataverse connection was found. Creating '$desiredName' with the automation service principal."
              $createOutput = & pac connection create `
                --environment "$env:ENVIRONMENT_URL" `
                --name "$desiredName" `
                --application-id "$env:PP_APP_ID" `
                --client-secret "$env:PP_CLIENT_SECRET" `
                --tenant-id "$env:PP_TENANT_ID" 2>&1
              $createExit = $LASTEXITCODE
              $createOutput | Write-Host
              if ($createExit -ne 0 -and (($createOutput -join "`n") -notmatch '(?i)already|exists')) {
                throw "The workflow could not create the Dataverse service-principal connection."
              }

              for ($attempt = 1; $attempt -le 12; $attempt++) {
                Start-Sleep -Seconds 5
                $connections = Get-Connections
                $connection = Find-Connection $connections $apiId $desiredName
                if ($null -ne $connection) { break }
              }
              if ($null -ne $connection) { $createdCount++ }
            }

            if ($null -ne $connection) {
              $reference.ConnectionId = $connection.Id
              Write-Host "Bound $($reference.LogicalName) [$apiId] to $($connection.Name) [$($connection.Id)]."
            }
            else {
              $reason = if (Test-IsDataverseApi $apiId) {
                "Dataverse service-principal connection could not be created or resolved"
              }
              else {
                "No existing connection was found. This connector requires its own authentication and cannot be created from the Dataverse service-principal credentials"
              }
              $unresolved += "$($reference.LogicalName) [$apiId]: $reason"
            }
          }

          $resolved = [ordered]@{
            EnvironmentVariables = @()
            ConnectionReferences = $references
          }
          $resolvedFile = Join-Path $env:ARTIFACT_FOLDER "connection-settings.auto.json"
          $resolved | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $resolvedFile -Encoding utf8
          $unresolved | Set-Content -LiteralPath (Join-Path $env:ARTIFACT_FOLDER "unresolved-connections.txt") -Encoding utf8

          if ($unresolved.Count -gt 0) {
            $message = "Connection references could not be prepared: " + ($unresolved -join '; ')
            if ($env:REQUIRE_BINDINGS -eq 'true') { throw $message }
            Write-Warning $message
            "settings_file=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "mapping_status=Incomplete" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          else {
            "settings_file=$resolvedFile" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "mapping_status=Complete" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "connections_created=$createdCount" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Record connection mapping when disabled
        id: no_connection_settings
        if: ${{ !inputs.auto_bind_connection_references }}
        shell: pwsh
        run: |
          "settings_file=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "mapping_status=ManualAfterImport" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Record connection references for manual setup
        if: ${{ !inputs.auto_bind_connection_references }}
        shell: pwsh
        env:
          SOLUTION_ZIP: ${{ steps.package.outputs.solution_zip }}
          ARTIFACT_FOLDER: ${{ steps.export_baseline.outputs.artifact_folder }}
        run: |
          $ErrorActionPreference = "Continue"
          $settingsFile = Join-Path $env:ARTIFACT_FOLDER "connection-references.manual.json"
          $summaryFile = Join-Path $env:ARTIFACT_FOLDER "connection-references.manual.txt"

          $output = & pac solution create-settings --solution-zip "$env:SOLUTION_ZIP" --settings-file "$settingsFile" 2>&1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $settingsFile)) {
            $output | Write-Warning
            "The solution was imported without automatic connection mapping. Open the solution in the target environment and update its connection references manually." |
              Set-Content -LiteralPath $summaryFile -Encoding utf8
            exit 0
          }

          try {
            $settings = Get-Content -LiteralPath $settingsFile -Raw | ConvertFrom-Json
            $references = @($settings.ConnectionReferences)
            if ($references.Count -eq 0) {
              "No connection references were found in the solution package." |
                Set-Content -LiteralPath $summaryFile -Encoding utf8
            }
            else {
              $lines = @(
                "The solution was imported without automatic connection mapping.",
                "Update these connection references in the environment, then turn on the affected flows:"
              )
              foreach ($reference in $references) {
                $lines += "- $($reference.LogicalName) | $($reference.ConnectorId)"
              }
              $lines | Set-Content -LiteralPath $summaryFile -Encoding utf8
              Write-Warning "Connection references were left for manual configuration. The import will continue and affected flows may remain off."
            }
          }
          catch {
            "The solution was imported without automatic connection mapping. Open the solution in the target environment and update its connection references manually." |
              Set-Content -LiteralPath $summaryFile -Encoding utf8
          }

      - name: Import exact source ZIP into developer environment
        id: import_solution
        shell: pwsh
        env:
          SOLUTION_ZIP: ${{ steps.package.outputs.solution_zip }}
          EXPECTED_HASH: ${{ steps.export_baseline.outputs.source_hash }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
          SETTINGS_FILE: ${{ steps.connection_settings.outputs.settings_file || steps.no_connection_settings.outputs.settings_file }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite }}
          PUBLISH_CHANGES: ${{ inputs.publish_changes }}
          ASYNC_IMPORT: ${{ inputs.asynchronous_import }}
          ACTIVATE_PLUGINS: ${{ inputs.activate_plugins }}
          SKIP_DEPENDENCY_CHECK: ${{ inputs.skip_dependency_check }}
          SKIP_LOWER_VERSION: ${{ inputs.skip_lower_version }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
          ARTIFACT_FOLDER: ${{ steps.export_baseline.outputs.artifact_folder }}
        run: |
          $ErrorActionPreference = "Stop"

          $actualHash = (Get-FileHash -LiteralPath $env:SOLUTION_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:EXPECTED_HASH) {
            throw "The package hash changed before import. Expected $env:EXPECTED_HASH but found $actualHash."
          }

          $arguments = @(
            "solution", "import",
            "--path", $env:SOLUTION_ZIP,
            "--environment", $env:ENVIRONMENT_URL
          )
          if ($env:FORCE_OVERWRITE -eq "true") { $arguments += "--force-overwrite" }
          if ($env:PUBLISH_CHANGES -eq "true") { $arguments += "--publish-changes" }
          if ($env:ASYNC_IMPORT -eq "true") {
            $arguments += "--async"
            $arguments += @("--max-async-wait-time", $env:MAX_WAIT)
          }
          if ($env:ACTIVATE_PLUGINS -eq "true") { $arguments += "--activate-plugins" }
          if ($env:SKIP_DEPENDENCY_CHECK -eq "true") { $arguments += "--skip-dependency-check" }
          if ($env:SKIP_LOWER_VERSION -eq "true") { $arguments += "--skip-lower-version" }
          if (-not [string]::IsNullOrWhiteSpace($env:SETTINGS_FILE)) {
            $arguments += @("--settings-file", $env:SETTINGS_FILE)
          }

          $importLog = Join-Path $env:ARTIFACT_FOLDER "solution-import.log"
          $output = & pac @arguments 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $importLog | Write-Host
          if ($exitCode -ne 0) {
            throw "The exact exported solution ZIP failed to import. Review solution-import.log in the workflow artifact."
          }

      - name: Retrieve imported solution details
        id: solution_details
        shell: pwsh
        env:
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Value($Object, [string[]]$Names) {
            if ($null -eq $Object) {
              return ""
            }

            $properties = $Object.PSObject.Properties
            if ($null -eq $properties) {
              return ""
            }

            foreach ($name in $Names) {
              $property = $properties[$name]
              if ($null -ne $property -and
                  -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                return [string]$property.Value
              }
            }

            return ""
          }

          $raw = & pac solution list --environment "$env:ENVIRONMENT_URL" --json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list solutions in the developer environment."
          }

          $jsonText = $raw -join "`n"
          if ([string]::IsNullOrWhiteSpace($jsonText)) {
            throw "PAC returned no solution-list JSON."
          }

          $parsed = $jsonText | ConvertFrom-Json

          if ($parsed -is [System.Array]) {
            $items = @($parsed)
          }
          elseif ($null -ne $parsed.PSObject.Properties["value"]) {
            $items = @($parsed.value)
          }
          else {
            $items = @($parsed)
          }

          $items = @($items | Where-Object { $null -ne $_ })

          $match = $null
          foreach ($item in $items) {
            $uniqueName = Get-Value $item @(
              "SolutionUniqueName",
              "UniqueName",
              "Unique Name",
              "Name"
            )

            if ($uniqueName -ceq $env:SOLUTION_NAME) {
              $match = $item
              break
            }
          }

          if ($null -eq $match) {
            throw "The imported solution could not be found after import."
          }

          $solutionId = Get-Value $match @("Id", "SolutionId", "Solution Id")
          $solutionVersion = Get-Value $match @("Version", "SolutionVersion")

          "solution_id=$solutionId" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "solution_version=$solutionVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build workspace links
        id: links
        shell: pwsh
        env:
          ENVIRONMENT_ID: ${{ steps.environment_details.outputs.environment_id }}
          SOLUTION_ID: ${{ steps.solution_details.outputs.solution_id }}
        run: |
          $makerUrl = "https://make.powerapps.com/environments/$env:ENVIRONMENT_ID"
          $solutionsUrl = "$makerUrl/solutions"
          $solutionUrl = if ([string]::IsNullOrWhiteSpace($env:SOLUTION_ID)) {
            $solutionsUrl
          }
          else {
            "$solutionsUrl/$env:SOLUTION_ID"
          }

          "maker_environment_url=$makerUrl" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "solutions_url=$solutionsUrl" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "solution_url=$solutionUrl" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload start-workspace artifact
        if: inputs.upload_solution_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.export_baseline.outputs.artifact_folder }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Add workspace summary
        shell: pwsh
        env:
          BRANCH_REF: ${{ inputs.branch_ref }}
          SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
          SOURCE_SOLUTION: ${{ inputs.source_solution_name }}
          ENVIRONMENT_ACTION: ${{ steps.environment_details.outputs.environment_action }}
          ENVIRONMENT_NAME: ${{ steps.names.outputs.environment_name }}
          ENVIRONMENT_URL: ${{ steps.environment_details.outputs.environment_url }}
          MAKER_URL: ${{ steps.links.outputs.maker_environment_url }}
          SOLUTIONS_URL: ${{ steps.links.outputs.solutions_url }}
          SOLUTION_URL: ${{ steps.links.outputs.solution_url }}
          SOLUTION_VERSION: ${{ steps.solution_details.outputs.solution_version }}
          BASELINE_SHA: ${{ steps.commit_baseline.outputs.commit_sha || steps.no_commit_baseline.outputs.commit_sha }}
          SOURCE_PACKAGE: ${{ steps.commit_source_package.outputs.repository_zip }}
          SOURCE_HASH: ${{ steps.export_baseline.outputs.source_hash }}
          CONNECTION_MAPPING: ${{ steps.connection_settings.outputs.mapping_status || steps.no_connection_settings.outputs.mapping_status }}
          NEXT_STEP: ${{ inputs.next_step_message }}
        run: |
          @"
          # Feature workspace ready

          **Branch:** ``$env:BRANCH_REF``

          **Baseline source:** [$env:SOURCE_SOLUTION]($env:SOURCE_ENVIRONMENT)

          **Baseline commit:** ``$env:BASELINE_SHA``

          **Exact source ZIP:** ``$env:SOURCE_PACKAGE``

          **Source ZIP SHA256:** ``$env:SOURCE_HASH``

          **Connection-reference mapping:** ``$env:CONNECTION_MAPPING``

          **Environment handling:** $env:ENVIRONMENT_ACTION

          **Developer environment:** [$env:ENVIRONMENT_NAME]($env:ENVIRONMENT_URL)

          **Power Apps:** [Open maker environment]($env:MAKER_URL)

          **Solutions:** [Open Solutions]($env:SOLUTIONS_URL)

          **Solution:** [Open imported solution]($env:SOLUTION_URL)

          **Solution version:** ``$env:SOLUTION_VERSION``

          ## Next step

          $env:NEXT_STEP
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  delete:
    needs: validate
    if: inputs.workspace_action == 'DeleteEnvironment'

    name: Delete Power Platform workspace
    runs-on: windows-latest
    timeout-minutes: 90

    concurrency:
      group: power-platform-delete-${{ github.repository }}-${{ inputs.workspace_environment }}
      cancel-in-progress: false

    outputs:
      environment_found: ${{ steps.resolve.outputs.environment_found }}
      environment_id: ${{ steps.resolve.outputs.environment_id }}
      environment_name: ${{ steps.resolve.outputs.environment_name }}
      environment_url: ${{ steps.resolve.outputs.environment_url }}
      environment_type: ${{ steps.resolve.outputs.environment_type }}
      ownership_verified: ${{ steps.verify.outputs.ownership_verified }}
      deletion_started: ${{ steps.remove.outputs.deletion_started || steps.not_found.outputs.deletion_started }}
      deleted: ${{ steps.remove.outputs.deleted || steps.not_found.outputs.deleted }}
      deletion_status: ${{ steps.remove.outputs.deletion_status || steps.not_found.outputs.deletion_status }}

    steps:
      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: "true"
          pac-version-override: ${{ inputs.pac_cli_version }}

      - name: Authenticate for environment administration
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-delete-admin" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Environment administration authentication failed."
          }

      - name: Resolve environment exactly
        id: resolve
        shell: pwsh
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.workspace_environment }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Value($Object, [string[]]$Names) {
            if ($null -eq $Object) {
              return ""
            }

            $properties = $Object.PSObject.Properties
            if ($null -eq $properties) {
              return ""
            }

            foreach ($name in $Names) {
              $property = $properties[$name]
              if ($null -ne $property -and
                  -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                return [string]$property.Value
              }
            }

            return ""
          }

          function Normalize-Url([string]$Value) {
            return $Value.Trim().TrimEnd('/').ToLowerInvariant()
          }

          $raw = & pac admin list --environment "$env:REQUESTED_ENVIRONMENT" --json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list Power Platform environments."
          }

          $text = $raw -join "`n"
          if ([string]::IsNullOrWhiteSpace($text)) {
            "environment_found=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_id=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_name=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_url=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_type=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $parsed = $text | ConvertFrom-Json
          $items = if ($null -ne $parsed.value) { @($parsed.value) } else { @($parsed) }
          $match = $null

          foreach ($item in $items) {
            $name = Get-Value $item @("Environment", "DisplayName", "EnvironmentName", "FriendlyName", "Name")
            $id = Get-Value $item @("Environment Id", "EnvironmentId", "Id")
            $url = Get-Value $item @("Environment Url", "EnvironmentUrl", "Url")

            if ($name -ceq $env:REQUESTED_ENVIRONMENT -or
                $id -ceq $env:REQUESTED_ENVIRONMENT -or
                (Normalize-Url $url) -eq (Normalize-Url $env:REQUESTED_ENVIRONMENT)) {
              $match = $item
              break
            }
          }

          if ($null -eq $match) {
            "environment_found=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_id=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_name=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_url=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_type=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          "environment_found=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_id=$(Get-Value $match @('Environment Id','EnvironmentId','Id'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_name=$(Get-Value $match @('Environment','DisplayName','EnvironmentName','FriendlyName','Name'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_url=$(Get-Value $match @('Environment Url','EnvironmentUrl','Url'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_type=$(Get-Value $match @('Type','EnvironmentType'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Stop when environment does not exist
        if: steps.resolve.outputs.environment_found == 'false'
        shell: pwsh
        run: |
          "The environment was not found. Nothing was deleted." | Write-Host

      - name: Verify deletion safety
        id: verify
        if: steps.resolve.outputs.environment_found == 'true'
        shell: pwsh
        env:
          RESOLVED_NAME: ${{ steps.resolve.outputs.environment_name }}
          RESOLVED_TYPE: ${{ steps.resolve.outputs.environment_type }}
          EXPECTED_NAME: ""
          EXPECTED_PREFIX: ${{ inputs.expected_environment_name_prefix }}
          ALLOWED_TYPES: ${{ inputs.allowed_environment_types }}
          CONFIRMATION: ${{ inputs.deletion_confirmation }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_PREFIX)) {
            throw "expected_environment_name_prefix cannot be blank."
          }

          if (-not $env:RESOLVED_NAME.StartsWith(
              $env:EXPECTED_PREFIX,
              [System.StringComparison]::OrdinalIgnoreCase
            )) {
            throw "Resolved environment name does not match the approved prefix."
          }

          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_NAME) -and
              $env:RESOLVED_NAME -cne $env:EXPECTED_NAME) {
            throw "Resolved environment name does not match expected_environment_name."
          }

          $allowed = @($env:ALLOWED_TYPES.Split(',') | ForEach-Object { $_.Trim() })

          if ($env:RESOLVED_TYPE -in @("Production", "Default") -or
              $allowed -notcontains $env:RESOLVED_TYPE) {
            throw "Environment type '$env:RESOLVED_TYPE' is protected or not approved."
          }

          $expectedConfirmation = "DELETE:$($env:RESOLVED_NAME)"
          if ($env:CONFIRMATION -cne $expectedConfirmation) {
            throw "Deletion requires confirmation text: $expectedConfirmation"
          }

          "ownership_verified=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Delete environment
        id: remove
        if: steps.resolve.outputs.environment_found == 'true' && steps.verify.outputs.ownership_verified == 'true'
        shell: pwsh
        env:
          ENVIRONMENT_ID: ${{ steps.resolve.outputs.environment_id }}
          DELETE_ASYNC: ${{ inputs.asynchronous_delete }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          $arguments = @(
            "admin", "delete",
            "--environment", $env:ENVIRONMENT_ID,
            "--max-async-wait-time", $env:MAX_WAIT
          )

          if ($env:DELETE_ASYNC -eq "true") {
            $arguments += "--async"
          }

          "deletion_started=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          & pac @arguments
          if ($LASTEXITCODE -ne 0) {
            "deleted=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "deletion_status=Failed" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            throw "The Power Platform environment could not be deleted."
          }

          "deleted=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "deletion_status=Deleted" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Record not-found deletion result
        id: not_found
        if: steps.resolve.outputs.environment_found == 'false'
        shell: pwsh
        run: |
          "deletion_started=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "deleted=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "deletion_status=NotFound" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Add deletion summary
        if: always()
        shell: pwsh
        env:
          FOUND: ${{ steps.resolve.outputs.environment_found }}
          NAME: ${{ steps.resolve.outputs.environment_name }}
          TYPE: ${{ steps.resolve.outputs.environment_type }}
          URL: ${{ steps.resolve.outputs.environment_url }}
          VERIFIED: ${{ steps.verify.outputs.ownership_verified }}
          STATUS: ${{ steps.remove.outputs.deletion_status || steps.not_found.outputs.deletion_status }}
        run: |
          @"
          # Workspace deletion

          **Environment found:** ``$env:FOUND``

          **Environment:** [$env:NAME]($env:URL)

          **Type:** ``$env:TYPE``

          **Safety checks passed:** ``$env:VERIFIED``

          **Deletion status:** ``$env:STATUS``
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
