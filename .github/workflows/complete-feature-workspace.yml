name: Reusable - Complete Power Platform Feature Workspace

on:
  workflow_call:
    inputs:
      project_key:
        required: true
        type: string
      verification_ref:
        description: Git ref used to verify or refresh the developer environment
        required: false
        default: main
        type: string
      developer_alias:
        required: true
        type: string
      developer_environment:
        description: Developer environment name, URL or ID
        required: true
        type: string

      solution_name:
        required: true
        type: string
      solution_source_folder:
        required: true
        type: string
      solution_package_type:
        required: false
        default: Unmanaged
        type: string
      deployment_settings_file:
        required: false
        default: ""
        type: string

      verify_no_uncommitted_changes:
        required: false
        default: true
        type: boolean
      drift_policy:
        description: Fail or ReportOnly
        required: false
        default: Fail
        type: string

      validation_environment:
        description: Temporary validation environment name, URL or ID
        required: false
        default: ""
        type: string
      delete_validation_environment:
        required: false
        default: true
        type: boolean
      expected_validation_name_prefix:
        required: false
        default: ""
        type: string

      developer_environment_cleanup_mode:
        description: Keep, RefreshFromRef, RemoveSolution or DeleteEnvironment
        required: false
        default: Keep
        type: string
      expected_developer_name_prefix:
        required: false
        default: ""
        type: string
      destructive_confirmation:
        description: DELETE-SOLUTION:name or DELETE:environment-name
        required: false
        default: ""
        type: string
      allowed_environment_types:
        description: Comma-separated environment types allowed for deletion
        required: false
        default: Developer,Sandbox,Trial,SubscriptionBasedTrial
        type: string

      force_overwrite:
        required: false
        default: true
        type: boolean
      publish_changes:
        required: false
        default: true
        type: boolean
      asynchronous_import:
        required: false
        default: false
        type: boolean
      max_async_wait_minutes:
        required: false
        default: 60
        type: number
      upload_drift_artifact:
        required: false
        default: true
        type: boolean
      artifact_retention_days:
        required: false
        default: 7
        type: number

    secrets:
      pp_tenant_id:
        required: true
      pp_app_id:
        required: true
      pp_client_secret:
        required: true

    outputs:
      drift_check_completed:
        value: ${{ jobs.complete.outputs.drift_check_completed }}
      drift_detected:
        value: ${{ jobs.complete.outputs.drift_detected }}
      drift_status:
        value: ${{ jobs.complete.outputs.drift_status }}
      validation_environment_found:
        value: ${{ jobs.complete.outputs.validation_environment_found }}
      validation_environment_deleted:
        value: ${{ jobs.complete.outputs.validation_environment_deleted }}
      developer_environment_action:
        value: ${{ jobs.complete.outputs.developer_environment_action }}
      developer_environment_retained:
        value: ${{ jobs.complete.outputs.developer_environment_retained }}
      developer_environment_deleted:
        value: ${{ jobs.complete.outputs.developer_environment_deleted }}
      developer_environment_url:
        value: ${{ jobs.complete.outputs.developer_environment_url }}
      cleanup_completed:
        value: ${{ jobs.complete.outputs.cleanup_completed }}

permissions:
  contents: read

jobs:
  complete:
    name: Complete feature workspace
    runs-on: windows-latest
    timeout-minutes: 150

    concurrency:
      group: power-platform-complete-${{ github.repository }}-${{ inputs.developer_alias }}
      cancel-in-progress: false

    outputs:
      drift_check_completed: ${{ steps.drift.outputs.drift_check_completed }}
      drift_detected: ${{ steps.drift.outputs.drift_detected }}
      drift_status: ${{ steps.drift.outputs.drift_status }}
      validation_environment_found: ${{ steps.validation_cleanup.outputs.environment_found }}
      validation_environment_deleted: ${{ steps.validation_cleanup.outputs.environment_deleted }}
      developer_environment_action: ${{ steps.developer_cleanup.outputs.environment_action }}
      developer_environment_retained: ${{ steps.developer_cleanup.outputs.environment_retained }}
      developer_environment_deleted: ${{ steps.developer_cleanup.outputs.environment_deleted }}
      developer_environment_url: ${{ steps.developer_environment.outputs.environment_url }}
      cleanup_completed: ${{ steps.result.outputs.cleanup_completed }}

    steps:
      - name: Check out verification ref
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.verification_ref }}
          fetch-depth: 0

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: "true"

      - name: Validate cleanup configuration
        shell: pwsh
        env:
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          DRIFT_POLICY: ${{ inputs.drift_policy }}
          CLEANUP_MODE: ${{ inputs.developer_environment_cleanup_mode }}
          PACKAGE_TYPE: ${{ inputs.solution_package_type }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:SOLUTION_SOURCE_FOLDER -PathType Container)) {
            throw "solution_source_folder was not found: $env:SOLUTION_SOURCE_FOLDER"
          }

          if (@("Fail", "ReportOnly") -notcontains $env:DRIFT_POLICY) {
            throw "drift_policy must be Fail or ReportOnly."
          }

          if (@("Keep", "RefreshFromRef", "RemoveSolution", "DeleteEnvironment") -notcontains $env:CLEANUP_MODE) {
            throw "developer_environment_cleanup_mode is not supported."
          }

          if (@("Unmanaged", "Managed") -notcontains $env:PACKAGE_TYPE) {
            throw "solution_package_type must be Unmanaged or Managed."
          }

      - name: Authenticate for environment administration
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-complete-admin" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Environment administration authentication failed."
          }

      - name: Resolve developer environment
        id: developer_environment
        shell: pwsh
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.developer_environment }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Value($Object, [string[]]$Names) {
            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties[$name]
              if ($null -ne $property -and -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                return [string]$property.Value
              }
            }
            return ""
          }

          function Normalize-Url([string]$Value) {
            return $Value.Trim().TrimEnd('/').ToLowerInvariant()
          }

          $raw = & pac admin list --environment "$env:REQUESTED_ENVIRONMENT" --json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list Power Platform environments."
          }

          $parsed = ($raw -join "`n") | ConvertFrom-Json
          $items = if ($null -ne $parsed.value) { @($parsed.value) } else { @($parsed) }
          $match = $null

          foreach ($item in $items) {
            $name = Get-Value $item @("Environment", "DisplayName", "EnvironmentName", "FriendlyName", "Name")
            $id = Get-Value $item @("Environment Id", "EnvironmentId", "Id")
            $url = Get-Value $item @("Environment Url", "EnvironmentUrl", "Url")

            if ($name -ceq $env:REQUESTED_ENVIRONMENT -or
                $id -ceq $env:REQUESTED_ENVIRONMENT -or
                (Normalize-Url $url) -eq (Normalize-Url $env:REQUESTED_ENVIRONMENT)) {
              $match = $item
              break
            }
          }

          if ($null -eq $match) {
            throw "The developer environment could not be resolved exactly."
          }

          "environment_id=$(Get-Value $match @('Environment Id','EnvironmentId','Id'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_name=$(Get-Value $match @('Environment','DisplayName','EnvironmentName','FriendlyName','Name'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_url=$(Get-Value $match @('Environment Url','EnvironmentUrl','Url'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_type=$(Get-Value $match @('Type','EnvironmentType'))" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate to developer environment
        if: inputs.verify_no_uncommitted_changes || inputs.developer_environment_cleanup_mode == 'RefreshFromRef' || inputs.developer_environment_cleanup_mode == 'RemoveSolution'
        shell: pwsh
        env:
          PP_TENANT_ID: ${{ secrets.pp_tenant_id }}
          PP_APP_ID: ${{ secrets.pp_app_id }}
          PP_CLIENT_SECRET: ${{ secrets.pp_client_secret }}
          ENVIRONMENT_URL: ${{ steps.developer_environment.outputs.environment_url }}
        run: |
          $ErrorActionPreference = "Stop"

          pac auth create `
            --name "pp-complete-dev" `
            --applicationId "$env:PP_APP_ID" `
            --clientSecret "$env:PP_CLIENT_SECRET" `
            --tenant "$env:PP_TENANT_ID" `
            --environment "$env:ENVIRONMENT_URL"

          if ($LASTEXITCODE -ne 0) {
            throw "Authentication to the developer environment failed."
          }

      - name: Check for environment drift
        id: drift
        shell: pwsh
        env:
          VERIFY: ${{ inputs.verify_no_uncommitted_changes }}
          DRIFT_POLICY: ${{ inputs.drift_policy }}
          ENVIRONMENT_URL: ${{ steps.developer_environment.outputs.environment_url }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          PACKAGE_TYPE: ${{ inputs.solution_package_type }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:VERIFY -ne "true") {
            "drift_check_completed=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "drift_detected=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "drift_status=Skipped" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $root = Join-Path $env:RUNNER_TEMP "power-platform-drift"
          $unpacked = Join-Path $root "environment-source"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path $unpacked -Force | Out-Null

          $zip = Join-Path $root "$($env:SOLUTION_NAME)-drift.zip"
          $log = Join-Path $root "drift-unpack.log"

          & pac solution export `
            --environment "$env:ENVIRONMENT_URL" `
            --name "$env:SOLUTION_NAME" `
            --path "$zip" `
            --overwrite `
            --async `
            --max-async-wait-time "$env:MAX_WAIT"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to export the developer solution for drift checking."
          }

          & pac solution unpack `
            --zipfile "$zip" `
            --folder "$unpacked" `
            --packagetype "$env:PACKAGE_TYPE" `
            --allowWrite `
            --allowDelete `
            --clobber `
            --errorlevel Verbose `
            --log "$log"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to unpack the developer solution for drift checking."
          }

          git diff --no-index --ignore-cr-at-eol --exit-code -- "$env:SOLUTION_SOURCE_FOLDER" "$unpacked" | Out-Host
          $diffExit = $LASTEXITCODE

          if ($diffExit -eq 0) {
            "drift_check_completed=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "drift_detected=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "drift_status=Clean" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          if ($diffExit -gt 1) {
            throw "The drift comparison command failed."
          }

          "drift_check_completed=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "drift_detected=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "drift_status=Changed" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_folder=$root" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($env:DRIFT_POLICY -eq "Fail") {
            throw "The developer environment contains solution changes that are not present in ${{ inputs.verification_ref }}."
          }

      - name: Upload drift artifact
        if: inputs.upload_drift_artifact && steps.drift.outputs.drift_detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.solution_name }}-drift-${{ github.run_number }}
          path: ${{ steps.drift.outputs.artifact_folder }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Clean validation environment
        id: validation_cleanup
        shell: pwsh
        env:
          DELETE_VALIDATION: ${{ inputs.delete_validation_environment }}
          REQUESTED_ENVIRONMENT: ${{ inputs.validation_environment }}
          EXPECTED_PREFIX: ${{ inputs.expected_validation_name_prefix }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:DELETE_VALIDATION -ne "true" -or
              [string]::IsNullOrWhiteSpace($env:REQUESTED_ENVIRONMENT)) {
            "environment_found=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_deleted=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          function Get-Value($Object, [string[]]$Names) {
            foreach ($name in $Names) {
              $property = $Object.PSObject.Properties[$name]
              if ($null -ne $property -and -not [string]::IsNullOrWhiteSpace([string]$property.Value)) {
                return [string]$property.Value
              }
            }
            return ""
          }

          function Normalize-Url([string]$Value) {
            return $Value.Trim().TrimEnd('/').ToLowerInvariant()
          }

          $raw = & pac admin list --environment "$env:REQUESTED_ENVIRONMENT" --json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list validation environments."
          }

          $text = $raw -join "`n"
          if ([string]::IsNullOrWhiteSpace($text)) {
            "environment_found=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_deleted=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $parsed = $text | ConvertFrom-Json
          $items = if ($null -ne $parsed.value) { @($parsed.value) } else { @($parsed) }
          $match = $null

          foreach ($item in $items) {
            $name = Get-Value $item @("Environment", "DisplayName", "EnvironmentName", "FriendlyName", "Name")
            $id = Get-Value $item @("Environment Id", "EnvironmentId", "Id")
            $url = Get-Value $item @("Environment Url", "EnvironmentUrl", "Url")

            if ($name -ceq $env:REQUESTED_ENVIRONMENT -or
                $id -ceq $env:REQUESTED_ENVIRONMENT -or
                (Normalize-Url $url) -eq (Normalize-Url $env:REQUESTED_ENVIRONMENT)) {
              $match = $item
              break
            }
          }

          if ($null -eq $match) {
            "environment_found=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_deleted=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $name = Get-Value $match @("Environment", "DisplayName", "EnvironmentName", "FriendlyName", "Name")
          $id = Get-Value $match @("Environment Id", "EnvironmentId", "Id")
          $type = Get-Value $match @("Type", "EnvironmentType")

          if ($type -in @("Production", "Default")) {
            throw "Protected validation environment type cannot be deleted: $type"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_PREFIX) -and
              -not $name.StartsWith($env:EXPECTED_PREFIX, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Validation environment '$name' does not match the expected prefix."
          }

          & pac admin delete `
            --environment "$id" `
            --async `
            --max-async-wait-time "$env:MAX_WAIT"

          if ($LASTEXITCODE -ne 0) {
            throw "The validation environment could not be deleted."
          }

          "environment_found=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "environment_deleted=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Apply developer environment cleanup
        id: developer_cleanup
        shell: pwsh
        env:
          CLEANUP_MODE: ${{ inputs.developer_environment_cleanup_mode }}
          ENVIRONMENT_ID: ${{ steps.developer_environment.outputs.environment_id }}
          ENVIRONMENT_NAME: ${{ steps.developer_environment.outputs.environment_name }}
          ENVIRONMENT_URL: ${{ steps.developer_environment.outputs.environment_url }}
          ENVIRONMENT_TYPE: ${{ steps.developer_environment.outputs.environment_type }}
          EXPECTED_PREFIX: ${{ inputs.expected_developer_name_prefix }}
          CONFIRMATION: ${{ inputs.destructive_confirmation }}
          ALLOWED_TYPES: ${{ inputs.allowed_environment_types }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          SOLUTION_SOURCE_FOLDER: ${{ inputs.solution_source_folder }}
          PACKAGE_TYPE: ${{ inputs.solution_package_type }}
          SETTINGS_FILE: ${{ inputs.deployment_settings_file }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite }}
          PUBLISH_CHANGES: ${{ inputs.publish_changes }}
          ASYNC_IMPORT: ${{ inputs.asynchronous_import }}
          MAX_WAIT: ${{ inputs.max_async_wait_minutes }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:CLEANUP_MODE -eq "Keep") {
            "environment_action=Kept" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_retained=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_deleted=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          if ($env:CLEANUP_MODE -eq "RefreshFromRef") {
            $root = Join-Path $env:RUNNER_TEMP "power-platform-refresh"
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            $zip = Join-Path $root "$($env:SOLUTION_NAME)-refresh.zip"

            & pac solution pack `
              --zipfile "$zip" `
              --folder "$env:SOLUTION_SOURCE_FOLDER" `
              --packagetype "$env:PACKAGE_TYPE"

            if ($LASTEXITCODE -ne 0) {
              throw "The verification-ref solution could not be packed."
            }

            $arguments = @(
              "solution", "import",
              "--path", $zip,
              "--environment", $env:ENVIRONMENT_URL,
              "--max-async-wait-time", $env:MAX_WAIT
            )
            if ($env:FORCE_OVERWRITE -eq "true") { $arguments += "--force-overwrite" }
            if ($env:PUBLISH_CHANGES -eq "true") { $arguments += "--publish-changes" }
            if ($env:ASYNC_IMPORT -eq "true") { $arguments += "--async" }
            if (-not [string]::IsNullOrWhiteSpace($env:SETTINGS_FILE)) {
              $arguments += @("--settings-file", $env:SETTINGS_FILE)
            }

            & pac @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "The developer environment could not be refreshed."
            }

            "environment_action=Refreshed" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_retained=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_deleted=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          if ($env:CLEANUP_MODE -eq "RemoveSolution") {
            $expected = "DELETE-SOLUTION:$($env:SOLUTION_NAME)"
            if ($env:CONFIRMATION -cne $expected) {
              throw "Removal requires confirmation text: $expected"
            }

            & pac solution delete `
              --environment "$env:ENVIRONMENT_URL" `
              --solution-name "$env:SOLUTION_NAME"

            if ($LASTEXITCODE -ne 0) {
              throw "The solution could not be removed from the developer environment."
            }

            "environment_action=SolutionRemoved" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_retained=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_deleted=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          if ($env:CLEANUP_MODE -eq "DeleteEnvironment") {
            $allowed = @($env:ALLOWED_TYPES.Split(',') | ForEach-Object { $_.Trim() })
            if ($allowed -notcontains $env:ENVIRONMENT_TYPE -or
                $env:ENVIRONMENT_TYPE -in @("Production", "Default")) {
              throw "Environment type '$env:ENVIRONMENT_TYPE' is not allowed for deletion."
            }

            if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_PREFIX) -and
                -not $env:ENVIRONMENT_NAME.StartsWith($env:EXPECTED_PREFIX, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Developer environment name does not match the expected prefix."
            }

            $expected = "DELETE:$($env:ENVIRONMENT_NAME)"
            if ($env:CONFIRMATION -cne $expected) {
              throw "Environment deletion requires confirmation text: $expected"
            }

            & pac admin delete `
              --environment "$env:ENVIRONMENT_ID" `
              --async `
              --max-async-wait-time "$env:MAX_WAIT"

            if ($LASTEXITCODE -ne 0) {
              throw "The developer environment could not be deleted."
            }

            "environment_action=Deleted" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_retained=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "environment_deleted=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Record completion
        id: result
        shell: pwsh
        run: |
          "cleanup_completed=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Add completion summary
        if: always()
        shell: pwsh
        env:
          DRIFT_STATUS: ${{ steps.drift.outputs.drift_status }}
          VALIDATION_DELETED: ${{ steps.validation_cleanup.outputs.environment_deleted }}
          DEVELOPER_ACTION: ${{ steps.developer_cleanup.outputs.environment_action }}
          DEVELOPER_NAME: ${{ steps.developer_environment.outputs.environment_name }}
          DEVELOPER_URL: ${{ steps.developer_environment.outputs.environment_url }}
        run: |
          @"
          # Feature workspace completion

          **Drift status:** ``$env:DRIFT_STATUS``

          **Temporary validation environment deleted:** ``$env:VALIDATION_DELETED``

          **Developer environment action:** ``$env:DEVELOPER_ACTION``

          **Developer environment:** [$env:DEVELOPER_NAME]($env:DEVELOPER_URL)
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
