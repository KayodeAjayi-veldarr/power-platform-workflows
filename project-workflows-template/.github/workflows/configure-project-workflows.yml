name: Configure Project Workflows

run-name: >-
  Configure Power Platform workflows for ${{ inputs.solution_name }}

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: Short project identifier, for example chess-demo
        required: true
        type: string

      solution_name:
        description: Power Platform solution unique name
        required: true
        type: string

      default_solution_folder:
        description: Repository folder for the unpacked solution
        required: true
        default: power-platform-solution
        type: string

      default_developer_alias:
        description: Short developer identifier
        required: true
        type: string

      default_developer_upn:
        description: Developer Microsoft 365 email address
        required: true
        type: string

      base_branch:
        description: Base branch value written into generated workflows
        required: true
        default: main
        type: string

      default_build_environment:
        description: Optional clean build environment for managed releases
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  configure:
    uses: KayodeAjayi-Veldarr/power-platform-workflows/.github/workflows/bootstrap-project-workflows.yml@main
    with:
      project_key: ${{ inputs.project_key }}
      solution_name: ${{ inputs.solution_name }}
      default_solution_folder: ${{ inputs.default_solution_folder }}
      default_developer_alias: ${{ inputs.default_developer_alias }}
      default_developer_upn: ${{ inputs.default_developer_upn }}
      base_branch: ${{ inputs.base_branch }}
      default_build_environment: ${{ inputs.default_build_environment }}
      reusable_workflow_repository: KayodeAjayi-Veldarr/power-platform-workflows
      reusable_workflow_ref: main

