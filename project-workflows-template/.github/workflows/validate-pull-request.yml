# Generated by Install-ProjectWorkflows.ps1 using PROJECT-DETAILS.txt.
# Do not add project-level Actions variables for these project values.

name: Validate Power Platform Pull Request

on:
  pull_request:
    branches:
      - __BASE_BRANCH__
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to validate. Leave blank to use the selected workflow branch.
        required: false
        default: ""
        type: string

      solution_folder:
        description: Repository folder containing the solution to validate
        required: false
        default: "__DEFAULT_SOLUTION_FOLDER__"
        type: string

      validation_environment_type:
        description: Temporary environment type
        required: true
        default: Sandbox
        type: choice
        options:
          - Sandbox
          - Trial

      validation_environment_region:
        description: Region used for the temporary environment
        required: true
        default: "__TARGET_REGION__"
        type: string

      validation_environment_currency:
        description: Currency code used for the temporary environment
        required: true
        default: "__TARGET_CURRENCY__"
        type: string

      validation_environment_language:
        description: Language used for the temporary environment
        required: true
        default: "__TARGET_LANGUAGE__"
        type: string

      retain_validation_environment_on_failure:
        description: Keep the temporary environment when validation fails
        required: true
        default: false
        type: boolean

      run_solution_checker:
        description: Run Power Apps Solution Checker
        required: true
        default: true
        type: boolean

      checker_fail_on_errors:
        description: Fail when Solution Checker returns error-level findings
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve_solution_folder:
    name: Resolve solution folder
    runs-on: ubuntu-latest
    outputs:
      solution_folder: ${{ steps.resolve.outputs.solution_folder }}

    steps:
      - name: Check out validation source
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event.pull_request.head.sha ||
            inputs.source_ref ||
            github.ref_name }}
          fetch-depth: 0

      - name: Resolve solution folder
        id: resolve
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_FOLDER: ${{ inputs.solution_folder }}
          DEFAULT_FOLDER: "__DEFAULT_SOLUTION_FOLDER__"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $selectedFolder = ""

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $selectedFolder = $env:REQUESTED_FOLDER

            if ([string]::IsNullOrWhiteSpace($selectedFolder)) {
              $selectedFolder = $env:DEFAULT_FOLDER
            }
          }
          else {
            $changedFiles = @()

            if (
              -not [string]::IsNullOrWhiteSpace($env:BASE_SHA) -and
              -not [string]::IsNullOrWhiteSpace($env:HEAD_SHA)
            ) {
              $changedFiles = @(
                git diff --name-only "$($env:BASE_SHA)" "$($env:HEAD_SHA)"
              )

              if ($LASTEXITCODE -ne 0) {
                throw "Could not inspect the pull request changes."
              }
            }

            $candidateFolders = @(
              foreach ($changedFile in $changedFiles) {
                $normalisedPath = ([string]$changedFile).Replace('\', '/')

                if ($normalisedPath -match '^(?<folder>.+?)/src(?:/|$)') {
                  $Matches.folder
                }
              }
            ) | Sort-Object -Unique

            if ($candidateFolders.Count -eq 1) {
              $selectedFolder = $candidateFolders[0]
            }
            elseif ($candidateFolders.Count -gt 1) {
              throw (
                "More than one solution folder changed in this pull request: " +
                ($candidateFolders -join ', ') +
                ". Run the workflow manually and select one folder, or split the changes into separate pull requests."
              )
            }
            else {
              $selectedFolder = $env:DEFAULT_FOLDER
            }
          }

          $selectedFolder = ([string]$selectedFolder).Replace('\', '/')

          if (
            $selectedFolder.StartsWith('/') -or
            $selectedFolder -match '^[A-Za-z]:'
          ) {
            throw "solution_folder must be relative to the repository root."
          }

          $selectedFolder = $selectedFolder.Trim('/')
          $segments = @($selectedFolder.Split('/') | Where-Object { $_ -ne '' })

          if (
            [string]::IsNullOrWhiteSpace($selectedFolder) -or
            $segments -contains '..'
          ) {
            throw "solution_folder is empty or contains an unsafe path segment."
          }

          $solutionSourceFolder = "$selectedFolder/src"

          if (-not (Test-Path -LiteralPath $solutionSourceFolder -PathType Container)) {
            throw "The selected solution source folder was not found: $solutionSourceFolder"
          }

          "solution_folder=$selectedFolder" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

  validate:
    needs: resolve_solution_folder
    uses: __REUSABLE_WORKFLOW_REPOSITORY__/.github/workflows/validate-pull-request.yml@__REUSABLE_WORKFLOW_REF__

    with:
      project_key: "__PROJECT_KEY__"

      source_ref: >-
        ${{ github.event.pull_request.head.sha ||
        inputs.source_ref ||
        github.ref_name }}

      pull_request_number: >-
        ${{ github.event.pull_request.number || 0 }}

      solution_name: "__SOLUTION_NAME__"
      solution_source_folder: ${{ format('{0}/src', needs.resolve_solution_folder.outputs.solution_folder) }}
      solution_package_type: Unmanaged
      run_solution_checker: >-
        ${{ github.event_name != 'workflow_dispatch' ||
        inputs.run_solution_checker }}

      checker_geo: "__CHECKER_GEO__"
      checker_rule_set: "__CHECKER_RULE_SET__"

      checker_fail_on_errors: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        inputs.checker_fail_on_errors || false }}

      create_temporary_validation_environment: true
      delete_validation_environment_after_validation: true

      retain_validation_environment_on_failure: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        inputs.retain_validation_environment_on_failure || false }}

      validation_environment_name_prefix: "__PROJECT_KEY__"

      validation_environment_type: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        inputs.validation_environment_type || 'Sandbox' }}

      validation_environment_region: >-
        ${{ inputs.validation_environment_region || '__TARGET_REGION__' }}

      validation_environment_currency: >-
        ${{ inputs.validation_environment_currency || '__TARGET_CURRENCY__' }}

      validation_environment_language: >-
        ${{ inputs.validation_environment_language || '__TARGET_LANGUAGE__' }}

      validation_environment_templates: "__VALIDATION_TEMPLATES__"
      validation_environment_security_group_id: "__VALIDATION_SECURITY_GROUP_ID__"

      environment_create_async: false
      environment_stabilization_seconds: 180
      force_overwrite: true
      publish_changes: true
      asynchronous_import: false

      max_async_wait_minutes: 60
      environment_lookup_attempts: 20
      environment_lookup_delay_seconds: 30

      upload_validation_artifacts: true
      artifact_retention_days: 14

    secrets:
      pp_tenant_id: ${{ secrets.PP_TENANT_ID }}
      pp_app_id: ${{ secrets.PP_APP_ID }}
      pp_client_secret: ${{ secrets.PP_CLIENT_SECRET }}
