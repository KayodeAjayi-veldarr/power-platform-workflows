# Generated by Install-ProjectWorkflows.ps1 using PROJECT-DETAILS.txt.
# Do not add project-level Actions variables for these project values.

name: Deploy Solution from Git

run-name: >-
  Deploy __SOLUTION_NAME__ from ${{ inputs.source_ref }}
  to ${{ inputs.target_environment }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or commit to deploy
        required: true
        default: __BASE_BRANCH__
        type: string

      solution_folder:
        description: Repository folder containing the solution to deploy
        required: true
        default: "__DEFAULT_SOLUTION_FOLDER__"
        type: string

      target_environment:
        description: Target environment name, URL or ID
        required: true
        type: string

      solution_package_type:
        description: Package type to deploy
        required: true
        default: Unmanaged
        type: choice
        options:
          - Unmanaged
          - Managed

      publish_changes:
        description: Publish changes after successful import
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    uses: __REUSABLE_WORKFLOW_REPOSITORY__/.github/workflows/deploy-solution.yml@__REUSABLE_WORKFLOW_REF__

    with:
      project_key: "__PROJECT_KEY__"
      source_ref: ${{ inputs.source_ref }}

      solution_name: "__SOLUTION_NAME__"
      solution_source_folder: ${{ format('{0}/src', inputs.solution_folder) }}
      solution_package_type: ${{ inputs.solution_package_type }}

      target_environment: ${{ inputs.target_environment }}
      deployment_settings_file: "__DEPLOYMENT_SETTINGS_FILE__"

      force_overwrite: true
      publish_changes: ${{ inputs.publish_changes }}
      asynchronous_import: false
      max_async_wait_minutes: 60

      upload_solution_artifact: true
      artifact_retention_days: 14

    secrets:
      pp_tenant_id: ${{ secrets.PP_TENANT_ID }}
      pp_app_id: ${{ secrets.PP_APP_ID }}
      pp_client_secret: ${{ secrets.PP_CLIENT_SECRET }}
