# Generated by Install-ProjectWorkflows.ps1 using PROJECT-DETAILS.txt.
# Do not add project-level Actions variables for these project values.

name: 4. Build and Deploy Solution

run-name: >-
  Build and deploy __SOLUTION_NAME__ from ${{ inputs.source_ref }}
  to ${{ inputs.target_environment }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or commit to deploy
        required: true
        default: __BASE_BRANCH__
        type: string

      solution_folder:
        description: Repository folder containing the solution source
        required: true
        default: "__DEFAULT_SOLUTION_FOLDER__"
        type: string

      build_environment:
        description: Clean build environment name, URL or ID
        required: true
        default: "__DEFAULT_BUILD_ENVIRONMENT__"
        type: string

      target_environment:
        description: Target environment name, URL or ID
        required: true
        type: string

      solution_package_type:
        description: Managed is recommended outside development
        required: true
        default: Managed
        type: choice
        options:
          - Managed
          - Unmanaged

      commit_solution_zip:
        description: Commit the exact release ZIP to this repository
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  deploy:
    uses: __REUSABLE_WORKFLOW_REPOSITORY__/.github/workflows/deploy-solution.yml@__REUSABLE_WORKFLOW_REF__

    with:
      project_key: "__PROJECT_KEY__"
      source_ref: ${{ inputs.source_ref }}
      solution_name: "__SOLUTION_NAME__"
      solution_source_folder: ${{ format('{0}/src', inputs.solution_folder) }}
      solution_package_type: ${{ inputs.solution_package_type }}
      build_environment: ${{ inputs.build_environment }}
      target_environment: ${{ inputs.target_environment }}
      auto_bind_connection_references: false
      require_connection_bindings: false
      provision_dataverse_connections: false
      automation_role: "__AUTOMATION_ROLE__"
      force_overwrite: true
      publish_changes: true
      activate_plugins: false
      asynchronous_import: true
      max_async_wait_minutes: 60
      upload_solution_artifact: true
      artifact_retention_days: 14
      commit_solution_zip: ${{ inputs.commit_solution_zip }}
      solution_zip_repository_folder: ${{ format('{0}/package/release', inputs.solution_folder) }}

    secrets:
      pp_tenant_id: ${{ secrets.PP_TENANT_ID }}
      pp_app_id: ${{ secrets.PP_APP_ID }}
      pp_client_secret: ${{ secrets.PP_CLIENT_SECRET }}
