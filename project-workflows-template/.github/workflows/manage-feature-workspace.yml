name: Manage Feature Workspace

run-name: >-
  ${{ inputs.workspace_action }} workspace for
  ${{ inputs.developer_alias || vars.PP_DEFAULT_DEVELOPER_ALIAS }}

on:
  workflow_dispatch:
    inputs:
      workspace_action:
        description: Prepare or remove a developer workspace
        required: true
        default: PrepareOrReuse
        type: choice
        options:
          - PrepareOrReuse
          - DeleteEnvironment

      developer_alias:
        description: Short developer identifier. Leave blank to use the repository variable.
        required: false
        default: ""
        type: string

      developer_upn:
        description: Developer Microsoft 365 email. Leave blank to use the repository variable.
        required: false
        default: ""
        type: string

      source_environment:
        description: Source environment URL, ID or unique name. Leave blank to use the repository variable.
        required: false
        default: ""
        type: string

      source_solution_name:
        description: Source solution unique name. Leave blank to use the project solution.
        required: false
        default: ""
        type: string

      workspace_environment:
        description: >
          PrepareOrReuse: exact environment display name, or blank to generate.
          DeleteEnvironment: environment name, URL or ID.
          Leave blank to use the repository variable.
        required: false
        default: ""
        type: string

      workspace_environment_domain:
        description: Dataverse domain used only when creating a new environment
        required: false
        default: ""
        type: string

      workspace_environment_type:
        description: Environment type used only when creating a new environment
        required: true
        default: Developer
        type: choice
        options:
          - Developer
          - Sandbox
          - Trial

      workspace_environment_region:
        description: Region used only when creating a new environment
        required: false
        default: ""
        type: string

      workspace_environment_currency:
        description: Currency code used only when creating a new environment
        required: false
        default: ""
        type: string

      workspace_environment_language:
        description: Language used only when creating a new environment
        required: false
        default: ""
        type: string

      workspace_environment_mode:
        description: Reuse an existing environment or require a new one
        required: true
        default: ReuseOrCreate
        type: choice
        options:
          - ReuseOrCreate
          - CreateOnly

      deletion_confirmation:
        description: Required only for deletion. Enter DELETE:resolved-environment-name
        required: false
        default: ""
        type: string

      commit_baseline_to_branch:
        description: Commit the source-environment baseline to this branch
        required: true
        default: true
        type: boolean

      baseline_commit_message:
        description: Leave blank to use the standard baseline message
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  manage:
    uses: >-
      KayodeAjayi-Veldarr/power-platform-workflows/.github/workflows/manage-feature-workspace.yml@main

    with:
      workspace_action: ${{ inputs.workspace_action }}

      project_key: ${{ vars.PP_PROJECT_KEY }}
      branch_ref: ${{ github.ref_name }}
      base_branch: ${{ vars.PP_BASE_BRANCH || 'main' }}

      developer_alias: >-
        ${{ inputs.developer_alias ||
        vars.PP_DEFAULT_DEVELOPER_ALIAS }}

      developer_upn: >-
        ${{ inputs.developer_upn ||
        vars.PP_DEFAULT_DEVELOPER_UPN }}

      source_environment: >-
        ${{ inputs.source_environment ||
        vars.PP_DEFAULT_SOURCE_ENVIRONMENT }}

      source_solution_name: >-
        ${{ inputs.source_solution_name ||
        vars.PP_SOLUTION_NAME }}

      source_export_managed: false
      source_export_async: true

      solution_name: ${{ vars.PP_SOLUTION_NAME }}
      solution_project_folder: ${{ vars.PP_SOLUTION_PROJECT_FOLDER }}
      solution_source_folder: ${{ vars.PP_SOLUTION_SOURCE_FOLDER }}
      solution_package_type: Unmanaged
      deployment_settings_file: >-
        ${{ vars.PP_DEPLOYMENT_SETTINGS_FILE || '' }}

      commit_baseline_to_branch: ${{ inputs.commit_baseline_to_branch }}

      baseline_commit_message: >-
        ${{ inputs.baseline_commit_message ||
        format(
        'Sync {0} baseline from source environment',
        vars.PP_SOLUTION_NAME
        ) }}

      workspace_environment: >-
        ${{ inputs.workspace_environment ||
        vars.PP_DEFAULT_DEVELOPER_ENVIRONMENT }}

      workspace_environment_domain: >-
        ${{ inputs.workspace_environment_domain }}

      workspace_environment_suffix: >-
        ${{ vars.PP_DEVELOPER_ENVIRONMENT_SUFFIX || 'DEV' }}

      workspace_environment_mode: >-
        ${{ inputs.workspace_environment_mode }}

      workspace_environment_type: >-
        ${{ inputs.workspace_environment_type }}

      workspace_environment_region: >-
        ${{ inputs.workspace_environment_region ||
        vars.PP_TARGET_REGION }}

      workspace_environment_currency: >-
        ${{ inputs.workspace_environment_currency ||
        vars.PP_TARGET_CURRENCY }}

      workspace_environment_language: >-
        ${{ inputs.workspace_environment_language ||
        vars.PP_TARGET_LANGUAGE }}

      workspace_environment_templates: >-
        ${{ vars.PP_TARGET_TEMPLATES || '' }}

      workspace_environment_security_group_id: >-
        ${{ vars.PP_TARGET_SECURITY_GROUP_ID || '' }}

      environment_create_async: true

      assign_automation_user: true
      automation_role: >-
        ${{ vars.PP_AUTOMATION_ROLE || 'System Administrator' }}

      assign_developer: true
      developer_role: >-
        ${{ vars.PP_DEVELOPER_ROLE || 'System Administrator' }}

      force_overwrite: true
      publish_changes: true
      asynchronous_import: false

      deletion_confirmation: ${{ inputs.deletion_confirmation }}

      expected_environment_name_prefix: >-
        ${{ format('{0}-', vars.PP_PROJECT_KEY) }}

      allowed_environment_types: >-
        Developer,Sandbox,Trial,SubscriptionBasedTrial

      asynchronous_delete: true

      max_async_wait_minutes: 60
      environment_lookup_attempts: 20
      environment_lookup_delay_seconds: 30

      upload_solution_artifact: true
      artifact_retention_days: 7

      next_step_message: >-
        Open the imported solution and begin work on the selected feature branch.

    secrets:
      pp_tenant_id: ${{ secrets.PP_TENANT_ID }}
      pp_app_id: ${{ secrets.PP_APP_ID }}
      pp_client_secret: ${{ secrets.PP_CLIENT_SECRET }}

      # Uncomment only when the source environment uses different credentials.
      # source_pp_tenant_id: ${{ secrets.SOURCE_PP_TENANT_ID }}
      # source_pp_app_id: ${{ secrets.SOURCE_PP_APP_ID }}
      # source_pp_client_secret: ${{ secrets.SOURCE_PP_CLIENT_SECRET }}
