# Generated by Install-ProjectWorkflows.ps1 using PROJECT-DETAILS.txt.
# Do not add project-level Actions variables for these project values.

name: Commit Feature Changes

run-name: >-
  Commit __SOLUTION_NAME__ changes from ${{ inputs.developer_environment }}

on:
  workflow_dispatch:
    inputs:
      developer_alias:
        description: Short developer identifier
        required: true
        default: "__DEFAULT_DEVELOPER_ALIAS__"
        type: string

      developer_environment:
        description: Developer environment name, URL or ID
        required: true
        type: string

      solution_folder:
        description: Repository folder to update with this solution export
        required: true
        default: "__DEFAULT_SOLUTION_FOLDER__"
        type: string

      commit_message:
        description: Git commit message
        required: true
        default: "Sync __SOLUTION_NAME__ feature changes"
        type: string

      azure_work_item_ids:
        description: Azure Boards work item IDs, for example 123 or 123,456
        required: false
        default: ""
        type: string

      create_pull_request:
        description: Create a pull request after pushing the solution changes
        required: true
        default: true
        type: boolean

      pull_request_title:
        description: Leave blank to generate the title
        required: false
        default: ""
        type: string

      pull_request_draft:
        description: Create the pull request as a draft
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  commit:
    uses: __REUSABLE_WORKFLOW_REPOSITORY__/.github/workflows/commit-feature-changes.yml@__REUSABLE_WORKFLOW_REF__

    with:
      project_key: "__PROJECT_KEY__"
      branch_ref: ${{ github.ref_name }}
      base_branch: "__BASE_BRANCH__"

      developer_alias: ${{ inputs.developer_alias }}
      developer_environment: ${{ inputs.developer_environment }}

      solution_name: "__SOLUTION_NAME__"
      solution_project_folder: ${{ inputs.solution_folder }}
      solution_source_folder: ${{ format('{0}/src', inputs.solution_folder) }}
      export_managed: false
      export_async: true

      commit_changes: true
      push_changes: true
      commit_message: ${{ inputs.commit_message }}
      azure_work_item_ids: ${{ inputs.azure_work_item_ids }}
      create_pull_request: ${{ inputs.create_pull_request }}
      pull_request_title: ${{ inputs.pull_request_title }}
      pull_request_body: >-
        Power Platform changes exported from the feature developer environment.
      pull_request_draft: ${{ inputs.pull_request_draft }}

      upload_solution_artifact: true
      artifact_retention_days: 7

    secrets:
      pp_tenant_id: ${{ secrets.PP_TENANT_ID }}
      pp_app_id: ${{ secrets.PP_APP_ID }}
      pp_client_secret: ${{ secrets.PP_CLIENT_SECRET }}
